<style>
/*LEAFLET_CSS*/
/* Layout: app de bolsillo — encabezado fijo, una columna de 720px, barra de pestañas abajo como una app de tarjeta de tren. Los días son "estaciones" con color de línea por ciudad. */
:root {
  --bg: #F2F3EF; --surface: #FFFFFF; --sunk: #E8EAE4; --ink: #1A2130; --muted: #5B6372; --line: #D7DAD2;
  --accent: #2747A0; --accent-ink: #FFFFFF; --hot: #C8372A; --ok: #2F7D4F; --warn: #A86A12;
  --sea: #DCE6EE; --land: #F8F8F4; --coast: #A9B5C1;
  --c-TK: #E08600; --c-FJ: #2E86C9; --c-KY: #7B4FB8; --c-OS: #D2245A; --c-KB: #0E8C80; --c-KZ: #A9840F; --c-HD: #8A5A36;
  --font-d: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --font-m: "Overpass Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F131A; --surface: #171D27; --sunk: #1F2732; --ink: #E6E9EF; --muted: #9AA3B1; --line: #2A3341;
  --accent: #91A9F5; --accent-ink: #0F131A; --hot: #FF7A66; --ok: #5CC28A; --warn: #E3B04B;
  --sea: #132131; --land: #1E2733; --coast: #3B4A5C;
  --c-TK: #FFA23A; --c-FJ: #5AA9E6; --c-KY: #A983E6; --c-OS: #F25C8A; --c-KB: #2CC2B2; --c-KZ: #D9B23A; --c-HD: #C08A5E;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F131A; --surface: #171D27; --sunk: #1F2732; --ink: #E6E9EF; --muted: #9AA3B1; --line: #2A3341;
  --accent: #91A9F5; --accent-ink: #0F131A; --hot: #FF7A66; --ok: #5CC28A; --warn: #E3B04B;
  --sea: #132131; --land: #1E2733; --coast: #3B4A5C;
  --c-TK: #FFA23A; --c-FJ: #5AA9E6; --c-KY: #A983E6; --c-OS: #F25C8A; --c-KB: #2CC2B2; --c-KZ: #D9B23A; --c-HD: #C08A5E;
  color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-d); font-size: 15px; line-height: 1.55; margin: 0; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
.mono { font-family: var(--font-m); font-variant-numeric: tabular-nums; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* encabezado */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1 1 auto; }
.brand b { font-weight: 900; font-size: 18px; letter-spacing: .01em; white-space: nowrap; }
.brand span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .clock { margin-left: auto; text-align: right; font-size: 11px; color: var(--muted); line-height: 1.25; white-space: nowrap; }
.top .clock b { display: block; font-size: 16px; color: var(--ink); }

/* pestañas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); padding-block: 4px; }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: .02em; border-radius: 10px; }
.tabs a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs a[aria-current="page"] { color: var(--accent); }
.tabs a[aria-current="page"] svg { stroke-width: 2.3; }

main { padding-block: 18px 24px; display: grid; gap: 18px; }
.sec { display: grid; gap: 10px; }
.sec > h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }

/* chips y botones */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.chip.hot { color: var(--hot); border-color: color-mix(in srgb, var(--hot) 45%, transparent); background: color-mix(in srgb, var(--hot) 10%, transparent); }
.chip.sug { color: var(--muted); font-weight: 500; border-style: dashed; background: transparent; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 700; text-decoration: none; color: var(--ink); cursor: pointer; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* roundel tipo numeración de estación */
.st { --c: var(--accent); flex: none; width: 46px; height: 46px; border-radius: 50%; border: 5px solid var(--c); background: var(--surface); display: grid; place-items: center; line-height: 1; text-align: center; }
.st i { display: block; font-style: normal; font-family: var(--font-m); font-size: 9px; font-weight: 700; color: var(--c); letter-spacing: .04em; }
.st b { display: block; font-family: var(--font-m); font-size: 16px; font-weight: 700; }
.st.lg { width: 64px; height: 64px; border-width: 6px; }
.st.lg i { font-size: 11px; } .st.lg b { font-size: 22px; }

/* tablero de cuenta regresiva */
.board { background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; }
.board .lbl { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
.board .big { font-family: var(--font-m); font-size: clamp(44px, 14vw, 72px); font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.board .big small { font-size: .35em; letter-spacing: .04em; margin-left: 6px; }
.board .jp { font-size: 14px; opacity: .8; }
.flaps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.flaps div { background: color-mix(in srgb, var(--bg) 10%, transparent); border-radius: 8px; padding: 8px 6px; text-align: center; }
.flaps b { display: block; font-family: var(--font-m); font-size: 22px; }
.flaps span { font-size: 11px; opacity: .75; }

/* línea del itinerario */
.line { display: grid; }
.stop { --c: var(--accent); position: relative; display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; text-decoration: none; color: inherit; }
.stop::before { content: ""; position: absolute; left: 20px; top: 0; bottom: 0; width: 6px; background: var(--c); z-index: 0; }
.stop:first-child::before { top: 50%; } .stop:last-child::before { bottom: 50%; }
.stop .st { position: relative; z-index: 1; }
.stop .t { min-width: 0; }
.stop .t b { display: block; font-size: 16px; }
.stop .t span { font-size: 13px; color: var(--muted); }
.stop .p { font-size: 12px; color: var(--muted); text-align: right; }
.stop.today .t b::after { content: "HOY"; margin-left: 8px; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--hot); color: var(--surface); vertical-align: 2px; }
.stop.done .st { background: var(--c); } .stop.done .st b, .stop.done .st i { color: var(--surface); }
.bar { height: 6px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 6px; }

/* vista de día */
.dayhead { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.dayhead h1 { font-size: 24px; font-weight: 900; }
.dayhead .meta { font-size: 13px; color: var(--muted); }
.nav { display: flex; justify-content: space-between; gap: 8px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.fact { background: var(--sunk); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.fact span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.fact b { font-size: 14px; }

.tl { display: grid; gap: 0; }
.it { display: grid; grid-template-columns: 58px 30px 1fr; gap: 0 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.it:first-child { border-top: 0; }
.it .time { font-family: var(--font-m); font-size: 13px; font-weight: 600; line-height: 1.3; padding-top: 3px; }
.it .time small { display: block; color: var(--muted); font-weight: 400; }
.chk { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; }
.chk svg { width: 16px; height: 16px; stroke: var(--surface); fill: none; stroke-width: 3; opacity: 0; }
.chk[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
.chk[aria-pressed="true"] svg { opacity: 1; }
.it .body { min-width: 0; display: grid; gap: 4px; }
.it .body h3 { font-size: 15px; font-weight: 700; }
.it.is-done .body h3 { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.it .body p { margin: 0; font-size: 14px; }
.it .food { font-size: 13px; color: var(--muted); }
.it .food b { color: var(--ink); font-weight: 500; }
.it .rec { font-size: 13px; border-left: 3px solid var(--line); padding-left: 8px; color: var(--muted); }
.it.now { background: color-mix(in srgb, var(--hot) 7%, transparent); border-radius: 10px; box-shadow: inset 3px 0 0 var(--hot); padding-left: 6px; }
.it.now .time::after { content: "AHORA"; display: block; margin-top: 4px; font-size: 10px; color: var(--hot); letter-spacing: .08em; }
.places { display: flex; gap: 6px; flex-wrap: wrap; }
.places a { font-size: 12px; text-decoration: none; padding: 2px 8px; border-radius: 6px; background: var(--sunk); color: var(--ink); }

/* rutas */
.leg { display: grid; gap: 8px; }
.leg + .leg { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.leg h3 { font-size: 15px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; position: relative; padding: 4px 0; }
.step .dot { --c: var(--muted); width: 14px; height: 14px; margin: 4px 4px 0; border-radius: 50%; background: var(--c); position: relative; z-index: 1; }
.step.walk .dot { background: var(--surface); border: 3px dotted var(--muted); }
.step::before { content: ""; position: absolute; left: 9px; top: 18px; bottom: -6px; width: 4px; background: var(--line); }
.step:last-child::before { display: none; }
.step .txt { min-width: 0; font-size: 14px; }
.step .txt b { font-weight: 700; }
.step .txt .ln { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; color: #fff; background: var(--c, var(--muted)); margin-right: 4px; vertical-align: 1px; }
.step .txt small { display: block; color: var(--muted); font-size: 12px; }
.step .min { font-family: var(--font-m); font-size: 12px; color: var(--muted); white-space: nowrap; }
.or { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-left: 32px; }

/* mapas */
.map { position: relative; z-index: 0; isolation: isolate; height: 300px; border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; background: var(--sea); }
.map.tall { height: min(62vh, 520px); }
.leaflet-container { background: var(--sea); font-family: var(--font-d); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); }
.leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.4; }
.leaflet-bar a { background: var(--surface); color: var(--ink); border-bottom-color: var(--line); }
.leaflet-control-attribution { background: color-mix(in srgb, var(--surface) 80%, transparent) !important; color: var(--muted); }
.pin { background: none; border: 0; }
.pin span { --c: var(--accent); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 4px solid var(--c); font-family: var(--font-m); font-size: 11px; font-weight: 700; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.pin.base span { border-radius: 7px; background: var(--c); color: var(--surface); }
.lab { background: none; border: 0; }
.lab span { display: inline-block; white-space: nowrap; font-size: 11px; font-weight: 700; color: var(--ink); text-shadow: 0 0 3px var(--land), 0 0 3px var(--land), 0 0 3px var(--land); transform: translate(16px, -8px); }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.legend a { display: flex; gap: 10px; align-items: center; text-decoration: none; color: inherit; padding: 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.legend .st { width: 36px; height: 36px; border-width: 4px; }
.legend .st b { font-size: 12px; }

/* reservas */
.res { display: grid; gap: 8px; }
.res h3 { font-size: 16px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }
.addr { font-size: 13px; background: var(--sunk); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.addr .ja { font-size: 15px; font-weight: 700; }
.check { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; }
.check p { margin: 0; font-size: 14px; } .check small { color: var(--muted); display: block; font-size: 12px; }
.check.is-done p { text-decoration: line-through; color: var(--muted); }
.pay { display: grid; grid-template-columns: 84px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.pay:first-child { border-top: 0; }
.pay .mono { font-size: 12px; color: var(--muted); }

/* guía */
details.g { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.g > summary { list-style: none; cursor: pointer; padding: 14px; font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; gap: 10px; }
details.g > summary::-webkit-details-marker { display: none; }
details.g > summary::after { content: "+"; font-family: var(--font-m); color: var(--muted); }
details.g[open] > summary::after { content: "−"; }
details.g > div { padding: 0 14px 14px; display: grid; gap: 10px; }
.tips { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.tips li::marker { color: var(--accent); }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tbl td.mono { font-variant-numeric: tabular-nums; }
.phr { display: grid; gap: 0; }
.phr button { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; cursor: pointer; }
.phr button:first-child { border-top: 0; }
.phr .es { font-size: 13px; color: var(--muted); grid-column: 1 / -1; }
.phr .ja { font-size: 17px; font-weight: 700; }
.phr .ro { font-size: 13px; font-family: var(--font-m); color: var(--accent); grid-column: 1 / -1; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.field input, .field select { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; align-items: end; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.total b { font-family: var(--font-m); font-size: 26px; }
.gasto { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.gasto .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0 6px; }
.empty { text-align: center; color: var(--muted); font-size: 14px; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; }

/* hoja a pantalla completa (taxi / frases) */
.sheet { position: fixed; inset: 0; z-index: 50; background: var(--surface); display: grid; grid-template-rows: auto 1fr auto; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet .in { display: grid; align-content: center; gap: 18px; text-align: center; max-width: 720px; margin: 0 auto; width: 100%; }
.sheet .say { font-size: clamp(18px, 5vw, 26px); color: var(--muted); }
.sheet .huge { font-size: clamp(28px, 8.5vw, 52px); font-weight: 900; line-height: 1.3; word-break: break-all; }
.sheet .sub { font-size: 15px; color: var(--muted); }

@media (max-width: 479px) { .brand span { display: none; } }
@media (min-width: 760px) { .map { height: 380px; } .dayhead h1 { font-size: 30px; } }
@media (prefers-reduced-motion: no-preference) { .it, .card { transition: background-color .2s; } }
</style>

const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DOWJ = ['日', '月', '火', '水', '木', '金', '土'];
const fdate = (ymd, long) => { const [y, m, d] = ymd.split('-').map(Number); const w = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); return (long ? DOW[w] + ' ' : '') + d + ' ' + MES[m - 1]; };
const dowj = ymd => { const [y, m, d] = ymd.split('-').map(Number); return DOWJ[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; };
const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
function jstNow() { const d = new Date(Date.now() + 9 * 3600e3); return { ymd: d.toISOString().slice(0, 10), hm: d.toISOString().slice(11, 16), d }; }

function place(key) {
  if (key.startsWith('b:')) { const b = BASES[key.slice(2)]; return { n: b.n, lat: b.lat, lng: b.lng, q: b.addr, base: key.slice(2) }; }
  const p = P[key]; return { n: p[0], lat: p[1], lng: p[2], q: p[3] + ', Japan' };
}
const gmSearch = key => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place(key).q);
const gmRoute = (o, d, mode = 'transit') => 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(place(o).q) + '&destination=' + encodeURIComponent(place(d).q) + '&travelmode=' + mode;
const cityVar = c => 'var(--c-' + c + ')';
const icon = {
  map: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  route: '<svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg>',
  taxi: '<svg viewBox="0 0 24 24"><path d="M5 17h14v-5l-2-5H7l-2 5z"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/><path d="M10 4h4"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const roundel = (day, cls = '') => `<div class="st ${cls}" style="--c:${cityVar(day.city)}"><i>${day.city}</i><b>${String(day.n).padStart(2, '0')}</b></div>`;

// Progreso
const checks = () => store.get('checks', {});
function toggleCheck(id) { const c = checks(); if (c[id]) delete c[id]; else c[id] = 1; store.set('checks', c); }
function dayProgress(day) { const c = checks(); const done = day.items.filter((_, i) => c['d' + day.n + '-' + i]).length; return [done, day.items.length]; }
function dayIndexFor(ymd) { return DAYS.findIndex(d => d.date === ymd); }
function baseForNight(ymd) {
  const i = dayIndexFor(ymd); if (i >= 0) return DAYS[i].base;
  return ymd < TRIP_START ? 'tokyo1' : 'tokyo2';
}

/* ---------- mapas ---------- */
let maps = [];
function clearMaps() { maps.forEach(m => m.remove()); maps = []; }
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function baseLayer(map) {
  const coast = () => L.polygon(COAST, { stroke: true, color: cssVar('--coast'), weight: 1, fillColor: cssVar('--land'), fillOpacity: 1, interactive: false }).addTo(map).bringToBack();
  if (!USE_TILES) return coast();
  const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  tiles.once('tileerror', () => { map.removeLayer(tiles); coast(); });
}
function pinIcon(label, color, isBase) {
  return L.divIcon({ className: 'pin' + (isBase ? ' base' : ''), html: `<span style="--c:${color}">${label}</span>`, iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -12] });
}
function makeMap(el, pts, segs, opts = {}) {
  if (!window.L) { el.innerHTML = '<div class="empty">El mapa necesita conexión para cargar. Las rutas de abajo funcionan igual.</div>'; return; }
  const map = L.map(el, { zoomControl: true, attributionControl: USE_TILES, scrollWheelZoom: false, tap: true });
  maps.push(map);
  baseLayer(map);
  segs.forEach(s => L.polyline(s.ll, { color: s.color, weight: s.walk ? 3 : 4, dashArray: s.walk ? '4 6' : null, opacity: .9 }).addTo(map));
  pts.forEach(p => {
    const m = L.marker([p.lat, p.lng], { icon: pinIcon(p.label, p.color, p.base) }).addTo(map);
    m.bindPopup(`<b>${esc(p.n)}</b>${p.sub ? '<br>' + esc(p.sub) : ''}<br><a href="${p.href}" target="_blank" rel="noopener">${p.hrefLabel || 'Abrir en Google Maps'}</a>`);
    if (opts.labels && (p.short || p.n)) L.marker([p.lat, p.lng], { icon: L.divIcon({ className: 'lab', html: `<span>${esc(p.short || p.n)}</span>`, iconSize: [0, 0] }), interactive: false }).addTo(map);
  });
  const ll = pts.map(p => [p.lat, p.lng]);
  if (ll.length > 1) map.fitBounds(ll, { padding: [28, 28], maxZoom: 16 });
  else if (ll.length) map.setView(ll[0], 15);
  else map.setView([36.2, 138.2], 5);
}
function dayMapData(day) {
  const order = [];
  const add = k => { if (k && !order.includes(k)) order.push(k); };
  day.legs.forEach(l => { add(l.o); add(l.d); });
  day.items.forEach(it => (it.p || []).forEach(add));
  const color = cssVar('--c-' + day.city);
  let n = 0;
  const pts = order.map(k => {
    const p = place(k);
    return { ...p, short: p.base ? 'Alojamiento' : p.n, label: p.base ? '⌂' : String(++n), color, href: gmSearch(k), sub: p.base ? BASES[p.base].addr : '' };
  });
  const segs = day.legs.map(l => {
    const a = place(l.o), b = place(l.d);
    const walk = l.steps.filter(s => !s.alt).every(s => s.m === 'walk');
    return { ll: [[a.lat, a.lng], [b.lat, b.lng]], color, walk };
  });
  return { pts, segs };
}

/* ---------- vistas ---------- */
function viewHoy() {
  const now = jstNow();

  const ymd = preview ? DAYS[preview - 1].date : now.ymd;

    const left = daysBetween(ymd, TRIP_START);
    const done = TODO.filter(t => checks()[t.id]).length;
    const nextAlerts = ALERTS.filter(a => a.d >= ymd).sort((a, b) => a.d.localeCompare(b.d)).slice(0, 4);
    html += `<section class="board" aria-label="Cuenta regresiva">
      <div class="lbl">Salida a Narita · 20 nov 2026</div>
      <div class="big">${left}<small>${left === 1 ? 'día' : 'días'}</small></div>
      <div class="jp">日本まであと${left}日</div>
      <div class="flaps"><div><b>20</b><span>días</span></div><div><b>8</b><span>alojamientos</span></div><div><b>19</b><span>noches</span></div><div><b>4</b><span>entradas</span></div></div>
    </section>
    <section class="sec"><h2>Próximas fechas</h2><div class="card">${nextAlerts.map(a => `<div class="pay"><span class="mono">${fdate(a.d, true)}</span><span>${esc(a.t)}</span></div>`).join('')}</div></section>
    <section class="sec"><h2>Antes de salir · ${done}/${TODO.length} comprado</h2>
      <div class="card"><div class="bar" style="margin-bottom:8px"><i style="width:${done / TODO.length * 100}%"></i></div>
      ${TODO.filter(t => !checks()[t.id]).slice(0, 5).map(t => checkRow(t)).join('')}
      <div class="btns" style="margin-top:8px"><a class="btn" href="#reservas">Ver todos los pendientes</a></div></div>
    </section>
    <section class="sec"><h2>Probar la app</h2><div class="card small">Durante el viaje, esta pestaña abre sola el día actual (hora de Japón) y marca la actividad en curso. Para ver cómo se verá:
      <div class="row" style="margin-top:8px"><label class="field grow" for="pv">Ver como si fuera el
        <select id="pv">${DAYS.map(d => `<option value="${d.n}">Día ${d.n} · ${fdate(d.date, true)} · ${esc(d.title)}</option>`).join('')}</select></label>
        <button class="btn pri" type="button" data-preview>Ver día</button></div></div></section>`;
    return html;
  }
  if (!preview && ymd > TRIP_END) {
    return `<section class="board"><div class="lbl">Viaje terminado</div><div class="big">おかえり</div><div class="jp">Bienvenidos de vuelta. Aquí siguen sus 20 días.</div></section>` + viewItin();
  }
  const day = DAYS[dayIndexFor(ymd)];
  if (preview) html += `<div class="card small row"><span class="grow">Vista previa del <b>Día ${day.n}</b> como si fuera hoy a las ${now.hm} en Japón.</span><button class="btn" type="button" data-preview-off>Salir de la vista previa</button></div>`;
  html += viewDay(day.n, { today: true, hm: now.hm });
  return html;
}

function checkRow(t, prefix = '') {
  const on = !!checks()[t.id];
  return `<div class="check ${on ? 'is-done' : ''}"><button class="chk" type="button" aria-pressed="${on}" aria-label="Marcar ${esc(t.t)}" data-check="${t.id}">${icon.check}</button><div><p>${esc(t.t)}</p>${t.s ? `<small>${esc(t.s)}</small>` : ''}</div></div>`;
}

function viewItin() {
  const today = jstNow().ymd;
  const c = checks();
  const total = DAYS.reduce((a, d) => a + d.items.length, 0);
  const done = DAYS.reduce((a, d) => a + dayProgress(d)[0], 0);
  return `<section class="sec"><h2>20 días · ${done}/${total} actividades hechas</h2>
    <div class="bar"><i style="width:${done / total * 100}%"></i></div>
    <div class="line" style="margin-top:6px">${DAYS.map(d => {
      const [a, b] = dayProgress(d);
      const cls = (d.date === today ? ' today' : '') + (a === b ? ' done' : '');
      const res = d.items.some(it => it.k === 'res') ? ' · 🎟' : '';
      return `<a class="stop${cls}" href="#dia${d.n}" style="--c:${cityVar(d.city)}">${roundel(d)}<div class="t"><b>${esc(d.title)}</b><span>${fdate(d.date, true)} · ${CITY[d.city].n}${res}</span></div><div class="p mono">${a}/${b}</div></a>`;
    }).join('')}</div></section>`;
}

function viewDay(n, opts = {}) {
  const day = DAYS[n - 1];
  const base = BASES[day.base];
  const c = checks();
  const [done, tot] = dayProgress(day);
  let nowIdx = -1;
  if (opts.today) {
    day.items.forEach((it, i) => { if (it.t <= opts.hm && opts.hm < it.e) nowIdx = i; });
    if (nowIdx < 0) nowIdx = day.items.findIndex(it => it.t > opts.hm);
  }
  const prev = n > 1 ? `<a class="btn" href="#dia${n - 1}">← Día ${n - 1}</a>` : '<span></span>';
  const next = n < DAYS.length ? `<a class="btn" href="#dia${n + 1}">Día ${n + 1} →</a>` : '<span></span>';
  return `
  ${opts.today ? '' : `<div class="nav"><a class="btn" href="#itinerario">☰ Itinerario</a><div class="btns">${prev}${next}</div></div>`}
  <section class="dayhead">${roundel(day, 'lg')}<div><div class="meta">${opts.today ? 'Hoy · ' : ''}Día ${day.n} · ${fdate(day.date, true)}（${dowj(day.date)}）· ${CITY[day.city].n} ${CITY[day.city].jp}</div><h1>${esc(day.title)}</h1></div></section>
  <div class="facts">
    <div class="fact"><span>Duermen en</span><b>${esc(base.n)}</b></div>
    <div class="fact"><span>Clima esperado</span><b class="mono">${day.wx[0]}° / ${day.wx[1]}°</b></div>
    <div class="fact"><span>Atardecer</span><b class="mono">≈ ${day.sun}</b></div>
    <div class="fact"><span>Avance</span><b class="mono">${done}/${tot}</b><div class="bar" style="margin-top:4px"><i style="width:${done / tot * 100}%"></i></div></div>
  </div>
  <div class="btns"><button class="btn" type="button" data-taxi="${day.base}">${icon.taxi} Dirección para el taxi</button><a class="btn" href="${gmSearch('b:' + day.base)}" target="_blank" rel="noopener">${icon.map} Alojamiento en Maps</a></div>
  <section class="sec"><h2>Mapa del día</h2><div class="map" id="daymap" role="img" aria-label="Mapa del día ${day.n}"></div>
    <p class="small muted" style="margin:0">Números = orden de paradas · ⌂ = alojamiento. Toca un punto para abrirlo en Google Maps.${USE_TILES ? '' : ' Mapa esquemático (costa de Japón); la navegación real va en Google Maps.'}</p></section>
  <section class="sec"><h2>Plan por hora</h2><div class="card tl">
    ${day.items.map((it, i) => {
      const id = 'd' + day.n + '-' + i, on = !!c[id];
      const tag = it.k === 'res' ? '<span class="chip ok">Reserva</span>' : it.s ? '<span class="chip sug">Sugerencia</span>' : '';
      return `<div class="it ${on ? 'is-done' : ''} ${i === nowIdx ? 'now' : ''}">
        <div class="time">${it.t}<small>${it.e}</small></div>
        <div><button class="chk" type="button" aria-pressed="${on}" aria-label="Marcar ${esc(it.h)}" data-check="${id}">${icon.check}</button></div>
        <div class="body"><div class="row"><h3 class="grow">${esc(it.h)}</h3>${tag}</div>
          ${it.d ? `<p>${esc(it.d)}</p>` : ''}
          ${it.f ? `<div class="food"><b>Comer:</b> ${esc(it.f)}</div>` : ''}
          ${it.r ? `<div class="rec">${esc(it.r)}</div>` : ''}
          ${(it.p || []).length ? `<div class="places">${it.p.map(k => `<a href="${gmSearch(k)}" target="_blank" rel="noopener">📍 ${esc(place(k).n)}</a>`).join('')}</div>` : ''}
        </div></div>`;
    }).join('')}
  </div></section>
  <section class="sec"><h2>Cómo moverse · metro y trenes</h2><div class="card">
    ${day.legs.map(l => legHtml(l)).join('')}
  </div><p class="small muted" style="margin:0">Tiempos aproximados. Confirma horarios del momento con el botón de Google Maps.</p></section>
  ${day.tips && day.tips.length ? `<section class="sec"><h2>Tips del día</h2><div class="card"><ul class="tips">${day.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div></section>` : ''}
  ${opts.today ? `<div class="btns"><a class="btn" href="#dia${n}">Abrir Día ${n} en el itinerario</a></div>` : `<div class="nav">${prev}${next}</div>`}`;
}

function legHtml(l) {
  const a = place(l.o), b = place(l.d);
  const total = l.steps.filter(s => !s.alt).reduce((x, s) => x + (s.min || 0), 0);
  const allWalk = l.steps.filter(s => !s.alt).every(s => s.m === 'walk');
  return `<div class="leg"><div class="row"><h3 class="grow">${esc(a.n)} → ${esc(b.n)}</h3><span class="mono small muted">≈ ${total} min</span></div>
    <ol class="steps">${l.steps.map(s => {
      const ln = s.m === 'walk' ? null : LINES[s.line];
      const head = s.m === 'walk' ? `<b>A pie</b> · ${esc(s.t)}` : `<span class="ln" style="--c:${ln[1]}">${esc(ln[0])}</span>${esc(s.t)}`;
      return `${s.alt ? '<li class="or">o bien</li>' : ''}<li class="step ${s.m === 'walk' ? 'walk' : ''}"><span class="dot" style="--c:${ln ? ln[1] : 'var(--muted)'}"></span><div class="txt">${head}${s.n ? `<small>${esc(s.n)}</small>` : ''}</div><span class="min">${s.min ? s.min + ' min' : ''}</span></li>`;
    }).join('')}</ol>
    ${l.n ? `<div class="rec small">${esc(l.n)}</div>` : ''}
    <div class="btns"><a class="btn pri" href="${gmRoute(l.o, l.d, allWalk ? 'walking' : 'transit')}" target="_blank" rel="noopener">${icon.route} Ruta en Google Maps</a></div></div>`;
}

function initTripMap() {

  const route = ['narita', 'b:tokyo1', 'b:ubuya', 'b:funatsu', 'b:kyoto', 'b:osaka', 'b:kanazawa', 'shirakawa', 'b:takayama', 'b:tokyo2', 'narita'].map(k => { const p = place(k); return [p.lat, p.lng]; });
  const kobe = [place('b:osaka'), place('seaworld')].map(p => [p.lat, p.lng]);
  makeMap(el, [...pts, ...extras], [{ ll: route, color: cssVar('--accent') }, { ll: kobe, color: cssVar('--c-KB'), walk: true }], { labels: true });

    <li><b>Sam (10 años) paga tarifa de niño</b> (≈ mitad). Con una IC de adulto se cobra completo: pidan una Suica/PASMO infantil en ventanilla con su pasaporte, o compren boleto de niño.</li>
    <li><b>Apps</b>: Google Maps (rutas y andenes), SmartEX (Shinkansen Tōkaidō: Mishima–Kioto y Nagoya–Tokio), JR West Online (Thunderbird + Hokuriku), GO (taxis).</li>
    <li><b>Andenes</b>: el número de estación (como G17 Inaricho) y el color de línea son la forma más rápida de no perderse.</li>
    <li><b>Maletas en Shinkansen</b>: si la suma de lados pasa de 160 cm, reserven asiento con espacio para equipaje grande.</li>
    <li><b>Takkyūbin</b> (envío de maletas) desde konbinis o el alojamiento; llegan en 1–2 días. Siempre confirmen que el siguiente anfitrión puede recibirlas.</li>
    <li><b>Taxis</b>: la puerta trasera se abre sola. Muestren la dirección en japonés (botón «Mostrar al taxista» en Reservas).</li>
  </ul></div></details>
  <details class="g"><summary>Dinero y compras</summary><div><ul class="tips">
    <li>Japón aún usa mucho efectivo, sobre todo en Shirakawa-gō, Takayama, templos y puestos. Los cajeros de 7-Eleven aceptan tarjetas extranjeras.</li>
    <li>No se deja propina; se paga en la charola, no en la mano.</li>
    <li><b>Tax-free desde el 1 nov 2026</b>: Japón cambia a reembolso (pagas el 10% y lo recuperas al salir). Guarden recibos y productos sin abrir y den tiempo extra en Narita.</li>
    <li>Enchufes tipo A de 100 V, iguales a los de México: no necesitan adaptador (salvo clavijas de 3 patas).</li>
  </ul>
  <div class="card" style="padding:12px"><div class="form">
    <label class="field" for="cvJpy">Yenes (¥)<input id="cvJpy" inputmode="decimal" type="number" min="0" value="1000"></label>
    <label class="field" for="cvMxn">Pesos (MXN)<input id="cvMxn" inputmode="decimal" type="number" min="0" value="${(1000 * rate).toFixed(2)}"></label>
    <label class="field" for="cvRate">1 ¥ = MXN<input id="cvRate" inputmode="decimal" type="number" step="0.001" min="0" value="${rate}"></label>
  </div><p class="small muted" style="margin:6px 0 0">Ajusten el tipo de cambio con el de su banco; se guarda en este teléfono.</p></div>
  </div></details>
  <details class="g"><summary>Gastos del viaje</summary><div>${gastosHtml(rate)}</div></details>
  <details class="g"><summary>Clima y ropa</summary><div><div class="tbl"><table><thead><tr><th>Lugar</th><th>Fechas</th><th>Máx / mín °C</th><th>Nota</th></tr></thead><tbody>
    ${WEATHER.map(w => `<tr><td><b>${w[0]}</b></td><td>${w[1]}</td><td class="mono">${w[2]}</td><td>${w[3]}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted" style="margin:0">Promedios de temporada, no pronóstico. Oscurece temprano: el sol se pone entre 16:30 y 16:50.</p></div></details>
  <details class="g"><summary>Etiqueta que sí importa</summary><div><ul class="tips">
    <li>No comer caminando por la calle (en Nishiki, cómanlo frente al puesto). La basura se lleva: casi no hay botes.</li>
    <li>En escaleras eléctricas: en Tokio se paran a la izquierda; en Osaka y Kobe a la derecha.</li>
    <li>En templos: no fotos dentro de los salones; en santuarios, lavarse las manos en el temizuya.</li>
    <li>Onsen y ryokan: zapatos fuera, pantuflas dentro; descalzos sobre el tatami. La yukata se cruza izquierda sobre derecha.</li>
    <li>En el tren: hablar bajo y sin llamadas.</li>
  </ul></div></details>
  <details class="g"><summary>Para Sam</summary><div>
    <ul class="tips"><li>Regla del viaje: si se separan, Sam se queda quieto donde está o va al kōban (caseta de policía) más cercano.</li>
    <li>Tarjeta para mostrar si se pierde: llénenla aquí y ábranla en pantalla completa.</li></ul>
    <div class="form">
      <label class="field" for="kidN">Nombre<input id="kidN" type="text" value="${esc(kid.n)}"></label>
      <label class="field" for="kidP1">Teléfono 1<input id="kidP1" type="tel" placeholder="+52 …" value="${esc(kid.p1)}"></label>
      <label class="field" for="kidP2">Teléfono 2<input id="kidP2" type="tel" placeholder="+52 …" value="${esc(kid.p2)}"></label>
    </div>
    <div class="btns"><button class="btn pri" type="button" data-kid>Mostrar tarjeta de ${esc(kid.n || 'Sam')}</button></div>
  </div></details>
  <details class="g"><summary>Frases útiles (toca para mostrar en grande)</summary><div><div class="phr">${PHRASES.map((p, i) => `<button type="button" data-phrase="${i}"><span class="es">${esc(p[0])}</span><span class="ja" lang="ja">${esc(p[1])}</span><span class="ro">${esc(p[2])}</span></button>`).join('')}</div></div></details>
  <details class="g"><summary>Documentos y QR</summary><div>${DOCS.map(t => checkRow(t)).join('')}</div></details>
  <details class="g"><summary>Emergencias</summary><div><dl class="kv">
    <dt>Policía</dt><dd class="mono">110</dd>
    <dt>Ambulancia / bomberos</dt><dd class="mono">119</dd>
    <dt>Japan Visitor Hotline (24 h)</dt><dd class="mono">050-3816-2787</dd>
    <dt>Embajada de México</dt><dd><span class="mono">+81 3 3581 1131</span><br><span class="small">2-15-1 Nagatachō, Chiyoda-ku, Tokio</span></dd>
  </dl><p class="small muted" style="margin:0">Guarden también el teléfono de asistencia de su seguro de viaje.</p></div></details>`;
}

const CATS = ['Comida', 'Transporte', 'Entradas', 'Compras', 'Hospedaje', 'Otros'];
function gastosHtml(rate) {
  const g = store.get('gastos', []);
  const tot = g.reduce((a, x) => a + x.y, 0);
  const byCat = CATS.map(c => [c, g.filter(x => x.c === c).reduce((a, x) => a + x.y, 0)]).filter(x => x[1] > 0);
  return `<form class="form" id="gForm">
      <label class="field" for="gY">Monto (¥)<input id="gY" type="number" inputmode="numeric" min="1" required placeholder="1200"></label>
      <label class="field" for="gC">Categoría<select id="gC">${CATS.map(c => `<option>${c}</option>`).join('')}</select></label>
      <label class="field" for="gN">Nota<input id="gN" type="text" placeholder="Ramen en Akihabara"></label>
      <button class="btn pri" type="submit">Agregar gasto</button></form>
    <div class="total"><span class="muted small">Total del viaje</span><span><b>¥${tot.toLocaleString('es-MX')}</b> <span class="mono muted">≈ $${(tot * rate).toLocaleString('es-MX', { maximumFractionDigits: 0 })} MXN</span></span></div>
    ${byCat.length ? `<div class="tbl"><table><tbody>${byCat.map(([c, v]) => `<tr><td>${c}</td><td class="mono">¥${v.toLocaleString('es-MX')}</td><td class="mono muted">$${(v * rate).toLocaleString('es-MX', { maximumFractionDigits: 0 })}</td></tr>`).join('')}</tbody></table></div>` : ''}
    <div>${g.length ? g.slice().reverse().map(x => `<div class="gasto"><span>${esc(x.n || x.c)} <span class="small muted">· ${esc(x.c)} · ${fdate(x.d)}</span></span><span class="mono">¥${x.y.toLocaleString('es-MX')}</span><button class="x" type="button" data-del="${x.id}" aria-label="Borrar gasto">×</button></div>`).join('') : '<div class="empty">Aún no hay gastos. Anoten el primero arriba; se guardan en este teléfono.</div>'}</div>`;
}

/* ---------- hoja a pantalla completa ---------- */
function openSheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').hidden = false; $('#sheetClose').focus(); try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} }
function closeSheet() { $('#sheet').hidden = true; }
function taxiSheet(k) {
  const b = BASES[k];
  openSheet(`<div class="say" lang="ja">この住所までお願いします。</div><div class="huge" lang="ja">${esc(b.ja)}</div><div class="sub">${esc(b.addr)}<br>Por favor, a esta dirección.</div>`);
}

/* ---------- router ---------- */
const view = $('#view');
function route() {
  const h = (location.hash || '#hoy').slice(1);
  clearMaps();
  let tab = h, html;
  const m = h.match(/^dia(\d{1,2})$/);
  if (m && DAYS[+m[1] - 1]) { tab = 'itinerario'; html = viewDay(+m[1]); }
  else if (h === 'itinerario') html = viewItin();
  else if (h === 'mapa') html = viewMapa();
  else if (h === 'reservas') html = viewReservas();
  else if (h === 'guia') html = viewGuia();
  else { tab = 'hoy'; html = viewHoy(); }
  view.innerHTML = html;
  document.querySelectorAll('.tabs a').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const dm = $('#daymap');
  if (dm) { const n = m ? +m[1] : DAYS[dayIndexFor(mem.preview ? DAYS[mem.preview - 1].date : jstNow().ymd)].n; const { pts, segs } = dayMapData(DAYS[n - 1]); makeMap(dm, pts, segs, { labels: !USE_TILES }); }
  initTripMap();
  if (mem.lastHash !== h) window.scrollTo(0, 0);
  mem.lastHash = h;
}
function rerender() { const y = window.scrollY; route(); window.scrollTo(0, y); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-check],[data-taxi],[data-copy],[data-phrase],[data-del],[data-preview],[data-preview-off],[data-kid]');
  if (!t) return;
  if (t.dataset.check) { toggleCheck(t.dataset.check); rerender(); }
  else if (t.dataset.taxi) taxiSheet(t.dataset.taxi);
  else if (t.dataset.copy) {
    const txt = t.dataset.copy;
    const ok = () => { t.lastChild.textContent = ' Copiado'; setTimeout(() => { t.lastChild.textContent = ' Copiar'; }, 1500); };
    try { navigator.clipboard.writeText(txt).then(ok, () => taxiSheet(Object.keys(BASES).find(k => BASES[k].ja === txt))); } catch (err) { taxiSheet(Object.keys(BASES).find(k => BASES[k].ja === txt)); }
  }
  else if (t.dataset.phrase) { const p = PHRASES[+t.dataset.phrase]; openSheet(`<div class="say">${esc(p[0])}</div><div class="huge" lang="ja">${esc(p[1])}</div><div class="sub mono">${esc(p[2])}</div>`); }
  else if (t.dataset.del) { store.set('gastos', store.get('gastos', []).filter(x => String(x.id) !== t.dataset.del)); rerender(); reopen('Gastos del viaje'); }
  else if ('preview' in t.dataset) { mem.preview = +$('#pv').value; rerender(); window.scrollTo(0, 0); }
  else if ('previewOff' in t.dataset) { mem.preview = 0; rerender(); window.scrollTo(0, 0); }
  else if ('kid' in t.dataset) {
    const k = store.get('kid', { n: 'Sam', p1: '', p2: '' });
    const b = BASES[baseForNight(jstNow().ymd)];
    openSheet(`<div class="say" lang="ja">迷子です。両親に電話してください。</div><div class="huge">${esc(k.n || 'Sam')}</div>
      <div class="sub">Me perdí. Por favor llame a mis papás.<br><span class="mono" style="font-size:22px;color:var(--ink)">${esc(k.p1)}${k.p2 ? '<br>' + esc(k.p2) : ''}</span></div>
      <div class="sub" lang="ja">宿泊先: ${esc(b.ja)}</div>`);
  }
});
function reopen(title) { document.querySelectorAll('details.g').forEach(d => { if (d.querySelector('summary').textContent === title) d.open = true; }); }
document.addEventListener('submit', e => {
  if (e.target.id !== 'gForm') return;
  e.preventDefault();
  const y = Math.round(+$('#gY').value); if (!y) return;
  const g = store.get('gastos', []);
  g.push({ id: Date.now(), y, c: $('#gC').value, n: $('#gN').value.trim(), d: jstNow().ymd });
  store.set('gastos', g); rerender(); reopen('Gastos del viaje');
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'cvJpy' || id === 'cvRate') { const r = +$('#cvRate').value || 0; if (id === 'cvRate') store.set('rate', r); $('#cvMxn').value = ((+$('#cvJpy').value || 0) * r).toFixed(2); }
  if (id === 'cvMxn') { const r = +$('#cvRate').value || 0; $('#cvJpy').value = r ? Math.round((+$('#cvMxn').value || 0) / r) : 0; }
  if (id === 'kidN' || id === 'kidP1' || id === 'kidP2') store.set('kid', { n: $('#kidN').value, p1: $('#kidP1').value, p2: $('#kidP2').value });
});
$('#sheetClose').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

function tick() {
  const now = jstNow();
  $('#clock').innerHTML = `<b>${now.hm}</b>Japón · ${fdate(now.ymd)}`;
}
window.addEventListener('hashchange', route);
tick(); setInterval(tick, 30000);
route();
</script>
