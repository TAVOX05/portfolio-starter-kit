<title>Japón 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*LEAFLET_CSS*/
/* Layout: app nativa estilo iOS — barra de navegación translúcida, título grande, listas agrupadas con inserción, barra de pestañas abajo y hojas que suben. Los días conservan su color de "línea" por ciudad. */
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --fill: rgba(120,120,128,.12); --fill2: rgba(120,120,128,.20); --segsel: #FFFFFF;
  --label: #000000; --label2: rgba(60,60,67,.60); --label3: rgba(60,60,67,.30); --sep: rgba(60,60,67,.29); --gray: #8E8E93;
  --tint: #007AFF; --green: #34C759; --orange: #FF9500; --red: #FF3B30; --yellow: #FFCC00; --indigo: #5856D6; --teal: #30B0C7; --purple: #AF52DE; --pink: #FF2D55;
  --bar: rgba(249,249,249,.84); --barline: rgba(0,0,0,.2);
  --sea: #D5E4F1; --land: #F8F8F3; --coast: #A5B4C3; --sun: #E3242B;
  --c-TK: #FF9500; --c-FJ: #32ADE6; --c-KY: #AF52DE; --c-OS: #FF2D55; --c-KB: #30B0C7; --c-KZ: #D19E00; --c-HD: #A2845E;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", Roboto, "Noto Sans JP", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --card: #1C1C1E; --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36); --segsel: #636366;
  --label: #FFFFFF; --label2: rgba(235,235,245,.60); --label3: rgba(235,235,245,.30); --sep: rgba(84,84,88,.65); --gray: #8E8E93;
  --tint: #0A84FF; --green: #30D158; --orange: #FF9F0A; --red: #FF453A; --yellow: #FFD60A; --indigo: #5E5CE6; --teal: #40C8E0; --purple: #BF5AF2; --pink: #FF375F;
  --bar: rgba(22,22,24,.84); --barline: rgba(255,255,255,.16);
  --sea: #0E1B28; --land: #1C1C1E; --coast: #3A4756; --sun: #FF453A;
  --c-TK: #FF9F0A; --c-FJ: #64D2FF; --c-KY: #BF5AF2; --c-OS: #FF375F; --c-KB: #40C8E0; --c-KZ: #FFD60A; --c-HD: #AC8E68;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36); --segsel: #636366;
  --label: #FFFFFF; --label2: rgba(235,235,245,.60); --label3: rgba(235,235,245,.30); --sep: rgba(84,84,88,.65); --gray: #8E8E93;
  --tint: #0A84FF; --green: #30D158; --orange: #FF9F0A; --red: #FF453A; --yellow: #FFD60A; --indigo: #5E5CE6; --teal: #40C8E0; --purple: #BF5AF2; --pink: #FF375F;
  --bar: rgba(22,22,24,.84); --barline: rgba(255,255,255,.16);
  --sea: #0E1B28; --land: #1C1C1E; --coast: #3A4756; --sun: #FF453A;
  --c-TK: #FF9F0A; --c-FJ: #64D2FF; --c-KY: #BF5AF2; --c-OS: #FF375F; --c-KB: #40C8E0; --c-KZ: #FFD60A; --c-HD: #AC8E68;
  color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--label); font-family: var(--font); font-size: 17px; line-height: 1.3; letter-spacing: -.01em; margin: 0; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body.scrolled::before { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
a { color: var(--tint); text-decoration: none; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* barra de navegación */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: .5px solid transparent; transition: background-color .2s, border-color .2s; }
body.scrolled .nav { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom-color: var(--barline); }
.nav .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; gap: 8px; }
.nav-l a { display: inline-flex; align-items: center; gap: 2px; font-size: 17px; white-space: nowrap; }
.nav-l a::before { content: ""; width: 11px; height: 11px; border-left: 2.6px solid var(--tint); border-bottom: 2.6px solid var(--tint); transform: rotate(45deg); margin: 0 4px 0 4px; border-radius: 1px; }
.nav-t { font-size: 17px; font-weight: 600; text-align: center; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
body.scrolled .nav-t { opacity: 1; }
.nav-r { text-align: right; font-size: 13px; color: var(--label2); white-space: nowrap; line-height: 1.15; }
.nav-r b { color: var(--label); font-weight: 600; font-size: 15px; }

/* título grande */
.lt { padding: 2px 0 14px; display: flex; gap: 14px; align-items: center; }
.lt .cap { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: .02em; }
.lt h1 { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
.lt .st + div h1 { font-size: 28px; line-height: 34px; }
.lt .sub { font-size: 15px; color: var(--label2); margin-top: 2px; }

main { padding-block: 4px 28px; display: grid; gap: 24px; }

/* listas agrupadas */
.grp { display: grid; gap: 6px; min-width: 0; }
.gh span + span { flex: none; white-space: nowrap; }
.gh { font-size: 13px; font-weight: 400; text-transform: uppercase; color: var(--label2); padding: 0 16px; letter-spacing: .01em; display: flex; justify-content: space-between; gap: 8px; }
.gf { font-size: 13px; color: var(--label2); padding: 0 16px; line-height: 1.35; }
.list { background: var(--card); border-radius: 12px; overflow: hidden; min-width: 0; }
.r { --inset: 16px; position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 11px 16px; width: 100%; color: var(--label); background: none; border: 0; text-align: left; text-decoration: none; }
.r + .r::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset); border-top: .5px solid var(--sep); }
.r.li { --inset: 52px; } .r.ld { --inset: 58px; } .r.lr { --inset: 62px; }
.r .t.sm { font-size: 15px; line-height: 20px; }
.r .t.sm b { font-weight: 600; }
a.r:active, button.r:active { background: var(--fill2); }
.r .m { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.r .t { font-size: 17px; line-height: 22px; }
.r .t.b { font-weight: 600; }
.r .s { font-size: 15px; line-height: 20px; color: var(--label2); }
.r .x { font-size: 13px; line-height: 18px; color: var(--label2); }
.r .tr { flex: none; color: var(--label2); font-size: 17px; display: flex; align-items: center; gap: 8px; }
.chev::after { content: ""; flex: none; width: 8px; height: 8px; border-top: 2px solid var(--label3); border-right: 2px solid var(--label3); transform: rotate(45deg); margin-left: 2px; }
.r.link .t { color: var(--tint); }
.r.center { justify-content: center; } .r.center .t { color: var(--tint); }
.r.danger .t { color: var(--red); }
.ext::after { content: "↗"; color: var(--label3); font-size: 15px; }

/* iconos tipo Ajustes */
.ico { flex: none; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: var(--b, var(--gray)); color: #fff; }
.ico svg { width: 19px; height: 19px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* pastillas */
.pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--fill); color: var(--label2); }
.pill.ok { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.pill.warn { background: color-mix(in srgb, var(--orange) 18%, transparent); color: var(--orange); }
.pill.hot { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.pill.now { background: var(--red); color: #fff; }
.pill.tint { background: color-mix(in srgb, var(--tint) 15%, transparent); color: var(--tint); }

/* roundel de estación */
.st { --c: var(--tint); flex: none; width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--c); background: var(--card); display: grid; place-content: center; text-align: center; line-height: 1; }
.st i { display: block; font-style: normal; font-size: 8px; font-weight: 700; color: var(--c); letter-spacing: .03em; }
.st b { display: block; font-size: 13px; font-weight: 700; }
.st.lg { width: 58px; height: 58px; border-width: 6px; } .st.lg i { font-size: 10px; } .st.lg b { font-size: 20px; }
.st.done { background: var(--c); } .st.done b, .st.done i { color: #fff; }

/* mini calendario */
.cal { flex: none; width: 34px; border-radius: 7px; overflow: hidden; background: var(--card); box-shadow: 0 0 0 .5px var(--sep); text-align: center; line-height: 1; }
.cal i { display: block; font-style: normal; font-size: 8px; font-weight: 700; color: #fff; background: var(--red); padding: 2px 0; text-transform: uppercase; }
.cal b { display: block; font-size: 15px; font-weight: 600; padding: 3px 0 4px; }

/* casilla tipo Recordatorios */
.chk { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--label3); background: none; display: grid; place-items: center; padding: 0; cursor: pointer; }
.chk svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.chk[aria-pressed="true"] { background: var(--tint); border-color: var(--tint); }
.chk[aria-pressed="true"] svg { opacity: 1; }
.r.done .t { color: var(--label2); }

/* barra de progreso */
.prog { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--tint); border-radius: 2px; }

/* control segmentado */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; border: 0; background: none; font-size: 13px; font-weight: 500; padding: 6px 4px; border-radius: 7px; cursor: pointer; color: var(--label); }
.seg button[aria-pressed="true"] { background: var(--segsel); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }

/* widget de cuenta regresiva */
.widget { background: var(--card); border-radius: 22px; padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 14px 16px; align-items: center; }
.widget .k { font-size: 13px; font-weight: 600; color: var(--red); text-transform: uppercase; letter-spacing: .02em; }
.widget h2 { font-size: 22px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
.widget .jp { font-size: 15px; color: var(--label2); margin-top: 4px; }
.sun { width: 104px; height: 104px; border-radius: 50%; background: var(--sun); color: #fff; display: grid; place-content: center; text-align: center; line-height: 1; }
.sun b { font-size: 44px; font-weight: 700; letter-spacing: -.02em; }
.sun span { font-size: 13px; font-weight: 600; margin-top: 2px; }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); border-top: .5px solid var(--sep); padding-top: 12px; }
.stats div { text-align: center; } .stats div + div { border-left: .5px solid var(--sep); }
.stats b { display: block; font-size: 20px; font-weight: 600; } .stats span { font-size: 12px; color: var(--label2); }

/* tarjetas del día */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--card); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile span { display: block; font-size: 13px; color: var(--label2); }
.tile b { font-size: 17px; font-weight: 600; display: block; line-height: 22px; }
.tile .prog { margin-top: 6px; }

/* plan por hora */
.it { align-items: flex-start; }
.it .chk { margin-top: 1px; }
.it .when { font-size: 13px; color: var(--label2); font-weight: 500; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.it.now { background: color-mix(in srgb, var(--red) 7%, var(--card)); }
.it .d { font-size: 15px; line-height: 20px; color: var(--label); }
.it .food { font-size: 15px; line-height: 20px; color: var(--label2); }
.it .food b { color: var(--label); font-weight: 600; }
.it .rec { font-size: 13px; line-height: 18px; color: var(--label2); display: flex; gap: 6px; }
.it .rec::before { content: "ⓘ"; color: var(--tint); }
.it.done .d, .it.done .food { color: var(--label3); }
.it.done .t { text-decoration: line-through; text-decoration-color: var(--label3); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chips a { font-size: 13px; padding: 3px 9px; border-radius: 8px; background: color-mix(in srgb, var(--tint) 12%, transparent); color: var(--tint); font-weight: 500; }

/* rutas */
.badge { flex: none; min-width: 30px; height: 26px; padding: 0 6px; border-radius: 6px; background: var(--c, var(--gray)); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; white-space: nowrap; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
.badge svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.badge.walk { background: var(--fill); } .badge.walk svg { stroke: var(--label2); }
.r.step { --inset: 58px; padding-block: 9px; }
.r.step.alt { opacity: .78; }
.r.step .min { font-size: 15px; color: var(--label2); white-space: nowrap; }
.alt-lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--label2); }

/* mapas */
.map { position: relative; z-index: 0; isolation: isolate; height: 320px; border-radius: 12px; overflow: hidden; background: var(--sea); }
.map.tall { height: min(60vh, 520px); }
.leaflet-container { background: var(--sea); font-family: var(--font); }
.leaflet-popup-content-wrapper { background: var(--card); color: var(--label); border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.leaflet-popup-tip { background: var(--card); }
.leaflet-popup-content { margin: 10px 14px; font-size: 15px; line-height: 1.35; }
.leaflet-bar { border: 0 !important; box-shadow: 0 2px 10px rgba(0,0,0,.15) !important; border-radius: 10px !important; overflow: hidden; }
.leaflet-bar a { background: var(--bar) !important; color: var(--label) !important; border-bottom-color: var(--sep) !important; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.leaflet-control-attribution { background: var(--bar) !important; color: var(--label2) !important; }
.pin { background: none; border: 0; }
.pin span { --c: var(--tint); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c); border: 2.5px solid #fff; font-size: 12px; font-weight: 700; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.pin.base span { border-radius: 8px; }
.lab { background: none; border: 0; }
.lab span { display: inline-block; white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--label); text-shadow: 0 0 3px var(--land), 0 0 3px var(--land), 0 0 4px var(--land); transform: translate(16px, -8px); }
.dotn { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.dotn.base { border-radius: 8px; }

/* formularios en filas */
.r.field label { flex: none; font-size: 17px; }
.r.field input, .r.field select { flex: 1 1 auto; min-width: 0; text-align: right; background: none; border: 0; font-size: 17px; color: var(--label2); padding: 0; appearance: none; -webkit-appearance: none; outline-offset: 4px; }
.r.field input::placeholder { color: var(--label3); }
.big { font-size: 28px; font-weight: 700; }

/* hoja inferior */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 720px; margin: 0 auto; max-height: calc(100% - 44px - env(safe-area-inset-top, 0px)); overflow: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 14px 14px 0 0; padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 0 auto; }
.sheet-h { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; margin-bottom: 8px; }
.sheet-h b { font-size: 17px; font-weight: 600; text-align: center; }
.sheet-h button { grid-column: 3; justify-self: end; background: none; border: 0; color: var(--tint); font-size: 17px; font-weight: 600; cursor: pointer; padding: 6px 0; }
#sheetBody { display: grid; gap: 20px; }
.show { background: var(--card); border-radius: 16px; padding: 24px 18px; display: grid; gap: 14px; text-align: center; }
.show .say { font-size: clamp(17px, 4.6vw, 24px); color: var(--label2); }
.show .huge { font-size: clamp(28px, 8.5vw, 50px); font-weight: 800; line-height: 1.3; word-break: break-all; }
.show .sub2 { font-size: 15px; color: var(--label2); line-height: 1.4; }

/* HUD */
.hud { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 60; background: var(--bar); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 14px; padding: 14px 22px; font-size: 15px; font-weight: 600; box-shadow: 0 6px 30px rgba(0,0,0,.2); }

/* audio */
.spk { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: color-mix(in srgb, var(--tint) 14%, transparent); color: var(--tint); padding: 0; }
.spk svg, .play svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spk.on, .play.on { background: var(--tint); color: #fff; }
.tbtn { background: none; border: 0; color: var(--tint); font-size: 15px; cursor: pointer; padding: 4px 0; }
.playbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.play { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 10px; font-size: 17px; font-weight: 600; cursor: pointer; background: var(--tint); color: #fff; }
.play.alt { background: color-mix(in srgb, var(--tint) 15%, transparent); color: var(--tint); }
.play.alt.on { background: var(--tint); color: #fff; }

/* hoy en tiempo real */
.nowc { --c: var(--tint); background: var(--card); border-radius: 20px; padding: 16px; display: grid; gap: 8px; box-shadow: inset 0 4px 0 var(--c); }
.nowh { display: flex; align-items: center; gap: 8px; }
.stl { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--label2); }
.stl.now { background: var(--red); color: #fff; } .stl.next { background: color-mix(in srgb, var(--tint) 16%, transparent); color: var(--tint); }
.pos { font-size: 13px; color: var(--label2); }
.stp { margin-left: auto; display: flex; gap: 8px; }
.stp button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--fill); color: var(--tint); font-size: 24px; line-height: 1; cursor: pointer; padding-bottom: 3px; }
.stp button:disabled { color: var(--label3); cursor: default; }
.nowc .when { font-size: 15px; color: var(--label2); font-weight: 500; }
.nowc h2 { font-size: 24px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.nowc .d, .nowc .food { font-size: 15px; line-height: 20px; } .nowc .food { color: var(--label2); } .nowc .food b { color: var(--label); }
.nowc .rec { font-size: 13px; color: var(--label2); } .nowc .rec::before { content: "ⓘ "; color: var(--tint); }
.nowc .tbtn { justify-self: start; }
a.play { text-decoration: none; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 4px; }
.flow .badge { height: 22px; min-width: 26px; font-size: 10px; }
.flow .badge svg { width: 14px; height: 14px; }
.sepr { color: var(--label3); font-size: 15px; }

function legGroup(l) {
  const a = place(l.o), b = place(l.d);
  const main = l.steps.filter(s => !s.alt);
  const total = main.reduce((x, s) => x + (s.min || 0), 0);
  const allWalk = main.every(s => s.m === 'walk');
  const rows = l.steps.map(s => {
    const ln = s.m === 'walk' ? null : LINES[s.line];
    let lead;
    if (!ln) lead = `<span class="badge walk">${I.walk}</span>`;
    else if (s.line === 'taxi') lead = `<span class="badge" style="--c:${ln[1]}">${I.car}</span>`;
    else if (s.line === 'bus') lead = `<span class="badge" style="--c:${ln[1]}">${I.bus}</span>`;
    else lead = `<span class="badge" style="--c:${ln[1]}">${esc(ln[0])}</span>`;
    return row({ cls: 'step' + (s.alt ? ' alt' : ''), lead, pre: s.alt ? '<span class="alt-lbl">o bien</span>' : '', t: (ln ? '' : 'A pie · ') + esc(s.t), x: s.n ? esc(s.n) : '', tr: s.min ? `<span class="min">${s.min} min</span>` : '' });
  }).join('') + row({ href: gmRoute(l.o, l.d, allWalk ? 'walking' : 'transit'), ext: 1, cls: 'link', t: 'Ruta en Google Maps' });
  return grp(`${esc(a.n)} → ${esc(b.n)}`, rows, l.n ? esc(l.n) : null, `≈ ${total} min`);
}

function viewPend() {
  const today = jstNow().ymd, c = checks();

  const done = TODO.filter(t => c[t.id]);
  const pct = done.length / TODO.length;
  const nextSale = TODO.filter(t => !c[t.id] && t.opens && t.opens >= today).sort((a, b) => a.opens.localeCompare(b.opens))[0];
  const pendRow = t => {

      <div class="chips2">${chips}</div>${t.note ? `<div class="x">ⓘ ${esc(t.note)}${t.on ? '' : ''}</div>` : ''}${t.on && t.opens > today ? `<div class="x">La venta abre ${esc(t.on)}.</div>` : ''}

  };
  const body = `

/* ---------- Liquid glass con refracción real ----------
   Física adaptada del laboratorio de Octavio: superficie squircle, ley de Snell
   y mapa de desplazamiento. Aquí el mapa se convierte en imagen y lo aplica un
   filtro SVG (feDisplacementMap) como backdrop-filter, así refracta el contenido

  else if (d.copy) copyText(d.copy);
  else if (d.phrase) { const p = PHRASES[+d.phrase]; openSheet('Frase', showCard(esc(p[0]), esc(p[1]), `<span style="font-family:var(--mono)">${esc(p[2])}</span>`, p[1].replace('…', ''))); }
  else if (d.del) { store.set('gastos', store.get('gastos', []).filter(x => String(x.id) !== d.del)); rerender(); }
  else if (d.seg) { const [n, k] = d.seg.split(':'); mem.seg[n] = k; rerender(); }
  else if (d.base) baseSheet(d.base);
  else if (d.ticket) ticketSheet(+d.ticket);
  else if ('preview' in d) { mem.preview = +$('#pv').value; mem.previewHm = $('#pvh').value || '10:00'; mem.focus = null; route(); window.scrollTo(0, 0); }
  else if (d.step != null) {
    const n = mem.preview || DAYS[dayIndexFor(jstNow().ymd)].n;
    if (+d.step === 0) mem.focus = null;
    else { const cur = $('.nowc .pos').textContent.split(' ')[0] - 1; mem.focus = { n, i: Math.max(0, Math.min(DAYS[n - 1].items.length - 1, cur + +d.step)) }; }
    rerender();
  }
  else if (d.focus != null) { mem.focus = { n: mem.preview || DAYS[dayIndexFor(jstNow().ymd)].n, i: +d.focus }; route(); window.scrollTo(0, 0); }
  else if (d.food) { mem.foodMode = d.food; rerender(); }
  else if ('previewOff' in d) { mem.preview = 0; mem.focus = null; route(); window.scrollTo(0, 0); }
  else if ('kid' in d) {
    const k = store.get('kid', { n: 'Sam', p1: '', p2: '' });
    const b = BASES[baseForNight(jstNow().ymd)];
    openSheet('Tarjeta de ' + (k.n || 'Sam'), showCard('迷子です。両親に電話してください。', esc(k.n || 'Sam'),
      `Me perdí. Por favor llame a mis papás.<br><b style="font-size:24px;color:var(--label)">${esc(k.p1)}${k.p2 ? '<br>' + esc(k.p2) : ''}</b><br><br><span lang="ja">宿泊先：${esc(b.ja)}</span>`, '迷子です。両親に電話してください。泊まっているところは、' + b.say + 'です。'));
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'gForm') return;
  e.preventDefault();
  const y = Math.round(+$('#gY').value); if (!y) return;
  const g = store.get('gastos', []);
  g.push({ id: Date.now(), y, c: $('#gC').value, n: $('#gN').value.trim(), d: jstNow().ymd });
  store.set('gastos', g); rerender(); hud('Gasto agregado');
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'cvJpy' || id === 'cvRate') { const r = +$('#cvRate').value || 0; if (id === 'cvRate') store.set('rate', r); $('#cvMxn').value = ((+$('#cvJpy').value || 0) * r).toFixed(2); }
  if (id === 'cvMxn') { const r = +$('#cvRate').value || 0; $('#cvJpy').value = r ? Math.round((+$('#cvMxn').value || 0) / r) : 0; }
  if (id === 'kidN' || id === 'kidP1' || id === 'kidP2') store.set('kid', { n: $('#kidN').value, p1: $('#kidP1').value, p2: $('#kidP2').value });
});
$('#sheetClose').addEventListener('click', closeSheet);
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('hashchange', navigate);
$('#themeB').addEventListener('click', e => setTheme(isDark() ? 'light' : 'dark', e));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (store.get('theme', 'auto') === 'auto') { applyTheme('auto'); rerender(); } });

function tick() {
  const now = jstNow(); $('#clock').innerHTML = `<b>${now.hm}</b><br>Japón`;
  // En el viaje, la pestaña Hoy se actualiza sola cada minuto
  const onHoy = !location.hash || location.hash === '#hoy';
  const live = onHoy && !mem.preview && now.ymd >= TRIP_START && now.ymd <= TRIP_END;
  if (live && mem.lastTick && mem.lastTick !== now.hm && $('#sheet').hidden && !/INPUT|SELECT/.test((document.activeElement || {}).tagName || '')) rerender();
  mem.lastTick = now.hm;
}
applyTheme(store.get('theme', 'auto'));
lgAll();
tick(); setInterval(tick, 30000);
route({ stagger: true });
</script>
