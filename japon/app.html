<title>Japón 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: app nativa estilo iOS — barra de navegación translúcida, título grande, listas agrupadas con inserción, barra de pestañas abajo y hojas que suben. Los días conservan su color de "línea" por ciudad. */
:root {

  --label: #000000; --label2: rgba(60,60,67,.60); --label3: rgba(60,60,67,.30); --sep: rgba(60,60,67,.29); --gray: #8E8E93;
  --tint: #007AFF; --green: #34C759; --orange: #FF9500; --red: #FF3B30; --yellow: #FFCC00; --indigo: #5856D6; --teal: #30B0C7; --purple: #AF52DE; --pink: #FF2D55;
  --bar: rgba(249,249,249,.84); --barline: rgba(0,0,0,.2);
  --sea: #D5E4F1; --land: #F8F8F3; --coast: #A5B4C3; --sun: #E3242B;
  --c-TK: #FF9500; --c-FJ: #32ADE6; --c-KY: #AF52DE; --c-OS: #FF2D55; --c-KB: #30B0C7; --c-KZ: #D19E00; --c-HD: #A2845E;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", Roboto, "Noto Sans JP", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --card: #1C1C1E; --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36); --segsel: #636366;
  --label: #FFFFFF; --label2: rgba(235,235,245,.60); --label3: rgba(235,235,245,.30); --sep: rgba(84,84,88,.65); --gray: #8E8E93;
  --tint: #0A84FF; --green: #30D158; --orange: #FF9F0A; --red: #FF453A; --yellow: #FFD60A; --indigo: #5E5CE6; --teal: #40C8E0; --purple: #BF5AF2; --pink: #FF375F;
  --bar: rgba(22,22,24,.84); --barline: rgba(255,255,255,.16);
  --sea: #0E1B28; --land: #1C1C1E; --coast: #3A4756; --sun: #FF453A;
  --c-TK: #FF9F0A; --c-FJ: #64D2FF; --c-KY: #BF5AF2; --c-OS: #FF375F; --c-KB: #40C8E0; --c-KZ: #FFD60A; --c-HD: #AC8E68;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36); --segsel: #636366;
  --label: #FFFFFF; --label2: rgba(235,235,245,.60); --label3: rgba(235,235,245,.30); --sep: rgba(84,84,88,.65); --gray: #8E8E93;
  --tint: #0A84FF; --green: #30D158; --orange: #FF9F0A; --red: #FF453A; --yellow: #FFD60A; --indigo: #5E5CE6; --teal: #40C8E0; --purple: #BF5AF2; --pink: #FF375F;
  --bar: rgba(22,22,24,.84); --barline: rgba(255,255,255,.16);
  --sea: #0E1B28; --land: #1C1C1E; --coast: #3A4756; --sun: #FF453A;
  --c-TK: #FF9F0A; --c-FJ: #64D2FF; --c-KY: #BF5AF2; --c-OS: #FF375F; --c-KB: #40C8E0; --c-KZ: #FFD60A; --c-HD: #AC8E68;
  color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--label); font-family: var(--font); font-size: 17px; line-height: 1.3; letter-spacing: -.01em; margin: 0; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body.scrolled::before { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
a { color: var(--tint); text-decoration: none; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* barra de navegación */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: .5px solid transparent; transition: background-color .2s, border-color .2s; }
body.scrolled .nav { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom-color: var(--barline); }
.nav .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; gap: 8px; }
.nav-l a { display: inline-flex; align-items: center; gap: 2px; font-size: 17px; white-space: nowrap; }
.nav-l a::before { content: ""; width: 11px; height: 11px; border-left: 2.6px solid var(--tint); border-bottom: 2.6px solid var(--tint); transform: rotate(45deg); margin: 0 4px 0 4px; border-radius: 1px; }
.nav-t { font-size: 17px; font-weight: 600; text-align: center; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
body.scrolled .nav-t { opacity: 1; }
.nav-r { text-align: right; font-size: 13px; color: var(--label2); white-space: nowrap; line-height: 1.15; }
.nav-r b { color: var(--label); font-weight: 600; font-size: 15px; }

/* título grande */
.lt { padding: 2px 0 14px; display: flex; gap: 14px; align-items: center; }
.lt .cap { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: .02em; }
.lt h1 { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
.lt .st + div h1 { font-size: 28px; line-height: 34px; }
.lt .sub { font-size: 15px; color: var(--label2); margin-top: 2px; }

main { padding-block: 4px 28px; display: grid; gap: 24px; }

/* listas agrupadas */
.grp { display: grid; gap: 6px; min-width: 0; }
.gh span + span { flex: none; white-space: nowrap; }
.gh { font-size: 13px; font-weight: 400; text-transform: uppercase; color: var(--label2); padding: 0 16px; letter-spacing: .01em; display: flex; justify-content: space-between; gap: 8px; }
.gf { font-size: 13px; color: var(--label2); padding: 0 16px; line-height: 1.35; }
.list { background: var(--card); border-radius: 12px; overflow: hidden; min-width: 0; }
.r { --inset: 16px; position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 11px 16px; width: 100%; color: var(--label); background: none; border: 0; text-align: left; text-decoration: none; }
.r + .r::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset); border-top: .5px solid var(--sep); }
.r.li { --inset: 52px; } .r.ld { --inset: 58px; } .r.lr { --inset: 62px; }
.r .t.sm { font-size: 15px; line-height: 20px; }
.r .t.sm b { font-weight: 600; }
a.r:active, button.r:active { background: var(--fill2); }
.r .m { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.r .t { font-size: 17px; line-height: 22px; }
.r .t.b { font-weight: 600; }
.r .s { font-size: 15px; line-height: 20px; color: var(--label2); }
.r .x { font-size: 13px; line-height: 18px; color: var(--label2); }
.r .tr { flex: none; color: var(--label2); font-size: 17px; display: flex; align-items: center; gap: 8px; }
.chev::after { content: ""; flex: none; width: 8px; height: 8px; border-top: 2px solid var(--label3); border-right: 2px solid var(--label3); transform: rotate(45deg); margin-left: 2px; }
.r.link .t { color: var(--tint); }
.r.center { justify-content: center; } .r.center .t { color: var(--tint); }
.r.danger .t { color: var(--red); }
.ext::after { content: "↗"; color: var(--label3); font-size: 15px; }

/* iconos tipo Ajustes */
.ico { flex: none; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: var(--b, var(--gray)); color: #fff; }
.ico svg { width: 19px; height: 19px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* pastillas */
.pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--fill); color: var(--label2); }
.pill.ok { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.pill.warn { background: color-mix(in srgb, var(--orange) 18%, transparent); color: var(--orange); }
.pill.hot { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.pill.now { background: var(--red); color: #fff; }
.pill.tint { background: color-mix(in srgb, var(--tint) 15%, transparent); color: var(--tint); }

/* roundel de estación */
.st { --c: var(--tint); flex: none; width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--c); background: var(--card); display: grid; place-content: center; text-align: center; line-height: 1; }
.st i { display: block; font-style: normal; font-size: 8px; font-weight: 700; color: var(--c); letter-spacing: .03em; }
.st b { display: block; font-size: 13px; font-weight: 700; }
.st.lg { width: 58px; height: 58px; border-width: 6px; } .st.lg i { font-size: 10px; } .st.lg b { font-size: 20px; }
.st.done { background: var(--c); } .st.done b, .st.done i { color: #fff; }

/* mini calendario */
.cal { flex: none; width: 34px; border-radius: 7px; overflow: hidden; background: var(--card); box-shadow: 0 0 0 .5px var(--sep); text-align: center; line-height: 1; }
.cal i { display: block; font-style: normal; font-size: 8px; font-weight: 700; color: #fff; background: var(--red); padding: 2px 0; text-transform: uppercase; }
.cal b { display: block; font-size: 15px; font-weight: 600; padding: 3px 0 4px; }

/* casilla tipo Recordatorios */
.chk { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--label3); background: none; display: grid; place-items: center; padding: 0; cursor: pointer; }
.chk svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.chk[aria-pressed="true"] { background: var(--tint); border-color: var(--tint); }
.chk[aria-pressed="true"] svg { opacity: 1; }
.r.done .t { color: var(--label2); }

/* barra de progreso */
.prog { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--tint); border-radius: 2px; }

/* control segmentado */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; border: 0; background: none; font-size: 13px; font-weight: 500; padding: 6px 4px; border-radius: 7px; cursor: pointer; color: var(--label); }
.seg button[aria-pressed="true"] { background: var(--segsel); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }

/* widget de cuenta regresiva */
.widget { background: var(--card); border-radius: 22px; padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 14px 16px; align-items: center; }
.widget .k { font-size: 13px; font-weight: 600; color: var(--red); text-transform: uppercase; letter-spacing: .02em; }
.widget h2 { font-size: 22px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
.widget .jp { font-size: 15px; color: var(--label2); margin-top: 4px; }
.sun { width: 104px; height: 104px; border-radius: 50%; background: var(--sun); color: #fff; display: grid; place-content: center; text-align: center; line-height: 1; }
.sun b { font-size: 44px; font-weight: 700; letter-spacing: -.02em; }
.sun span { font-size: 13px; font-weight: 600; margin-top: 2px; }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); border-top: .5px solid var(--sep); padding-top: 12px; }
.stats div { text-align: center; } .stats div + div { border-left: .5px solid var(--sep); }
.stats b { display: block; font-size: 20px; font-weight: 600; } .stats span { font-size: 12px; color: var(--label2); }

/* tarjetas del día */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--card); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile span { display: block; font-size: 13px; color: var(--label2); }
.tile b { font-size: 17px; font-weight: 600; display: block; line-height: 22px; }
.tile .prog { margin-top: 6px; }

/* plan por hora */
.it { align-items: flex-start; }
.it .chk { margin-top: 1px; }
.it .when { font-size: 13px; color: var(--label2); font-weight: 500; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.it.now { background: color-mix(in srgb, var(--red) 7%, var(--card)); }
.it .d { font-size: 15px; line-height: 20px; color: var(--label); }
.it .food { font-size: 15px; line-height: 20px; color: var(--label2); }
.it .food b { color: var(--label); font-weight: 600; }
.it .rec { font-size: 13px; line-height: 18px; color: var(--label2); display: flex; gap: 6px; }
.it .rec::before { content: "ⓘ"; color: var(--tint); }
.it.done .d, .it.done .food { color: var(--label3); }
.it.done .t { text-decoration: line-through; text-decoration-color: var(--label3); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chips a { font-size: 13px; padding: 3px 9px; border-radius: 8px; background: color-mix(in srgb, var(--tint) 12%, transparent); color: var(--tint); font-weight: 500; }

/* rutas */
.badge { flex: none; min-width: 30px; height: 26px; padding: 0 6px; border-radius: 6px; background: var(--c, var(--gray)); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; white-space: nowrap; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
.badge svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.badge.walk { background: var(--fill); } .badge.walk svg { stroke: var(--label2); }
.r.step { --inset: 58px; padding-block: 9px; }
.r.step.alt { opacity: .78; }
.r.step .min { font-size: 15px; color: var(--label2); white-space: nowrap; }
.alt-lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--label2); }

/* mapas */
.map { position: relative; z-index: 0; isolation: isolate; height: 320px; border-radius: 12px; overflow: hidden; background: var(--sea); }
.map.tall { height: min(60vh, 520px); }
.pin { background: none; border: 0; }
.pin span { --c: var(--tint); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c); border: 2.5px solid #fff; font-size: 12px; font-weight: 700; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.pin.base span { border-radius: 8px; }
.lab { background: none; border: 0; }
.lab span { display: inline-block; white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--label); text-shadow: 0 0 3px var(--land), 0 0 3px var(--land), 0 0 4px var(--land); transform: translate(16px, -8px); }
.dotn { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.dotn.base { border-radius: 8px; }

/* formularios en filas */
.r.field label { flex: none; font-size: 17px; }
.r.field input, .r.field select { flex: 1 1 auto; min-width: 0; text-align: right; background: none; border: 0; font-size: 17px; color: var(--label2); padding: 0; appearance: none; -webkit-appearance: none; outline-offset: 4px; }
.r.field input::placeholder { color: var(--label3); }
.big { font-size: 28px; font-weight: 700; }

/* hoja inferior */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 720px; margin: 0 auto; max-height: calc(100% - 44px - env(safe-area-inset-top, 0px)); overflow: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 14px 14px 0 0; padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 0 auto; }
.sheet-h { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; margin-bottom: 8px; }
.sheet-h b { font-size: 17px; font-weight: 600; text-align: center; }
.sheet-h button { grid-column: 3; justify-self: end; background: none; border: 0; color: var(--tint); font-size: 17px; font-weight: 600; cursor: pointer; padding: 6px 0; }
#sheetBody { display: grid; gap: 20px; }
.show { background: var(--card); border-radius: 16px; padding: 24px 18px; display: grid; gap: 14px; text-align: center; }
.show .say { font-size: clamp(17px, 4.6vw, 24px); color: var(--label2); }
.show .huge { font-size: clamp(28px, 8.5vw, 50px); font-weight: 800; line-height: 1.3; word-break: break-all; }
.show .sub2 { font-size: 15px; color: var(--label2); line-height: 1.4; }

/* HUD */
.hud { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 60; background: var(--bar); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 14px; padding: 14px 22px; font-size: 15px; font-weight: 600; box-shadow: 0 6px 30px rgba(0,0,0,.2); }

/* audio */
.spk { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: color-mix(in srgb, var(--tint) 14%, transparent); color: var(--tint); padding: 0; }
.spk svg, .play svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spk.on, .play.on { background: var(--tint); color: #fff; }
.tbtn { background: none; border: 0; color: var(--tint); font-size: 15px; cursor: pointer; padding: 4px 0; }
.playbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.play { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 10px; font-size: 17px; font-weight: 600; cursor: pointer; background: var(--tint); color: #fff; }
.play.alt { background: color-mix(in srgb, var(--tint) 15%, transparent); color: var(--tint); }
.play.alt.on { background: var(--tint); color: #fff; }

/* hoy en tiempo real */
.nowc { --c: var(--tint); background: var(--card); border-radius: 20px; padding: 16px; display: grid; gap: 8px; box-shadow: inset 0 4px 0 var(--c); }
.nowh { display: flex; align-items: center; gap: 8px; }
.stl { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--label2); }
.stl.now { background: var(--red); color: #fff; } .stl.next { background: color-mix(in srgb, var(--tint) 16%, transparent); color: var(--tint); }
.pos { font-size: 13px; color: var(--label2); }
.stp { margin-left: auto; display: flex; gap: 8px; }
.stp button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--fill); color: var(--tint); font-size: 24px; line-height: 1; cursor: pointer; padding-bottom: 3px; }
.stp button:disabled { color: var(--label3); cursor: default; }
.nowc .when { font-size: 15px; color: var(--label2); font-weight: 500; }
.nowc h2 { font-size: 24px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.nowc .d, .nowc .food { font-size: 15px; line-height: 20px; } .nowc .food { color: var(--label2); } .nowc .food b { color: var(--label); }
.nowc .rec { font-size: 13px; color: var(--label2); } .nowc .rec::before { content: "ⓘ "; color: var(--tint); }
.nowc .tbtn { justify-self: start; }
a.play { text-decoration: none; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 4px; }
.flow .badge { height: 22px; min-width: 26px; font-size: 10px; }
.flow .badge svg { width: 14px; height: 14px; }
.sepr { color: var(--label3); font-size: 15px; }
.tm { color: var(--label2); font-size: 15px; margin-right: 4px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.fchip { background: var(--card); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; color: var(--label); }
.fchip b { font-size: 15px; font-weight: 600; } .fchip span { font-size: 12px; color: var(--label2); }
.fchip.spec { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--orange) 60%, transparent); } .fchip.spec span { color: var(--orange); }
.fchip:active { background: var(--fill2); }

/* barra de pestañas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--barline); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); }

/* ===== Liquid glass + movimiento estilo iOS ===== */
:root { --card: rgba(255,255,255,.86); --glass: rgba(255,255,255,.56); --glass-brd: rgba(255,255,255,.7); --glass-hi: rgba(255,255,255,.95); --glass-sh: 0 10px 34px rgba(30,40,80,.16); --amb1: #FFB340; --amb2: #6E8BFF; --amb3: #FF6B9A; --amb-o: .32; --spring: cubic-bezier(.34,1.45,.64,1); --ease: cubic-bezier(.2,.9,.25,1); }

/* barra de pestañas flotante de vidrio */
.tabs { left: 50%; right: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 20px)); padding-bottom: 0; border: 1px solid var(--glass-brd); border-radius: 32px; background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(200%); backdrop-filter: blur(24px) saturate(200%); box-shadow: var(--glass-sh), inset 0 1px 0 var(--glass-hi); overflow: hidden; }

.tab-ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 6); border-radius: 26px; background: color-mix(in srgb, var(--tint) 15%, transparent); box-shadow: inset 0 1px 0 var(--glass-hi); transform: translateX(calc(var(--ti, 0) * 100%)); transition: transform .6s var(--spring); }

/* tarjetas de vidrio */
.widget, .nowc, .pend-hero { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--glass-brd); box-shadow: var(--glass-sh), inset 0 1px 0 var(--glass-hi); }
.nowc { box-shadow: inset 0 4px 0 var(--c), var(--glass-sh); }

/* control segmentado con pulgar deslizante */

.ring { width: 92px; height: 92px; position: relative; }

@media (prefers-reduced-motion: no-preference) {

  .r, .play, .fchip, .tile, .stp button, .themeb, .lnk, .spk, .chips a { transition: transform .3s var(--spring), background-color .2s, opacity .2s; }
  a.r:active, button.r:active, .play:active, .fchip:active, .stp button:active, .themeb:active, .lnk:active, .spk:active, .chips a:active, .tabs a:active svg { transform: scale(.95); }

  @keyframes glow { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--sun) 14%, transparent), 0 14px 44px color-mix(in srgb, var(--sun) 42%, transparent); transform: scale(1.03); } }

  .sheet:not([hidden]) { animation: up .55s var(--spring); }

  @keyframes vt-in-r { from { transform: translateX(35%); opacity: 0; } }
  @keyframes vt-out-l { to { transform: translateX(-18%); opacity: 0; } }
  @keyframes vt-in-l { from { transform: translateX(-18%); opacity: 0; } }
  @keyframes vt-out-r { to { transform: translateX(35%); opacity: 0; } }

/* ===== Superficies minimalistas sobre el fondo de Tokio ===== */
#bgfx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

:root[data-theme="dark"] { --card: rgba(22,22,30,.86); --surf: rgba(18,18,26,.72); --hair: rgba(255,255,255,.10); --lift: 0 8px 28px rgba(0,0,0,.45); }

/* tarjetas deslizables de Hoy */
.deck { position: relative; isolation: isolate; padding-bottom: 14px; }
.deck .nowc { position: relative; z-index: 2; touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; }
.deck .nowc.drag { cursor: grabbing; }
.ghost { position: absolute; z-index: 1; border-radius: 20px; background: var(--card); border: .5px solid var(--hair); }
.ghost.g1 { inset: 10px 12px 6px; transform: translateY(8px); opacity: .7; }
.ghost.g2 { inset: 20px 24px 0; transform: translateY(14px); opacity: .4; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: -6px; }
.dots span { width: 7px; height: 7px; border-radius: 4px; background: var(--label3); transition: width .4s cubic-bezier(.34,1.45,.64,1), background-color .3s; }
.dots span.cur { background: color-mix(in srgb, var(--red) 55%, transparent); }
.dots span.on { width: 20px; background: var(--tint); }
@media (prefers-reduced-motion: no-preference) {
  .nowc.in-next { animation: card-in-r .55s cubic-bezier(.34,1.3,.64,1) both; }
  .nowc.in-prev { animation: card-in-l .55s cubic-bezier(.34,1.3,.64,1) both; }
  @keyframes card-in-r { from { opacity: 0; transform: translateX(40%) rotate(4deg) scale(.94); } }
  @keyframes card-in-l { from { opacity: 0; transform: translateX(-40%) rotate(-4deg) scale(.94); } }
}

/* hora de salir */
.leave { --lc: var(--tint); background: var(--card); border: .5px solid var(--hair); border-radius: 18px; padding: 14px 16px; display: grid; gap: 4px; box-shadow: inset 4px 0 0 var(--lc), var(--lift); }

@media (prefers-reduced-motion: no-preference) { .leave.now, .leave.late { animation: lvpulse 1.6s ease-in-out infinite; } @keyframes lvpulse { 50% { box-shadow: inset 4px 0 0 var(--lc), 0 0 0 6px color-mix(in srgb, var(--red) 18%, transparent); } } }

/* sellos */
.stamps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stamp { background: var(--card); border: .5px solid var(--hair); border-radius: 14px; padding: 12px 6px 10px; display: grid; justify-items: center; gap: 4px; text-align: center; cursor: pointer; color: var(--label); }
.stamp .ink { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed var(--label3); color: var(--label3); font-weight: 800; line-height: 1; margin-bottom: 4px; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
.stamp.on .ink { border: 4px double #D7332B; color: #D7332B; transform: rotate(-8deg); background: radial-gradient(circle, color-mix(in srgb, #D7332B 10%, transparent), transparent 70%); }

@media (prefers-reduced-motion: no-preference) { .stamp .ink.slam { animation: slam .5s cubic-bezier(.3,1.6,.5,1) both; } @keyframes slam { 0% { transform: scale(1.9) rotate(-28deg); opacity: 0; } 60% { transform: scale(.9) rotate(-6deg); opacity: 1; } 100% { transform: rotate(-8deg); } } .stamp { transition: transform .3s var(--spring); } .stamp:active { transform: scale(.95); } }

/* chat */
.chat { display: grid; gap: 10px; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 18px; font-size: 16px; line-height: 1.4; word-wrap: break-word; }
.msg.user { justify-self: end; background: var(--tint); color: #fff; border-bottom-right-radius: 6px; }
.msg.assistant { justify-self: start; background: var(--card); border: .5px solid var(--hair); border-bottom-left-radius: 6px; }
.typing { display: inline-flex; gap: 4px; } .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--label3); animation: typing 1.2s infinite; } .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes typing { 30% { transform: translateY(-4px); background: var(--label2); } }
.qchips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; } .qchips::-webkit-scrollbar { display: none; }

.send.stop { background: var(--label2); font-size: 12px; }

/* barras más transparentes */
:root { --surf: rgba(255,255,255,.52); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surf: rgba(16,16,24,.46); } }
:root[data-theme="dark"] { --surf: rgba(16,16,24,.46); }
.tabs, .themeb, body.scrolled .nav, body.scrolled::before { -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%); }

@media (prefers-reduced-motion: no-preference) {
  .pet .petsvg { animation: petbob 3.2s ease-in-out infinite; transform-origin: 50% 90%; }

  const pts = order.map(k => { const p = place(k); return { ...p, key: k, short: p.base ? 'Alojamiento' : p.n, label: p.base ? '⌂' : String(++n), color, href: gmSearch(k), sub: p.base ? BASES[p.base].addr : '' }; });
  return { order, pts };
}

/* ---------- vistas ---------- */
function viewHoy() {
  const now = jstNow();
  if (mem.preview) return viewToday(mem.preview, mem.previewHm || now.hm, true);
  const ymd = now.ymd, p = ymdParts(ymd);
  const cap = `${DOWL[p.w]} ${p.d} ${MES[p.m - 1]} · ${now.hm} en Japón`;

  if (ymd >= TRIP_START) return viewToday(DAYS[dayIndexFor(ymd)].n, now.hm);
  const left = daysBetween(ymd, TRIP_START);
  const c = checks();
  const done = TODO.filter(t => c[t.id]).length;
  const nextAlerts = ALERTS.filter(a => a.d >= ymd).sort((a, b) => a.d.localeCompare(b.d)).slice(0, 4);
  const body = `
  <section class="widget" aria-label="Cuenta regresiva">
    <div><div class="k">Salida a Narita</div><h2>Viernes 20 de noviembre</h2><div class="jp" lang="ja">日本まであと${left}日</div></div>
    <div class="sun"><b class="countup" data-to="${left}">${left}</b><span>${left === 1 ? 'día' : 'días'}</span></div>
    <div class="stats"><div><b>20</b><span>días</span></div><div><b>8</b><span>hospedajes</span></div><div><b>19</b><span>noches</span></div><div><b>4</b><span>entradas</span></div></div>
  </section>
  ${grp('Próximas fechas', nextAlerts.map(a => row({ cls: 'ld', lead: cal(a.d), t: esc(a.t), s: inDays(daysBetween(ymd, a.d)) })).join(''))}
  ${grp('Antes de salir', TODO.filter(t => !c[t.id]).slice(0, 5).map(todoRow).join('') + row({ href: '#pendientes', t: 'Ver todos los pendientes', cls: 'link', chev: 1 }), null, `${done} de ${TODO.length}`)}
  ${grp('Vista previa', `<div class="r field"><label for="pv">Día</label><select id="pv">${DAYS.map(d => `<option value="${d.n}">${d.n} · ${fdate(d.date, true)} · ${esc(d.title)}</option>`).join('')}</select></div><div class="r field"><label for="pvh">Hora en Japón</label><input id="pvh" type="time" value="10:00"></div>` +
    row({ tag: 'button', cls: 'center', t: 'Ver como si fuera ese día', attrs: 'data-preview' }),
    'Durante el viaje esta pestaña abre sola el día actual (hora de Japón) y marca lo que toca en ese momento.')}`;
  return { title: 'Hoy', cap, body };
}

/* ---------- Hoy en tiempo real ---------- */
const RAIN = { TK: ['baja', 'Diciembre en Tokio es seco y soleado.'], FJ: ['baja', 'Suele estar despejado; el viento del lago enfría.'], KY: ['moderada', 'Pueden caer lloviznas; un paraguas plegable no estorba.'], OS: ['baja', 'Normalmente seco.'], KB: ['baja', 'Normalmente seco; viento frío en el puerto.'], KZ: ['alta', 'Kanazawa es de las ciudades más lluviosas de Japón en diciembre.'], HD: ['nieve', 'En las montañas puede nevar o haber hielo.'] };
const DAY_EXTRA = {

const toMin = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const fmtMin = m => m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
const gmDirFromHere = (key, mode = 'transit') => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(place(key).q) + '&travelmode=' + mode;
const gmFood = (term, key) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(key ? term + ' near ' + place(key).q : term + ' near me');

function itemStatus(it, hm) {
  if (it.t <= hm && hm < it.e) return ['now', 'Ahora', 'termina a las ' + it.e];
  if (hm < it.t) return ['next', 'Siguiente', 'empieza en ' + fmtMin(toMin(it.t) - toMin(hm))];
  return ['past', 'Antes', 'terminó a las ' + it.e];
}
function legsForItem(day, it) { return day.legs.filter(l => (it.p || []).includes(l.d)); }
const flowHtml = l => `<div class="flow">${l.steps.filter(s => !s.alt).map(s => {
  const ln = s.m === 'walk' ? null : LINES[s.line];
  if (!ln) return `<span class="badge walk">${I.walk}</span>`;
  if (s.line === 'taxi') return `<span class="badge" style="--c:${ln[1]}">${I.car}</span>`;
  if (s.line === 'bus') return `<span class="badge" style="--c:${ln[1]}">${I.bus}</span>`;
  return `<span class="badge" style="--c:${ln[1]}">${esc(ln[0])}</span>`;
}).join('<span class="sepr">›</span>')}</div>`;

function viewToday(n, hm, preview) {
  const day = DAYS[n - 1], items = day.items, c = checks(), base = BASES[day.base], p = ymdParts(day.date);
  const nowIdx = items.findIndex(it => it.t <= hm && hm < it.e);
  const nextIdx = items.findIndex(it => it.t > hm);
  const auto = nowIdx >= 0 ? nowIdx : nextIdx >= 0 ? nextIdx : items.length - 1;
  const fi = mem.focus && mem.focus.n === n ? Math.min(mem.focus.i, items.length - 1) : auto;
  const it = items[fi];
  const [sk, sl, sd] = itemStatus(it, hm);
  const label = sk === 'next' && fi !== auto ? 'Más tarde' : sk === 'past' && fi === auto ? 'Último del día' : sl;
  const id = 'd' + n + '-' + fi, done = !!c[id];
  const ended = nowIdx < 0 && nextIdx < 0;
  const morning = hm < '12:00';
  const tomorrow = DAYS[n];

  // tarjeta principal
  const card = `<div class="deck">${fi < items.length - 1 ? '<span class="ghost g1"></span>' : ''}${fi < items.length - 2 ? '<span class="ghost g2"></span>' : ''}<section class="nowc" style="--c:${cityVar(day.city)}" data-day="${n}" data-i="${fi}" data-max="${items.length}" aria-roledescription="tarjeta deslizable">
    <div class="nowh"><span class="stl ${sk}">${label}</span><span class="pos">${fi + 1} de ${items.length}</span>
      <span class="stp"><button type="button" data-step="-1" aria-label="Actividad anterior" ${fi === 0 ? 'disabled' : ''}>‹</button><button type="button" data-step="1" aria-label="Actividad siguiente" ${fi === items.length - 1 ? 'disabled' : ''}>›</button></span></div>
    <div class="when">${it.t} – ${it.e} · ${sd}</div>
    <h2>${esc(it.h)}</h2>
    ${it.d ? `<p class="d">${esc(it.d)}</p>` : ''}
    ${it.f ? `<p class="food"><b>Comer:</b> ${esc(it.f)}</p>` : ''}
    ${it.r ? `<p class="rec">${esc(it.r)}</p>` : ''}
    ${(it.p || []).length ? `<div class="chips">${it.p.map(k => `<a href="${gmSearch(k)}" target="_blank" rel="noopener">${esc(place(k).n)}</a>`).join('')}</div>` : ''}
    <div class="playbar">${(it.p || []).length ? `<a class="play" href="${gmDirFromHere(it.p[it.p.length - 1])}" target="_blank" rel="noopener">Cómo llegar</a>` : `<a class="play" href="#dia${n}">Ver el día</a>`}
      <button class="play alt${done ? ' on' : ''}" type="button" data-check="${id}">${done ? 'Hecho ✓' : 'Marcar hecho'}</button></div>
    ${fi !== auto ? `<button class="tbtn" type="button" data-step="0">Volver a lo de ahora</button>` : ''}
  </section></div>
  <div class="dots" aria-hidden="true">${items.map((_, i) => `<span class="${i === fi ? 'on' : ''}${i === auto ? ' cur' : ''}"></span>`).join('')}</div>`;

  // ruta rápida
  const legs = legsForItem(day, it);
  const target = (it.p || []).filter(k => !k.startsWith('b:') || legs.length === 0).slice(-1)[0] || (it.p || [])[0];
  const route = legs.length
    ? legs.map(l => { const a = place(l.o), b = place(l.d); const tot = l.steps.filter(s => !s.alt).reduce((x, s) => x + (s.min || 0), 0);
        return row({ t: `${esc(a.n)} → ${esc(b.n)}`, extra: flowHtml(l), x: l.steps.filter(s => !s.alt && s.m !== 'walk').map(s => esc(s.t)).join(' · '), tr: `≈ ${tot} min` }) +
          row({ href: gmRoute(l.o, l.d, l.steps.filter(s => !s.alt).every(s => s.m === 'walk') ? 'walking' : 'transit'), ext: 1, cls: 'link', t: 'Ruta del plan en Google Maps' }); }).join('') +
      row({ href: gmDirFromHere(legs[legs.length - 1].d), ext: 1, cls: 'link', t: 'Desde donde estoy ahora' })
    : target ? row({ t: 'Sin traslado largo en esta actividad', s: esc(place(target).n) }) + row({ href: gmDirFromHere(target), ext: 1, cls: 'link', t: 'Cómo llegar desde donde estoy' }) : '';

  // consejo del día
  const [rk, rt] = RAIN[day.city];
  const [hi, lo] = day.wx;
  const ropa = lo <= 1 ? 'Abrigo grueso, gorro, guantes y bufanda. Capa térmica abajo.' : lo <= 5 ? 'Chamarra abrigadora y capas: la mañana es fría.' : 'Chamarra ligera o suéter.';
  const capas = hi - lo >= 8 ? ` Hay ${hi - lo}° de diferencia entre la mañana y el mediodía: vístanse en capas.` : '';
  const advice = grp(morning ? 'Consejo de la mañana' : 'Clima de hoy',
    row({ cls: 'ld', lead: ico(I.cloud, 'var(--c-FJ)'), t: `${CITY[day.city].n}: ${hi}° / ${lo}°`, s: esc(ropa + capas) }) +
    row({ cls: 'ld', lead: ico(I.umbrella, rk === 'alta' || rk === 'nieve' ? 'var(--indigo)' : 'var(--gray)'), t: rk === 'alta' ? 'Lleven paraguas' : rk === 'nieve' ? 'Posible nieve: calzado antiderrapante' : rk === 'moderada' ? 'Paraguas plegable por si acaso' : 'Paraguas: probablemente no', s: esc(rt) }) +
    row({ cls: 'ld', lead: ico(I.sunset, 'var(--orange)'), t: `Oscurece ≈ ${day.sun}`, s: 'Lo de exterior conviene antes de esa hora.' }) +
    (DAY_EXTRA[n] ? row({ cls: 'ld', lead: ico(I.bulb, 'var(--yellow)'), t: esc(DAY_EXTRA[n]), sm: 1 }) : '') +
    wxPicker() +
    row({ href: 'https://www.google.com/search?q=' + encodeURIComponent('clima ' + CITY[day.city].n + ' Japón hoy'), ext: 1, cls: 'link', t: 'Ver el pronóstico real de hoy' }),
    'Basado en promedios de temporada. Antes de salir revisen el pronóstico real.');

  // comida cerca
  const fm = mem.foodMode || 'yo';
  const ref = (it.p || []).find(k => !k.startsWith('b:')) || (it.p || [])[0] || 'b:' + day.base;
  const refKey = fm === 'yo' ? null : ref;
  const chip = ([l, q], spec) => `<a class="fchip${spec ? ' spec' : ''}" href="${gmFood(q, refKey)}" target="_blank" rel="noopener"><b>${esc(l)}</b><span>${spec ? 'Especialidad local' : fm === 'yo' ? 'Cerca de mí' : 'Cerca del plan'}</span></a>`;
  const food = `<section class="grp"><h2 class="gh"><span>Comer cerca</span></h2>
    ${segHtml('food', [['yo', 'Cerca de mí'], ['plan', 'Cerca de ' + esc(place(ref).n)]], fm, 'data-food', 'Buscar comida')}
    ${it.f ? `<div class="list">${row({ cls: 'ld', lead: ico(I.bulb, 'var(--green)'), t: 'Idea del itinerario', s: esc(it.f) })}</div>` : ''}
    <div class="fgrid">${(FOOD_CITY[day.city] || []).map(f => chip(f, true)).join('')}${FOOD_ALL.map(f => chip(f)).join('')}</div>
    <p class="gf">${fm === 'yo' ? 'Abre Google Maps con la ubicación de tu teléfono y te muestra lo que hay alrededor, con horarios y reseñas.' : 'Busca alrededor de ' + esc(place(ref).n) + ', la parada de esta actividad.'}</p></section>`;

  const body = `
  ${preview ? grp(null, row({ t: `Vista previa: Día ${n} a las ${hm}`, s: 'Así se verá esta pestaña ese día y a esa hora.' }) + row({ tag: 'button', cls: 'center', t: 'Salir de la vista previa', attrs: 'data-preview-off' })) : ''}
  ${ended ? grp(null, row({ cls: 'ld', lead: ico(I.bed, cityVar(day.city)), t: 'Terminó el plan de hoy', s: tomorrow ? `Mañana: ${tomorrow.items[0].t} · ${esc(tomorrow.items[0].h)}` : '¡Buen viaje de regreso!' }) + (tomorrow ? row({ href: '#dia' + tomorrow.n, cls: 'link', t: `Ver Día ${tomorrow.n}`, chev: 1 }) : '')) : ''}
  ${leaveHtml(day, hm)}
  ${card}
  ${route ? grp('Ruta rápida', route) : ''}
  ${grp('Plan de hoy', items.map((x, i) => {
    const xid = 'd' + n + '-' + i, on = !!c[xid];
    const st = itemStatus(x, hm)[0];
    const tag = i === fi ? '<span class="pill tint">Viendo</span>' : st === 'now' ? '<span class="pill now">Ahora</span>' : '';
    return row({ cls: 'li' + (on ? ' done' : ''), lead: checkBtn(xid, x.h), t: `<span class="tm">${x.t}</span> ${esc(x.h)}`, tr: tag || `<button class="tbtn" type="button" data-focus="${i}">Ver</button>` });
  }).join(''), null, `${dayProgress(day)[0]} de ${items.length}`)}
  ${advice}
  ${(() => { const st = STAMPS.filter(x => x.city === day.city); return st.length ? `<section class="grp"><h2 class="gh"><span>Retos de hoy en familia</span><span>${st.filter(x => stampMarks(x.id).length).length}/${st.length}</span></h2><div class="stamps">${st.slice(0, 6).map(stampHtml).join('')}</div><a class="gf" href="#guia-sellos">Ver el pasaporte completo ›</a></section>` : ''; })()}
  ${food}
  ${grp('Accesos rápidos', row({ href: gmDirFromHere('b:' + day.base), ext: 1, cls: 'ld', lead: ico(I.bed, cityVar(day.city)), t: 'Volver al alojamiento', s: esc(base.n) }) +

    mem.docs.filter(dd => n === 1 || n === 20 ? dd.cat === 'vuelo' && !dd.link : false).map(docRow).join('') +
    row({ href: '#chat', cls: 'ld', lead: ico(I.speech, 'var(--purple)'), t: 'Pregúntale a tu mascota', s: 'Comida, cambios de plan, traducciones', chev: 1 }) +
    row({ href: '#dia' + n, cls: 'ld', lead: ico(I.ticket, 'var(--tint)'), t: 'Día completo: rutas, mapa y tips', chev: 1 }))}`;
  return { title: 'Hoy', cap: `Día ${n} · ${DOWL[p.w]} ${p.d} ${MES[p.m - 1]} · ${CITY[day.city].n}`, lead: roundel(day, 'lg'), body };
}

function viewItin() {
  const today = jstNow().ymd;
  const total = DAYS.reduce((a, d) => a + d.items.length, 0);
  const done = DAYS.reduce((a, d) => a + dayProgress(d)[0], 0);
  const runs = [];
  DAYS.forEach(d => { const last = runs[runs.length - 1]; if (last && last.city === d.city) last.days.push(d); else runs.push({ city: d.city, days: [d] }); });
  const body = `<section class="grp"><h2 class="gh"><span>${done} de ${total} actividades</span><span>${Math.round(done / total * 100)}%</span></h2><div class="prog" style="margin:0 16px"><i style="width:${done / total * 100}%"></i></div></section>
  ${runs.map(r => grp(`${CITY[r.city].n} <span lang="ja">${CITY[r.city].jp}</span>`, r.days.map(d => {
      const [a, b] = dayProgress(d);
      const tr = d.date === today ? '<span class="pill now">Hoy</span>' : d.items.some(it => it.k === 'res') ? '<span class="pill tint">Reserva</span>' : '';
      return row({ href: '#dia' + d.n, cls: 'lr', lead: roundel(d, a === b ? 'done' : ''), t: esc(d.title), s: `${fdate(d.date, true)} · ${a} de ${b}`, tr, chev: 1 });
    }).join(''), null, `${fdate(r.days[0].date)}${r.days.length > 1 ? ' – ' + fdate(r.days[r.days.length - 1].date) : ''}`)).join('')}`;
  return { title: 'Itinerario', cap: '20 nov – 9 dic 2026', body };
}

function viewDay(n, opts = {}) {

const fmtHM = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
function leaveInfo(day, hm) {
  for (const [k, it] of day.items.entries()) {
    if (it.t <= hm) continue;
    const legs = legsForItem(day, it); if (!legs.length) continue;
    const l = legs[0];
    if (k > 0 && (day.items[k - 1].p || []).includes(l.d)) continue; // ya están ahí
    const mins = l.steps.filter(s => !s.alt).reduce((a, s) => a + (s.min || 0), 0);
    const leave = toMin(it.t) - mins - 10;
    return { it, l, mins, leave, left: leave - toMin(hm) };
  }
  return null;
}

let speakBtn = null;
function speak(text, slow, btn) {
  const synth = window.speechSynthesis;
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') { hud(IS_ANDROID ? 'Abre esta página en Chrome para escuchar el audio' : 'Este navegador no tiene voz'); return; }
  const wasThis = speakBtn === btn && synth.speaking;
  synth.cancel();
  if (speakBtn) speakBtn.classList.remove('on');
  speakBtn = null;
  if (wasThis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = slow ? 0.6 : 0.9;
  const pick = jaVoice();
  if (pick) u.voice = pick;
  else if (synth.getVoices().length) hud('Sin voz en japonés: instálala en los ajustes del teléfono');
  speakBtn = btn; if (btn) btn.classList.add('on');
  u.onend = u.onerror = () => { if (btn) btn.classList.remove('on'); if (speakBtn === btn) speakBtn = null; };
  synth.speak(u);
}
function jaVoice() {
  try {
    const voices = window.speechSynthesis.getVoices().filter(v => /^ja[-_]?/i.test(v.lang));
    return voices.find(v => /Kyoko|Otoya|O-ren|Hattori|Google|ja-jp-x/i.test(v.name + ' ' + v.voiceURI)) || voices[0] || null;
  } catch (e) { return null; }
}
function voiceState() {
  if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') return ['hot', IS_ANDROID ? 'Abre en Chrome' : 'No disponible'];
  const all = window.speechSynthesis.getVoices();
  if (jaVoice()) return ['ok', 'Instalada'];
  return all.length ? ['warn', 'Falta instalar'] : ['', 'Revisar con «Probar»'];
}
try {

const view = $('#view');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TABS = ['hoy', 'itinerario', 'pendientes', 'chat', 'reservas', 'guia'];
function route(opts = {}) {
  const h = (location.hash || '#hoy').slice(1);
  closeSheet(true);
  if (h === 'guia-claude') { history.replaceState(null, '', '#chat'); return route(opts); }
  let tab = h, v;
  const m = h.match(/^dia(\d{1,2})$/);
  if (m && DAYS[+m[1] - 1]) { tab = 'itinerario'; v = viewDay(+m[1]); }
  else if (h === 'itinerario') v = viewItin();
  else if (h === 'pendientes') v = viewPend();
  else if (h === 'chat') v = viewChat();
  else if (h === 'reservas') v = viewReservas();
  else if (h === 'guia' || h.startsWith('guia-')) { tab = 'guia'; v = viewGuia(h.slice(5)); }
  else { tab = 'hoy'; v = viewHoy(); }
  $('#navL').innerHTML = v.back ? `<a href="${v.back.href}">${v.back.label}</a>` : '';
  $('#navT').innerHTML = v.title;
  view.innerHTML = `<header class="lt">${v.lead || ''}<div>${v.cap ? `<div class="cap">${esc(v.cap)}</div>` : ''}<h1>${v.title}</h1></div></header>${v.body}`;
  document.querySelectorAll('.tabs a').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('.tabs').style.setProperty('--ti', Math.max(0, TABS.indexOf(tab)));
  if (v.after) v.after();
  if (mem.lastHash !== h) window.scrollTo(0, 0);
  mem.lastHash = h;
  afterRender(opts);
  onScroll();
}
function afterRender(opts) {
  view.classList.remove('anim');
  if (opts.stagger && !RM) {
    void view.offsetWidth;
    [...view.children].forEach((el, i) => el.style.setProperty('--d', Math.min(i, 10)));
    view.classList.add('anim');
    view.querySelectorAll('.countup').forEach(el => {
      const to = +el.dataset.to, t0 = performance.now();
      const stepf = now => { const k = Math.min(1, (now - t0) / 900); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(stepf); };
      requestAnimationFrame(stepf);
    });
  }
  view.querySelectorAll('.seg[data-to]').forEach(sg => requestAnimationFrame(() => requestAnimationFrame(() => sg.style.setProperty('--i', sg.dataset.to))));
  mem.segFrom = null;
  if (mem.pop) { const b = view.querySelector(`.chk[data-check="${mem.pop}"]`); if (b) b.classList.add('pop'); mem.pop = null; }
  const nc = view.querySelector('.nowc');
  if (nc) { if (mem.swipeIn && !RM) nc.classList.add(mem.swipeIn > 0 ? 'in-next' : 'in-prev'); attachSwipe(nc); }
  mem.swipeIn = 0;
  mem.stampPop.clear();
}
const depth = h => /^dia\d|^guia-/.test(h) ? 2 : 1;
function navigate() {
  const h = (location.hash || '#hoy').slice(1), prev = mem.lastHash;
  let dir = null;
  if (prev != null && prev !== h) {
    const dp = depth(prev), dh = depth(h);
    const dn = (x => { const mm = x.match(/^dia(\d+)$/); return mm ? +mm[1] : null; });
    if (dn(prev) && dn(h)) dir = dn(h) > dn(prev) ? 'push' : 'pop';
    else if (TABS.includes(h) && TABS.includes(prev)) dir = 'fade';
    else dir = dh > dp ? 'push' : dh < dp ? 'pop' : 'fade';
  }
  if (dir && document.startViewTransition && !RM) {
    const root = document.documentElement;
    root.dataset.nav = dir;
    const vt = document.startViewTransition(() => route({ stagger: dir === 'fade' }));
    vt.finished.finally(() => { delete root.dataset.nav; });
  } else route({ stagger: true });
}
function rerender() { const y = window.scrollY; route(); window.scrollTo(0, y); onScroll(); }


/* ---------- Fondo animado: Tokio de noche ----------
   Skyline procedural en dos capas, ventanas que parpadean, letreros de neón en
   kanji, lluvia fina y un tren de luz que cruza a lo lejos. 30 fps, se pausa
   cuando la pestaña no está visible y queda quieto con "reducir movimiento". */
const BG = (() => {
  const c = $('#bgfx'), x = c.getContext('2d');
  // Cielo por momento del día; el clima lo mezcla hacia gris y agrega nubes, lluvia o nieve.
  const PH = {

function setScenePart(key, v, ev) { store.set(key, v); withReveal(() => { applyTheme(); rerender(); }, ev); }
function sceneSummary() { const sc = mem.scene || computeScene(); return `${CITY[sc.city].n} · ${PHASE_N[sc.phase]} · ${WX_N[sc.weather]}`; }
const WXI = {
  clear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.2M12 19v2.2M2.8 12H5M19 12h2.2M5.5 5.5l1.5 1.5M17 17l1.5 1.5M5.5 18.5L7 17M17 7l1.5-1.5"/></svg>',
  cloudy: '<svg viewBox="0 0 24 24"><path d="M7 18.5a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.5 2 3.5 3.5 0 0 1-.5 7z"/></svg>',
  rain: '<svg viewBox="0 0 24 24"><path d="M7 14.5a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.5 2 3.5 3.5 0 0 1-.5 7z"/><path d="M8 17.5l-1 3M12 17.5l-1 3M16 17.5l-1 3"/></svg>',
  snow: '<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 6l2.5-1.5M9.5 19.5 12 18l2.5 1.5"/></svg>'
};
function wxPicker() {
  const wd = store.get('wxDay', null), cur = wd && wd.d === jstNow().ymd ? wd.w : null;
  return `<div class="r wxrow"><div class="m"><div class="t sm">¿Cómo está el clima ahora?</div><div class="x">${cur ? 'Marcado: ' + WX_N[cur] + '. El fondo de la app lo refleja.' : 'Tócalo y el fondo de la app lo refleja hoy.'}</div></div>
    <div class="wxb">${Object.keys(WX_N).map(k => `<button type="button" data-wx="${k}" aria-pressed="${cur === k}" aria-label="${WX_N[k]}">${WXI[k]}</button>`).join('')}</div></div>`;
}
function onScroll() { document.body.classList.toggle('scrolled', window.scrollY > 36); }

function copyText(txt) {
  const fail = () => openSheet('Copiar', showCard('', esc(txt), 'Mantén presionado el texto para copiarlo.'));
  try { navigator.clipboard.writeText(txt).then(() => hud('Copiado'), fail); } catch (e) { fail(); }
}
// Swipe de la tarjeta de Hoy: sigue al dedo, se inclina, resiste en los extremos y sale volando
function attachSwipe(card) {
  const n = +card.dataset.day, i = +card.dataset.i, max = +card.dataset.max;
  let x0 = null, y0 = 0, t0 = 0, dx = 0, lock = null;
  const reset = () => { card.style.transition = 'transform .55s cubic-bezier(.34,1.45,.64,1)'; card.style.transform = ''; };
  card.addEventListener('pointerdown', e => { if (e.button > 0) return; x0 = e.clientX; y0 = e.clientY; t0 = performance.now(); dx = 0; lock = null; });
  card.addEventListener('pointermove', e => {
    if (x0 == null) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!lock) {
      if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) { lock = 'x'; try { card.setPointerCapture(e.pointerId); } catch (err) {} card.style.transition = 'none'; card.classList.add('drag'); }
      else if (Math.abs(my) > 8) lock = 'y';
    }
    if (lock !== 'x') return;
    dx = mx;
    const edge = (dx > 0 && i === 0) || (dx < 0 && i === max - 1);
    const d = edge ? dx * .22 : dx;
    card.style.transform = `translateX(${d}px) rotate(${d * .025}deg)`;
  });
  const end = () => {
    if (x0 == null) return;
    const was = lock === 'x'; x0 = null; card.classList.remove('drag');
    if (!was) return;
    mem.swallowClick = true; setTimeout(() => { mem.swallowClick = false; }, 80);
    const v = Math.abs(dx) / Math.max(1, performance.now() - t0), dir = dx < 0 ? 1 : -1, ni = i + dir;
    if ((Math.abs(dx) > 70 || v > .5) && ni >= 0 && ni < max) {
      card.style.transition = 'transform .26s cubic-bezier(.4,0,.6,1), opacity .26s';
      card.style.transform = `translateX(${-dir * 115}%) rotate(${-dir * 9}deg)`;
      card.style.opacity = '0';
      setTimeout(() => { mem.focus = { n, i: ni }; mem.swipeIn = dir; rerender(); }, 210);
    } else reset();
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}
document.addEventListener('click', e => { if (mem.swallowClick) { e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-say],[data-check],[data-taxi],[data-copy],[data-phrase],[data-del],[data-preview],[data-preview-off],[data-kid],[data-seg],[data-base],[data-ticket],[data-step],[data-focus],[data-food],[data-theme-set],[data-stamp],[data-ask],[data-chat-stop],[data-chat-clear],[data-doc],[data-doc-add],[data-doc-del],[data-offline-all],[data-doc-edit],[data-pet-pick],[data-pet],[data-me],[data-unstamp],[data-sheet-close],[data-scene-phase],[data-scene-wx],[data-wx],[data-scene-city]');
  if (!t) return;
  const d = t.dataset;
  const sg = t.closest('.seg');
  if (sg) mem.segFrom = { key: sg.dataset.key, i: [...sg.querySelectorAll('button')].findIndex(b => b.getAttribute('aria-pressed') === 'true') };
  if (d.say) speak(d.say, 'slow' in d, t);
  else if (d.check) { toggleCheck(d.check); if (checks()[d.check]) mem.pop = d.check; rerender(); }
  else if (d.themeSet) setTheme(d.themeSet, e);
  else if (d.scenePhase) setScenePart('scenePhase', d.scenePhase, e);
  else if (d.sceneWx) setScenePart('sceneWx', d.sceneWx, e);
  else if (d.sceneCity) setScenePart('sceneCity', d.sceneCity, e);
  else if (d.wx) { const wd = store.get('wxDay', null), on = wd && wd.d === jstNow().ymd && wd.w === d.wx; store.set('wxDay', on ? null : { d: jstNow().ymd, w: d.wx }); applyTheme(); rerender(); hud(on ? 'Clima automático' : 'Clima: ' + WX_N[d.wx]); }
  else if (d.doc) openDoc(d.doc);
  else if ('docAdd' in d) uploadSheet();
  else if (d.docDel) deleteDoc(d.docDel, t);
  else if (d.docEdit) editSheet(d.docEdit);
  else if ('petPick' in d) petSheet();
  else if (d.pet) { store.set('pet', d.pet); closeSheet(true); rerender(); const pe = $('.petcard .pet'); if (pe) pe.classList.add('hello'); hud('¡Hola, soy ' + PETS[d.pet].n + '!'); }
  else if (d.me) { store.set('me', d.me); const nx = mem.afterMe; mem.afterMe = null; if (!$('#sheet').hidden) closeSheet(true); rerender(); hud('Marcando como ' + famName(d.me)); if (nx) stampTap(nx); }
  else if (d.unstamp) unstamp(d.unstamp);
  else if ('sheetClose' in d) closeSheet();
  else if ('offlineAll' in d) saveAllOffline(t);
  else if (d.stamp) stampTap(d.stamp);
  else if (d.ask != null) { if (d.ask.endsWith(': ')) { const ta = $('#chatIn'); ta.value = d.ask; mem.draft = d.ask; ta.focus(); } else askClaude(d.ask); }
  else if ('chatStop' in d) { if (mem.chatCtl) mem.chatCtl.abort(); }
  else if ('chatClear' in d) { store.set('chat2', []); rerender(); }
  else if (d.taxi) taxiSheet(d.taxi);
  else if (d.copy) copyText(d.copy);
  else if (d.phrase) { const p = PHRASES[+d.phrase]; openSheet('Frase', showCard(esc(p[0]), esc(p[1]), `<span style="font-family:var(--mono)">${esc(p[2])}</span>`, p[1].replace('…', ''))); }
  else if (d.del) { store.set('gastos', store.get('gastos', []).filter(x => String(x.id) !== d.del)); rerender(); }
  else if (d.seg) { const [n, k] = d.seg.split(':'); mem.seg[n] = k; rerender(); }
  else if (d.base) baseSheet(d.base);
  else if (d.ticket) ticketSheet(+d.ticket);
  else if ('preview' in d) { mem.preview = +$('#pv').value; mem.previewHm = $('#pvh').value || '10:00'; mem.focus = null; route(); window.scrollTo(0, 0); }
  else if (d.step != null) {
    const n = mem.preview || DAYS[dayIndexFor(jstNow().ymd)].n;
    if (+d.step === 0) mem.focus = null;
    else { const cur = $('.nowc .pos').textContent.split(' ')[0] - 1; mem.focus = { n, i: Math.max(0, Math.min(DAYS[n - 1].items.length - 1, cur + +d.step)) }; mem.swipeIn = +d.step; }
    rerender();
  }
  else if (d.focus != null) { mem.swipeIn = 1; mem.focus = { n: mem.preview || DAYS[dayIndexFor(jstNow().ymd)].n, i: +d.focus }; route(); window.scrollTo(0, 0); }
  else if (d.food) { mem.foodMode = d.food; rerender(); }
  else if ('previewOff' in d) { mem.preview = 0; mem.focus = null; route(); window.scrollTo(0, 0); }
  else if ('kid' in d) {
    const k = store.get('kid', { n: 'Sam', p1: '', p2: '' });
    const b = BASES[baseForNight(jstNow().ymd)];
    openSheet('Tarjeta de ' + (k.n || 'Sam'), showCard('迷子です。両親に電話してください。', esc(k.n || 'Sam'),
      `Me perdí. Por favor llame a mis papás.<br><b style="font-size:24px;color:var(--label)">${esc(k.p1)}${k.p2 ? '<br>' + esc(k.p2) : ''}</b><br><br><span lang="ja">宿泊先：${esc(b.ja)}</span>`, '迷子です。両親に電話してください。泊まっているところは、' + b.say + 'です。'));
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'docForm') { e.preventDefault(); uploadDocs(); return; }
  if (e.target.id === 'docEditForm') { e.preventDefault(); saveEdit(e.target); return; }
  if (e.target.id === 'chatForm') { e.preventDefault(); askClaude($('#chatIn').value); return; }
  if (e.target.id !== 'gForm') return;
  e.preventDefault();
  const y = Math.round(+$('#gY').value); if (!y) return;
  const g = store.get('gastos', []);
  g.push({ id: Date.now(), y, c: $('#gC').value, n: $('#gN').value.trim(), d: jstNow().ymd });
  store.set('gastos', g); rerender(); hud('Gasto agregado');
});
document.addEventListener('change', e => {
  if (e.target.id === 'repFile') { replaceDoc(e.target.dataset.rep, e.target.files[0]); return; }
  if (e.target.id !== 'docFile') return;
  const f = [...e.target.files];
  $('#docFileName').textContent = f.length ? f.length === 1 ? f[0].name : f.length + ' archivos listos' : 'Toca aquí para elegir PDF o imagen';
  $('#docFileInfo').textContent = f.length ? fmtSize(f.reduce((a, x) => a + x.size, 0)) + ' · toca «Subir» abajo' : 'PDF, JPG o PNG · máx. 20 MB';
  if (f.length === 1 && !$('#docName').value) $('#docName').value = f[0].name.replace(/\.[^.]+$/, '');
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'chatIn') { mem.draft = e.target.value; e.target.style.height = 'auto'; e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px'; }
  if (id === 'cvJpy' || id === 'cvRate') { const r = +$('#cvRate').value || 0; if (id === 'cvRate') store.set('rate', r); $('#cvMxn').value = ((+$('#cvJpy').value || 0) * r).toFixed(2); }
  if (id === 'cvMxn') { const r = +$('#cvRate').value || 0; $('#cvJpy').value = r ? Math.round((+$('#cvMxn').value || 0) / r) : 0; }
  if (id === 'kidN' || id === 'kidP1' || id === 'kidP2') store.set('kid', { n: $('#kidN').value, p1: $('#kidP1').value, p2: $('#kidP2').value });
});
$('#sheetClose').addEventListener('click', closeSheet);
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => {
  if (e.target.id === 'chatIn' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); askClaude(e.target.value); return; } if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('hashchange', navigate);
$('#themeB').addEventListener('click', e => setTheme(isDark() ? 'light' : 'dark', e));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (themeMode() === 'system') { applyTheme(); rerender(); } });

function tick() {
  const now = jstNow(); $('#clock').innerHTML = `<b>${now.hm}</b><br>Japón`;
  // En el viaje, la pestaña Hoy se actualiza sola cada minuto
  const onHoy = !location.hash || location.hash === '#hoy';
  const live = onHoy && !mem.preview && now.ymd >= TRIP_START && now.ymd <= TRIP_END;
  if (live && mem.lastTick && mem.lastTick !== now.hm && $('#sheet').hidden && !/INPUT|SELECT/.test((document.activeElement || {}).tagName || '')) rerender();
  mem.lastTick = now.hm;
  const sc = computeScene();
  if (mem.scene && (sc.phase !== mem.scene.phase || sc.weather !== mem.scene.weather || sc.city !== mem.scene.city)) { const before = isDark(); applyTheme(); if (before !== isDark() && $('#sheet').hidden) rerender(); }
}
mem.scene = computeScene();
BG.init(mem.scene);
applyTheme();
tick(); setInterval(tick, 30000);
route({ stagger: true });
