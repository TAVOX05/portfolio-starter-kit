/* ---------- Hora de salir ---------- */
const fmtHM = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
function leaveInfo(day, hm) {
  for (const [k, it] of day.items.entries()) {
    if (it.t <= hm) continue;
    const legs = legsForItem(day, it); if (!legs.length) continue;
    const l = legs[0];
    if (k > 0 && (day.items[k - 1].p || []).includes(l.d)) continue; // ya están ahí
    const mins = l.steps.filter(s => !s.alt).reduce((a, s) => a + (s.min || 0), 0);
    const leave = toMin(it.t) - mins - 10;
    return { it, l, mins, leave, left: leave - toMin(hm) };
  }
  return null;
}
function leaveHtml(day, hm) {
  const L = leaveInfo(day, hm); if (!L) return '';
  const a = place(L.l.o), b = place(L.l.d);
  const st = L.left <= 0 ? 'late' : L.left <= 10 ? 'now' : L.left <= 30 ? 'soon' : '';
  const head = L.left <= 0 ? '¡Ya deberían salir!' : `Salgan a las ${fmtHM(L.leave)}`;
  const sub = L.left <= 0 ? `${L.it.h} empieza a las ${L.it.t}` : `en ${fmtMin(L.left)} · ${L.mins} min de trayecto + 10 de margen`;
  return `<section class="leave ${st}"><div class="lv-top"><span class="lv-k">Hora de salir</span><span class="lv-to">→ ${esc(b.n)}</span></div>
    <div class="lv-h">${head}</div><div class="lv-s">${esc(sub)}</div>${flowHtml(L.l)}
    <div class="lv-btns"><a class="lnk" href="${gmRoute(L.l.o, L.l.d, L.l.steps.filter(s => !s.alt).every(s => s.m === 'walk') ? 'walking' : 'transit')}" target="_blank" rel="noopener">Ruta desde ${esc(a.n)}</a><a class="lnk" href="${gmDirFromHere(L.l.d)}" target="_blank" rel="noopener">Desde donde estoy</a></div></section>`;
}

  if (c) return c;
  const r = await fetch('/_blob/' + assetId);
  if (!r.ok) throw new Error('http ' + r.status);
  const b = await r.blob();
  await idb.set(assetId, b); mem.offline.add(assetId);
  return b;
}
let pdfjsP;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  const add = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  // El worker se carga como script normal: pdf.js lo usa en el hilo principal.
  return pdfjsP || (pdfjsP = add('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js').then(() => add('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')).then(() => window.pdfjsLib));
}
async function openDoc(id) {
  const d = mem.docs.find(x => x.id === id); if (!d) return;
  mem.delArm = null;
  const meta = [((DOC_CATS.find(c => c[0] === d.cat) || [])[1]), docLinkName(d.link), fmtSize(d.size || 0)].filter(Boolean).map(esc).join(' · ');
  openSheet(d.name, `<div class="docbar">
      ${mem.assets && mem.isOwner ? `<span class="lnk pick">Reemplazar<input id="repFile" class="filehit" type="file" accept="${ACCEPT}" data-rep="${d.id}" aria-label="Reemplazar archivo"></span>
      <button type="button" class="lnk" data-doc-edit="${d.id}">Editar</button>` : ''}
      <a class="lnk" href="/_blob/${d.assetId}" target="_blank" rel="noopener">Otra pestaña</a>
      ${mem.assets && mem.isOwner ? `<button type="button" class="lnk del" data-doc-del="${d.id}">Borrar</button>` : ''}
    </div>
    <p class="gf" id="repInfo">${meta}</p>
    <div class="docview" id="docview"><p class="gf">Abriendo…</p></div>`);
  const box = $('#docview');
  try {
    const blob = await getBlob(d.assetId);
    if (!box.isConnected) return;
    if (!/pdf/.test(d.type || blob.type)) { box.innerHTML = `<img src="${URL.createObjectURL(blob)}" alt="${esc(d.name)}">`; return; }
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
    box.innerHTML = '';
    const w = box.clientWidth || 340, dpr = Math.min(2, window.devicePixelRatio || 1);
    for (let i = 1; i <= Math.min(pdf.numPages, 30); i++) {
      if (!box.isConnected) return;
      const page = await pdf.getPage(i), v1 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: w / v1.width * dpr });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; cv.setAttribute('aria-label', `${d.name}, página ${i}`);
      box.appendChild(cv);
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    }
    if (pdf.numPages > 30) box.insertAdjacentHTML('beforeend', '<p class="gf">Se muestran las primeras 30 páginas.</p>');
  } catch (e) {
    if (box.isConnected) box.innerHTML = `<p class="gf">No se pudo abrir aquí${navigator.onLine === false ? ': no hay internet y este documento no está guardado en el teléfono' : ''}. Prueba el botón «Otra pestaña».</p>`;
  }
}
async function deleteDoc(id, btn) {
  const lbl = btn.querySelector('.t') || btn;
  if (mem.delArm !== id) { mem.delArm = id; lbl.textContent = '¿Seguro? Toca otra vez'; btn.classList.add('armed'); return; }
  const d = mem.docs.find(x => x.id === id); if (!d) return;
  lbl.textContent = 'Borrando…';
  try { await mem.assets.delete(d.assetId); } catch (e) { if (e.code !== 'not_found') { lbl.textContent = 'No se pudo borrar'; return; } }
  try { await mem.db.doc('docs/' + id).delete(); } catch (e) {}
  await idb.del(d.assetId); mem.offline.delete(d.assetId);
  mem.docs = mem.docs.filter(x => x.id !== id); mem.docsDirty = true;
  closeSheet(); hud('Documento borrado');
}
async function replaceDoc(id, f) {
  const d = mem.docs.find(x => x.id === id), info = $('#repInfo');
  if (!d || !f) return;
  const type = fileType(f);
  if (!type) { info.textContent = `«${f.name}» no es PDF, JPG ni PNG.`; return; }
  info.textContent = 'Subiendo el archivo nuevo…';
  try {
    const r = await mem.assets.upload(f, type !== f.type ? { type } : undefined);
    const patch = { assetId: r.id, type: r.contentType, size: r.sizeBytes, updatedAt: new Date().toISOString() };
    await mem.db.doc('docs/' + id).update(patch);
    const old = d.assetId;
    Object.assign(d, patch);
    await idb.set(r.id, f); mem.offline.add(r.id);
    try { await mem.assets.delete(old); } catch (e) {}
    await idb.del(old); mem.offline.delete(old);
    hud('Archivo reemplazado'); mem.docsDirty = true;
    openDoc(id);
  } catch (e) { info.textContent = upErr(e, f); }
}

  if (d.say) speak(d.say, 'slow' in d, t);
  else if (d.shopBuy) { const x = shopItems().find(z => z.id === d.shopBuy); if (x) { if (!x.bought) mem.pop = null; shopWrite('update', x.id, { bought: !x.bought }).catch(() => hud('No se pudo guardar')); } }
  else if (d.shopDel) {
    if (mem.shopArm === d.shopDel) { mem.shopArm = null; shopWrite('delete', d.shopDel).then(() => hud('Quitado de la lista'), () => hud('No se pudo quitar')); }
    else { mem.shopArm = d.shopDel; rerender(); setTimeout(() => { if (mem.shopArm === d.shopDel) { mem.shopArm = null; rerender(); } }, 3000); }
  }
  else if (d.shopIdea != null) { const [nm, c] = SOUVENIRS[+d.shopIdea]; shopWrite('add', null, { name: nm, who: '', budget: 0, city: c, bought: false, by: meKey(), createdAt: new Date().toISOString() }).then(() => hud('Agregado a la lista'), () => hud('No se pudo agregar')); }
  else if (d.check) { toggleCheck(d.check); if (checks()[d.check]) mem.pop = d.check; rerender(); }
  else if (d.themeSet) setTheme(d.themeSet, e);
  else if (d.scenePhase) setScenePart('scenePhase', d.scenePhase, e);
  else if (d.sceneWx) setScenePart('sceneWx', d.sceneWx, e);
  else if (d.sceneCity) setScenePart('sceneCity', d.sceneCity, e);
  else if (d.wx) { const wd = store.get('wxDay', null), on = wd && wd.d === jstNow().ymd && wd.w === d.wx; store.set('wxDay', on ? null : { d: jstNow().ymd, w: d.wx }); applyTheme(); rerender(); hud(on ? 'Clima automático' : 'Clima: ' + WX_N[d.wx]); }
  else if (d.doc) openDoc(d.doc);
  else if ('docAdd' in d) uploadSheet();
  else if (d.docDel) deleteDoc(d.docDel, t);
  else if (d.docEdit) editSheet(d.docEdit);
  else if ('petPick' in d) petSheet();
  else if (d.pet) { store.set('pet', d.pet); closeSheet(true); rerender(); const pe = $('.petcard .pet'); if (pe) pe.classList.add('hello'); hud('¡Hola, soy ' + PETS[d.pet].n + '!'); }
  else if (d.me) { store.set('me', d.me); const nx = mem.afterMe; mem.afterMe = null; if (!$('#sheet').hidden) closeSheet(true); rerender(); hud('Marcando como ' + famName(d.me)); if (nx) stampTap(nx); }
  else if (d.unstamp) unstamp(d.unstamp);
  else if ('sheetClose' in d) closeSheet();
  else if ('offlineAll' in d) saveAllOffline(t);
  else if (d.extra) toggleExtra(d.extra);
  else if (d.stamp) stampTap(d.stamp);
  else if (d.ask != null) { if (d.ask.endsWith(': ')) { const ta = $('#chatIn'); ta.value = d.ask; mem.draft = d.ask; ta.focus(); } else askClaude(d.ask); }
  else if ('chatStop' in d) { if (mem.chatCtl) mem.chatCtl.abort(); }
  else if ('chatClear' in d) { store.set('chat2', []); rerender(); }
  else if (d.taxi) taxiSheet(d.taxi);
  else if (d.copy) copyText(d.copy);
  else if (d.phrase) { const p = PHRASES[+d.phrase]; openSheet('Frase', showCard(esc(p[0]), esc(p[1]), `<span style="font-family:var(--mono)">${esc(p[2])}</span>`, p[1].replace('…', ''))); }
  else if (d.del) { store.set('gastos', store.get('gastos', []).filter(x => String(x.id) !== d.del)); rerender(); }
  else if (d.seg) { const [n, k] = d.seg.split(':'); mem.seg[n] = k; rerender(); }
  else if (d.base) baseSheet(d.base);
  else if (d.ticket) ticketSheet(+d.ticket);
  else if ('preview' in d) { mem.preview = +$('#pv').value; mem.previewHm = $('#pvh').value || '10:00'; mem.focus = null; route(); window.scrollTo(0, 0); }
  else if (d.step != null) {
    const n = mem.preview || DAYS[dayIndexFor(jstNow().ymd)].n;
    const top = $('.deck > .nowc:not([inert])');
    if (+d.step === 0) { mem.focus = null; mem.swipeIn = top && +top.dataset.i > +top.dataset.auto ? -1 : 1; rerender(); }
    else if (top && top._go && top._go(+d.step)) { /* el mazo se anima y confirma solo */ }
    else if (top) { const cur = +top.dataset.i; mem.focus = { n, i: Math.max(0, Math.min(DAYS[n - 1].items.length - 1, cur + +d.step)) }; rerender(); }
  }
  else if (d.focus != null) { mem.swipeIn = 1; mem.focus = { n: mem.preview || DAYS[dayIndexFor(jstNow().ymd)].n, i: +d.focus }; route(); window.scrollTo(0, 0); }
  else if (d.food) { mem.foodMode = d.food; rerender(); }
  else if ('previewOff' in d) { mem.preview = 0; mem.focus = null; route(); window.scrollTo(0, 0); }
  else if ('kid' in d) {
    const k = store.get('kid', { n: 'Sam', p1: '', p2: '' });
    const b = BASES[baseForNight(jstNow().ymd)];
    openSheet('Tarjeta de ' + (k.n || 'Sam'), showCard('迷子です。両親に電話してください。', esc(k.n || 'Sam'),
      `Me perdí. Por favor llame a mis papás.<br><b style="font-size:24px;color:var(--label)">${esc(k.p1)}${k.p2 ? '<br>' + esc(k.p2) : ''}</b><br><br><span lang="ja">宿泊先：${esc(b.ja)}</span>`, '迷子です。両親に電話してください。泊まっているところは、' + b.say + 'です。'));
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'docForm') { e.preventDefault(); uploadDocs(); return; }
  if (e.target.id === 'docEditForm') { e.preventDefault(); saveEdit(e.target); return; }
  if (e.target.id === 'chatForm') { e.preventDefault(); askClaude($('#chatIn').value); return; }
  if (e.target.id === 'shopForm') {
    e.preventDefault();
    const name = $('#shN').value.trim(); if (!name) return;
    shopWrite('add', null, { name, who: $('#shW').value.trim(), budget: Math.max(0, Math.round(+$('#shB').value || 0)), city: $('#shC').value, bought: false, by: meKey(), createdAt: new Date().toISOString() })
      .then(() => { hud('Agregado a la lista'); const f = $('#shopForm'); if (f) f.reset(); }, () => hud('No se pudo agregar'));
    return;
  }
  if (e.target.id !== 'gForm') return;
  e.preventDefault();
  const y = Math.round(+$('#gY').value); if (!y) return;
  const g = store.get('gastos', []);
  g.push({ id: Date.now(), y, c: $('#gC').value, n: $('#gN').value.trim(), d: jstNow().ymd });
  store.set('gastos', g); rerender(); hud('Gasto agregado');
});
document.addEventListener('change', e => {
  if (e.target.id === 'repFile') { replaceDoc(e.target.dataset.rep, e.target.files[0]); return; }
  if (e.target.id !== 'docFile') return;
  const f = [...e.target.files];
  $('#docFileName').textContent = f.length ? f.length === 1 ? f[0].name : f.length + ' archivos listos' : 'Toca aquí para elegir PDF o imagen';
  $('#docFileInfo').textContent = f.length ? fmtSize(f.reduce((a, x) => a + x.size, 0)) + ' · toca «Subir» abajo' : 'PDF, JPG o PNG · máx. 20 MB';
  if (f.length === 1 && !$('#docName').value) $('#docName').value = f[0].name.replace(/\.[^.]+$/, '');
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'chatIn') { mem.draft = e.target.value; e.target.style.height = 'auto'; e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px'; }
  if (id === 'cvJpy' || id === 'cvRate') { const r = +$('#cvRate').value || 0; if (id === 'cvRate') store.set('rate', r); $('#cvMxn').value = ((+$('#cvJpy').value || 0) * r).toFixed(2); }
  if (id === 'cvMxn') { const r = +$('#cvRate').value || 0; $('#cvJpy').value = r ? Math.round((+$('#cvMxn').value || 0) / r) : 0; }
  if (id === 'kidN' || id === 'kidP1' || id === 'kidP2') store.set('kid', { n: $('#kidN').value, p1: $('#kidP1').value, p2: $('#kidP2').value });
});
$('#sheetClose').addEventListener('click', closeSheet);
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => {
  if (e.target.id === 'chatIn' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); askClaude(e.target.value); return; } if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('hashchange', navigate);
$('#themeB').addEventListener('click', e => setTheme(isDark() ? 'light' : 'dark', e));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (themeMode() === 'system') { applyTheme(); rerender(); } });

function tick() {
  const now = jstNow(); $('#clock').innerHTML = `<b>${now.hm}</b><br>Japón`;
  // En el viaje, la pestaña Hoy se actualiza sola cada minuto
  const onHoy = !location.hash || location.hash === '#hoy';
  const live = onHoy && !mem.preview && now.ymd >= TRIP_START && now.ymd <= TRIP_END;
  if (live && mem.lastTick && mem.lastTick !== now.hm && $('#sheet').hidden && !/INPUT|SELECT/.test((document.activeElement || {}).tagName || '')) rerender();
  mem.lastTick = now.hm;
  const sc = computeScene();
  if (mem.scene && (sc.phase !== mem.scene.phase || sc.weather !== mem.scene.weather || sc.city !== mem.scene.city)) { const before = isDark(); applyTheme(); if (before !== isDark() && $('#sheet').hidden) rerender(); }
}
mem.scene = computeScene();
BG.init({ ...mem.scene, dark: isDark() });
applyTheme();
tick(); setInterval(tick, 30000);
route({ stagger: true });
</script>
