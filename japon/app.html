<title>Japón 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: app nativa estilo iOS — barra de navegación translúcida, título grande, listas agrupadas con inserción, barra de pestañas abajo y hojas que suben. Los días conservan su color de "línea" por ciudad. */
:root {
  /* «Washi & Sumi»: papel, tinta y colores tradicionales japoneses. Todo texto ≥ 7:1 (AAA). */
  --bg: #F7F5F0; --card: #FFFFFF; --fill: rgba(22,23,28,.06); --fill2: rgba(22,23,28,.10); --segsel: #FFFFFF;
  --label: #16171C; --label2: #3B3C45; --label3: #8A8B94; --label-h: #2E2F37; --sep: rgba(22,23,28,.14); --gray: #43444D;
  --tint: #1A4886; --green: #175A33; --orange: #573A00; --red: #7A2318; --yellow: #644200; --indigo: #3B3FA8; --teal: #07565E; --purple: #5A3689; --pink: #8C1B43;
  --on: #FFFFFF; --chip: #FFFFFF; --halo: rgba(247,245,240,.95);
  --bar: rgba(249,249,249,.84); --barline: rgba(0,0,0,.2);
  --sea: #D5E4F1; --land: #F8F8F3; --coast: #A5B4C3; --sun: #87271A;
  --c-TK: #87271A; --c-FJ: #1A4886; --c-KY: #5A3689; --c-OS: #8C1B43; --c-KB: #07565E; --c-KZ: #644200; --c-HD: #5F4227;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", Roboto, "Noto Sans JP", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1018; --card: #1A1C26; --fill: rgba(200,205,225,.10); --fill2: rgba(200,205,225,.16); --segsel: #3A3C47;
  --label: #F4F4F7; --label2: #C3C5D0; --label3: #6C6E7A; --label-h: #D5D7E0; --sep: rgba(200,205,225,.16); --gray: #C0C2CC;
  --tint: #A6C6F7; --green: #8BD6A3; --orange: #F2C46B; --red: #FFB8A6; --yellow: #F2C46B; --indigo: #B8BBF8; --teal: #86D8E0; --purple: #D3B7F7; --pink: #F8ABC2;
  --on: #0E1220; --chip: #1A1C26; --halo: rgba(14,16,24,.95);
  --bar: rgba(22,22,24,.84); --barline: rgba(255,255,255,.16);
  --sea: #0E1B28; --land: #1C1C1E; --coast: #3A4756; --sun: #FFB8A6;
  --c-TK: #FFB8A6; --c-FJ: #A6C6F7; --c-KY: #D3B7F7; --c-OS: #F8ABC2; --c-KB: #86D8E0; --c-KZ: #F2C46B; --c-HD: #DDBD98;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1018; --card: #1A1C26; --fill: rgba(200,205,225,.10); --fill2: rgba(200,205,225,.16); --segsel: #3A3C47;
  --label: #F4F4F7; --label2: #C3C5D0; --label3: #6C6E7A; --label-h: #D5D7E0; --sep: rgba(200,205,225,.16); --gray: #C0C2CC;
  --tint: #A6C6F7; --green: #8BD6A3; --orange: #F2C46B; --red: #FFB8A6; --yellow: #F2C46B; --indigo: #B8BBF8; --teal: #86D8E0; --purple: #D3B7F7; --pink: #F8ABC2;
  --on: #0E1220; --chip: #1A1C26; --halo: rgba(14,16,24,.95);
  --bar: rgba(22,22,24,.84); --barline: rgba(255,255,255,.16);
  --sea: #0E1B28; --land: #1C1C1E; --coast: #3A4756; --sun: #FFB8A6;
  --c-TK: #FFB8A6; --c-FJ: #A6C6F7; --c-KY: #D3B7F7; --c-OS: #F8ABC2; --c-KB: #86D8E0; --c-KZ: #F2C46B; --c-HD: #DDBD98;
  color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--label); font-family: var(--font); font-size: 17px; line-height: 1.3; letter-spacing: -.01em; margin: 0; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body.scrolled::before { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
a { color: var(--tint); text-decoration: none; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, p { margin: 0; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* barra de navegación */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: .5px solid transparent; transition: background-color .2s, border-color .2s; }
body.scrolled .nav { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom-color: var(--barline); }
.nav .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; gap: 8px; }
.nav-l a { display: inline-flex; align-items: center; gap: 2px; font-size: 17px; white-space: nowrap; }
.nav-l a::before { content: ""; width: 11px; height: 11px; border-left: 2.6px solid var(--tint); border-bottom: 2.6px solid var(--tint); transform: rotate(45deg); margin: 0 4px 0 4px; border-radius: 1px; }
.nav-t { font-size: 17px; font-weight: 600; text-align: center; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
body.scrolled .nav-t { opacity: 1; }
.nav-r { text-align: right; font-size: 13px; color: var(--label2); white-space: nowrap; line-height: 1.15; }
.nav-r b { color: var(--label); font-weight: 600; font-size: 15px; }

/* título grande */
.lt { padding: 2px 0 14px; display: flex; gap: 14px; align-items: center; }
.lt .cap { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: .02em; }
.lt h1 { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
.lt .st + div h1 { font-size: 28px; line-height: 34px; }
.lt .sub { font-size: 15px; color: var(--label2); margin-top: 2px; }

main { padding-block: 4px 28px; display: grid; gap: 24px; }

/* listas agrupadas */
.grp { display: grid; gap: 6px; min-width: 0; }
.gh span + span { flex: none; white-space: nowrap; }
.gh { font-size: 13px; font-weight: 400; text-transform: uppercase; color: var(--label2); padding: 0 16px; letter-spacing: .01em; display: flex; justify-content: space-between; gap: 8px; }
.gf { font-size: 13px; color: var(--label2); padding: 0 16px; line-height: 1.35; }
.list { background: var(--card); border-radius: 12px; overflow: hidden; min-width: 0; }
.r { --inset: 16px; position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 11px 16px; width: 100%; color: var(--label); background: none; border: 0; text-align: left; text-decoration: none; }
.r + .r::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset); border-top: .5px solid var(--sep); }
.r.li { --inset: 52px; } .r.ld { --inset: 58px; } .r.lr { --inset: 62px; }
.r .t.sm { font-size: 15px; line-height: 20px; }
.r .t.sm b { font-weight: 600; }
a.r:active, button.r:active { background: var(--fill2); }
.r .m { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.r .t { font-size: 17px; line-height: 22px; }
.r .t.b { font-weight: 600; }
.r .s { font-size: 15px; line-height: 20px; color: var(--label2); }
.r .x { font-size: 13px; line-height: 18px; color: var(--label2); }
.r .tr { flex: none; color: var(--label2); font-size: 17px; display: flex; align-items: center; gap: 8px; }
.chev::after { content: ""; flex: none; width: 8px; height: 8px; border-top: 2px solid var(--label3); border-right: 2px solid var(--label3); transform: rotate(45deg); margin-left: 2px; }
.r.link .t { color: var(--tint); }
.r.center { justify-content: center; } .r.center .t { color: var(--tint); }
.r.danger .t { color: var(--red); }
.ext::after { content: "↗"; color: var(--label3); font-size: 15px; }

/* iconos tipo Ajustes */
.ico { flex: none; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: var(--b, var(--gray)); color: #fff; }
.ico svg { width: 19px; height: 19px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* pastillas */
.pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--fill); color: var(--label2); }
.pill.ok { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.pill.warn { background: color-mix(in srgb, var(--orange) 18%, transparent); color: var(--orange); }
.pill.hot { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
.pill.now { background: var(--red); color: var(--on); }
.pill.tint { background: color-mix(in srgb, var(--tint) 15%, transparent); color: var(--tint); }

/* roundel de estación */
.st { --c: var(--tint); flex: none; width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--c); background: var(--card); display: grid; place-content: center; text-align: center; line-height: 1; }
.st i { display: block; font-style: normal; font-size: 8px; font-weight: 700; color: var(--c); letter-spacing: .03em; }
.st b { display: block; font-size: 13px; font-weight: 700; }
.st.lg { width: 58px; height: 58px; border-width: 6px; } .st.lg i { font-size: 10px; } .st.lg b { font-size: 20px; }
.st.done { background: var(--c); } .st.done b, .st.done i { color: var(--on); }

/* mini calendario */
.cal { flex: none; width: 34px; border-radius: 7px; overflow: hidden; background: var(--card); box-shadow: 0 0 0 .5px var(--sep); text-align: center; line-height: 1; }
.cal i { display: block; font-style: normal; font-size: 8px; font-weight: 700; color: var(--on); background: var(--red); padding: 2px 0; text-transform: uppercase; }
.cal b { display: block; font-size: 15px; font-weight: 600; padding: 3px 0 4px; }

/* casilla tipo Recordatorios */
.chk { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--label3); background: none; display: grid; place-items: center; padding: 0; cursor: pointer; }
.chk svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.chk[aria-pressed="true"] { background: var(--tint); border-color: var(--tint); }
.chk[aria-pressed="true"] svg { opacity: 1; }
.r.done .t { color: var(--label2); }

/* barra de progreso */
.prog { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--tint); border-radius: 2px; }

/* control segmentado */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; border: 0; background: none; font-size: 13px; font-weight: 500; padding: 6px 4px; border-radius: 7px; cursor: pointer; color: var(--label); }
.seg button[aria-pressed="true"] { background: var(--segsel); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }

/* widget de cuenta regresiva */
.widget { background: var(--card); border-radius: 22px; padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 14px 16px; align-items: center; }
.widget .k { font-size: 13px; font-weight: 600; color: var(--red); text-transform: uppercase; letter-spacing: .02em; }
.widget h2 { font-size: 22px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
.widget .jp { font-size: 15px; color: var(--label2); margin-top: 4px; }
.sun { width: 104px; height: 104px; border-radius: 50%; background: var(--sun); color: var(--on); display: grid; place-content: center; text-align: center; line-height: 1; }
.sun b { font-size: 44px; font-weight: 700; letter-spacing: -.02em; }
.sun span { font-size: 13px; font-weight: 600; margin-top: 2px; }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); border-top: .5px solid var(--sep); padding-top: 12px; }
.stats div { text-align: center; } .stats div + div { border-left: .5px solid var(--sep); }
.stats b { display: block; font-size: 20px; font-weight: 600; } .stats span { font-size: 12px; color: var(--label2); }

/* tarjetas del día */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--card); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile span { display: block; font-size: 13px; color: var(--label2); }
.tile b { font-size: 17px; font-weight: 600; display: block; line-height: 22px; }
.tile .prog { margin-top: 6px; }

/* plan por hora */
.it { align-items: flex-start; }
.it .chk { margin-top: 1px; }
.it .when { font-size: 13px; color: var(--label2); font-weight: 500; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.it.now { background: color-mix(in srgb, var(--red) 7%, var(--card)); }
.it .d { font-size: 15px; line-height: 20px; color: var(--label); }
.it .food { font-size: 15px; line-height: 20px; color: var(--label2); }
.it .food b { color: var(--label); font-weight: 600; }
.it .rec { font-size: 13px; line-height: 18px; color: var(--label2); display: flex; gap: 6px; }
.it .rec::before { content: "ⓘ"; color: var(--tint); }
.it.done .d, .it.done .food { color: var(--label2); }
.it.done .t { text-decoration: line-through; text-decoration-color: var(--label3); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chips a { font-size: 13px; padding: 3px 9px; border-radius: 8px; background: color-mix(in srgb, var(--tint) 12%, transparent); color: var(--tint); font-weight: 500; }

/* rutas */
.badge { flex: none; min-width: 30px; height: 26px; padding: 0 6px; border-radius: 6px; background: var(--c, var(--gray)); color: var(--on); font-size: 11px; font-weight: 700; display: grid; place-items: center; white-space: nowrap; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
.badge svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.badge.walk { background: var(--fill); } .badge.walk svg { stroke: var(--label2); }
.r.step { --inset: 58px; padding-block: 9px; }
.r.step.alt { opacity: .78; }
.r.step .min { font-size: 15px; color: var(--label2); white-space: nowrap; }
.alt-lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--label2); }

/* mapas */
.map { position: relative; z-index: 0; isolation: isolate; height: 320px; border-radius: 12px; overflow: hidden; background: var(--sea); }
.map.tall { height: min(60vh, 520px); }
.pin { background: none; border: 0; }
.pin span { --c: var(--tint); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c); border: 2.5px solid #fff; font-size: 12px; font-weight: 700; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.pin.base span { border-radius: 8px; }
.lab { background: none; border: 0; }
.lab span { display: inline-block; white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--label); text-shadow: 0 0 3px var(--land), 0 0 3px var(--land), 0 0 4px var(--land); transform: translate(16px, -8px); }
.dotn { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: var(--on); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.dotn.base { border-radius: 8px; }

/* formularios en filas */
.r.field label { flex: none; font-size: 17px; }
.r.field input, .r.field select { flex: 1 1 auto; min-width: 0; text-align: right; background: none; border: 0; font-size: 17px; color: var(--label2); padding: 0; appearance: none; -webkit-appearance: none; outline-offset: 4px; }
.r.field input::placeholder { color: var(--label2); }
.big { font-size: 28px; font-weight: 700; }

/* hoja inferior */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 720px; margin: 0 auto; max-height: calc(100% - 44px - env(safe-area-inset-top, 0px)); overflow: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 14px 14px 0 0; padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--label3); margin: 0 auto; }
.sheet-h { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; margin-bottom: 8px; }
.sheet-h b { font-size: 17px; font-weight: 600; text-align: center; }
.sheet-h button { grid-column: 3; justify-self: end; background: none; border: 0; color: var(--tint); font-size: 17px; font-weight: 600; cursor: pointer; padding: 6px 0; }
#sheetBody { display: grid; gap: 20px; }
.show { background: var(--card); border-radius: 16px; padding: 24px 18px; display: grid; gap: 14px; text-align: center; }
.show .say { font-size: clamp(17px, 4.6vw, 24px); color: var(--label2); }
.show .huge { font-size: clamp(28px, 8.5vw, 50px); font-weight: 800; line-height: 1.3; word-break: break-all; }
.show .sub2 { font-size: 15px; color: var(--label2); line-height: 1.4; }

/* HUD */
.hud { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 60; background: var(--bar); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 14px; padding: 14px 22px; font-size: 15px; font-weight: 600; box-shadow: 0 6px 30px rgba(0,0,0,.2); }

/* audio */
.spk { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: color-mix(in srgb, var(--tint) 14%, transparent); color: var(--tint); padding: 0; }
.spk svg, .play svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spk.on, .play.on { background: var(--tint); color: var(--on); }
.tbtn { background: none; border: 0; color: var(--tint); font-size: 15px; cursor: pointer; padding: 4px 0; }
.playbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.play { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 10px; font-size: 17px; font-weight: 600; cursor: pointer; background: var(--tint); color: var(--on); }
.play.alt { background: color-mix(in srgb, var(--tint) 15%, transparent); color: var(--tint); }
.play.alt.on { background: var(--tint); color: var(--on); }

/* hoy en tiempo real */
.nowc { --c: var(--tint); background: var(--card); border-radius: 20px; padding: 16px; display: grid; gap: 8px; box-shadow: inset 0 4px 0 var(--c); }
.nowh { display: flex; align-items: center; gap: 8px; }
.stl { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 3px 9px; border-radius: 999px; background: var(--fill); color: var(--label2); }
.stl.now { background: var(--red); color: var(--on); } .stl.next { background: color-mix(in srgb, var(--tint) 16%, transparent); color: var(--tint); }
.pos { font-size: 13px; color: var(--label2); }
.stp { margin-left: auto; display: flex; gap: 8px; }
.stp button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--fill); color: var(--tint); font-size: 24px; line-height: 1; cursor: pointer; padding-bottom: 3px; }
.stp button:disabled { color: var(--label3); cursor: default; }
.nowc .when { font-size: 15px; color: var(--label2); font-weight: 500; }
.nowc h2 { font-size: 24px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.nowc .d, .nowc .food { font-size: 15px; line-height: 20px; } .nowc .food { color: var(--label2); } .nowc .food b { color: var(--label); }
.nowc .rec { font-size: 13px; color: var(--label2); } .nowc .rec::before { content: "ⓘ "; color: var(--tint); }
.nowc .tbtn { justify-self: start; }
a.play { text-decoration: none; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 4px; }
.flow .badge { height: 22px; min-width: 26px; font-size: 10px; }
.flow .badge svg { width: 14px; height: 14px; }
.sepr { color: var(--label3); font-size: 15px; }
.tm { color: var(--label2); font-size: 15px; margin-right: 4px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.fchip { background: var(--card); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; color: var(--label); }
.fchip b { font-size: 15px; font-weight: 600; } .fchip span { font-size: 12px; color: var(--label2); }

/* barra de pestañas */

}

/* ===== Liquid glass + movimiento estilo iOS ===== */
:root { --card: rgba(255,255,255,.94); --glass: rgba(255,255,255,.82); --glass-brd: rgba(255,255,255,.92); --glass-hi: #FFFFFF; --glass-sh: 0 1px 2px rgba(22,23,28,.06), 0 12px 32px -10px rgba(22,23,28,.18); --amb1: #FFB340; --amb2: #6E8BFF; --amb3: #FF6B9A; --amb-o: .32; --spring: cubic-bezier(.34,1.45,.64,1); --ease: cubic-bezier(.2,.9,.25,1); }

:root[data-theme="dark"] { --card: rgba(26,28,38,.92); --glass: rgba(24,26,36,.80); --glass-brd: rgba(255,255,255,.10); --glass-hi: rgba(255,255,255,.12); --glass-sh: 0 1px 2px rgba(0,0,0,.3), 0 14px 36px -10px rgba(0,0,0,.6); --amb-o: .22; }

body { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }

/* barra de pestañas flotante de vidrio */
.tabs { left: 50%; right: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100% - 20px)); padding-bottom: 0; border: 1px solid var(--glass-brd); border-radius: 32px; background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(200%); backdrop-filter: blur(24px) saturate(200%); box-shadow: var(--glass-sh), inset 0 1px 0 var(--glass-hi); overflow: hidden; }
.tabs::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 50%); }
.tabs .wrap { position: relative; max-width: none; grid-template-columns: repeat(6, 1fr); padding: 4px; }
.tab-ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 6); border-radius: 26px; background: color-mix(in srgb, var(--tint) 15%, transparent); box-shadow: inset 0 1px 0 var(--glass-hi); transform: translateX(calc(var(--ti, 0) * 100%)); transition: transform .6s var(--spring); }
.tabs a { position: relative; z-index: 1; padding: 6px 0 5px; font-size: 10px; min-width: 0; white-space: nowrap; }
.tabs a svg { width: 24px; height: 24px; transition: transform .45s var(--spring); }
.tabs a[aria-current="page"] svg { transform: translateY(-1px) scale(1.1); fill: none; }

/* tarjetas de vidrio */
.widget, .nowc, .pend-hero { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--glass-brd); box-shadow: var(--glass-sh), inset 0 1px 0 var(--glass-hi); }
.nowc { box-shadow: inset 0 4px 0 var(--c), var(--glass-sh); }

.scrim { -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }

/* control segmentado con pulgar deslizante */
.seg { position: relative; gap: 0; }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); border-radius: 7px; background: var(--segsel); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); transform: translateX(calc(var(--i) * 100%)); transition: transform .5s var(--spring); }

/* pendientes */
.pend-hero { border-radius: 22px; padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.ring { width: 92px; height: 92px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }

.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700; }
.pend-hero h2 { font-size: 20px; font-weight: 700; } .pend-hero p { font-size: 15px; color: var(--label2); margin-top: 4px; line-height: 1.35; }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.lnks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.lnk { font-size: 13px; font-weight: 600; padding: 6px 11px; border-radius: 999px; background: color-mix(in srgb, var(--tint) 13%, transparent); color: var(--tint); }

.pend.done .lnks, .pend.done .chips2, .pend.done .x { display: none; }

@media (prefers-reduced-motion: no-preference) {
  /* se animan las tarjetas, no la sección que las contiene: un transform u opacidad en el contenedor apagaría el cristal (backdrop-filter) de sus hijos */
  .anim > *:not(.grp), .anim > .grp > * { animation: rise .6s var(--ease) backwards; animation-delay: calc(var(--d, 0) * 50ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
  .prog i { animation: grow 1.1s var(--ease) both .2s; transform-origin: left; }
  @keyframes grow { from { transform: scaleX(0); } }
  .ring .fg { animation: ring 1.3s var(--ease) both .25s; }
  @keyframes ring { from { stroke-dashoffset: 245; } }
  .r, .play, .fchip, .tile, .stp button, .themeb, .lnk, .spk, .chips a { transition: transform .3s var(--spring), background-color .2s, opacity .2s; }
  a.r:active, button.r:active, .play:active, .fchip:active, .stp button:active, .themeb:active, .lnk:active, .spk:active, .chips a:active, .tabs a:active svg { transform: scale(.95); }
  .chk { transition: background-color .25s, border-color .25s, transform .3s var(--spring); }
  .chk.pop { animation: pop .5s var(--spring); }
  @keyframes pop { 0% { transform: scale(.55); } 60% { transform: scale(1.22); } 100% { transform: scale(1); } }
  .chk svg { transition: opacity .2s; }
  .sun { animation: glow 4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--sun) 14%, transparent), 0 14px 44px color-mix(in srgb, var(--sun) 42%, transparent); transform: scale(1.03); } }
  .stl.now { animation: beat 2s ease-in-out infinite; }
  @keyframes beat { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--red) 22%, transparent); } }
  .sheet:not([hidden]) { animation: up .55s var(--spring); }
  .sheet.closing { animation: down .28s var(--ease) forwards; }
  .scrim.closing { animation: fadeout .28s ease forwards; }
  @keyframes down { to { transform: translateY(100%); } }
  @keyframes fadeout { to { opacity: 0; } }
  .hud:not([hidden]) { animation: hudin .35s var(--spring); }
  @keyframes hudin { from { opacity: 0; transform: translate(-50%, -50%) scale(.8); } }
  .nav-t { transition: opacity .25s, transform .35s var(--spring); transform: translateY(6px); }
  body.scrolled .nav-t { transform: none; }
  .nav { view-transition-name: navbar; } .tabs { view-transition-name: tabbar; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .45s; animation-timing-function: var(--ease); }
  :root[data-nav="push"]::view-transition-old(root) { animation-name: vt-out-l; }

  :root[data-nav="pop"]::view-transition-new(root) { animation-name: vt-in-l; }
  :root[data-nav="fade"]::view-transition-old(root) { animation-name: vt-fo; animation-duration: .2s; }
  :root[data-nav="fade"]::view-transition-new(root) { animation-name: vt-fi; }
  :root[data-nav="theme"]::view-transition-old(root) { animation: none; }
  :root[data-nav="theme"]::view-transition-new(root) { animation: vt-reveal .7s var(--ease); }
  :root[data-nav="theme"]::view-transition-group(navbar), :root[data-nav="theme"]::view-transition-group(tabbar) { animation-duration: .5s; }
  @keyframes vt-in-r { from { transform: translateX(35%); opacity: 0; } }
  @keyframes vt-out-l { to { transform: translateX(-18%); opacity: 0; } }
  @keyframes vt-in-l { from { transform: translateX(-18%); opacity: 0; } }
  @keyframes vt-out-r { to { transform: translateX(35%); opacity: 0; } }
  @keyframes vt-fi { from { opacity: 0; transform: scale(.985); } }
  @keyframes vt-fo { to { opacity: 0; } }
  @keyframes vt-reveal { from { clip-path: circle(0 at var(--rx, 90%) var(--ry, 30px)); } to { clip-path: circle(150vmax at var(--rx, 90%) var(--ry, 30px)); } }
}

/* ===== Superficies minimalistas sobre el fondo de Tokio ===== */
#bgfx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
:root { --card: rgba(255,255,255,.94); --surf: rgba(255,255,255,.82); --hair: rgba(22,23,28,.08); --lift: 0 1px 2px rgba(22,23,28,.06), 0 12px 32px -10px rgba(22,23,28,.18); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --card: rgba(26,28,38,.92); --surf: rgba(20,22,32,.80); --hair: rgba(255,255,255,.08); --lift: 0 1px 2px rgba(0,0,0,.3), 0 14px 36px -10px rgba(0,0,0,.6); } }
:root[data-theme="dark"] { --card: rgba(26,28,38,.92); --surf: rgba(20,22,32,.80); --hair: rgba(255,255,255,.08); --lift: 0 1px 2px rgba(0,0,0,.3), 0 14px 36px -10px rgba(0,0,0,.6); }
.list, .tile, .fchip { border: .5px solid var(--hair); }
.widget, .nowc, .pend-hero { background: var(--card); border: .5px solid var(--hair); box-shadow: var(--lift); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.nowc { box-shadow: inset 0 3px 0 var(--c), var(--lift); }
.tabs { background: var(--surf); border: .5px solid var(--hair); box-shadow: var(--lift); -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%); }
.tabs::before { display: none; }
.tab-ind { background: var(--fill); box-shadow: none; }
.tabs a[aria-current="page"] svg { transform: none; }
.themeb { background: var(--surf); border: .5px solid var(--hair); box-shadow: none; }
body.scrolled::before, body.scrolled .nav { background: var(--surf); }
body.scrolled .nav { border-bottom-color: var(--hair); }
.sheet { border-top: .5px solid var(--hair); }
.hud { background: var(--surf); border: .5px solid var(--hair); }
body::before, .nav { background: transparent; }

/* tarjetas deslizables de Hoy: un mazo de verdad.
   --p (0→1) es cuánto «entra» una tarjeta: mueve, escala y revela su información de arriba abajo;
   --d (0→1) la manda un lugar más atrás cuando regresas a la anterior. Ambas se animan con transición. */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --d { syntax: '<number>'; inherits: true; initial-value: 0; }
.deck { position: relative; isolation: isolate; padding-bottom: 16px; }
.deck > .nowc { --p: 1; position: relative; z-index: 3; touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; transform-origin: 50% 100%; }
.deck > .nowc.drag { cursor: grabbing; }
/* al tomarla se «levanta»: más sombra, para separarla de la que está debajo */
@media (prefers-reduced-motion: no-preference) { .deck > .nowc:not(.under):not(.under2):not(.prevc) { transition: box-shadow .25s ease; } }
.deck > .nowc.drag, .deck > .nowc.prevc { box-shadow: inset 0 4px 0 var(--c), inset 0 1px 0 var(--glass-hi), 0 26px 50px -18px rgba(0,0,0,.4), 0 6px 14px -6px rgba(0,0,0,.18); }
.deck > .nowc.under, .deck > .nowc.under2 { position: absolute; top: 0; left: 0; right: 0; bottom: 16px; overflow: hidden; pointer-events: none; }
.deck > .nowc.under { --p: 0; z-index: 2; transform: translateY(calc((1 - var(--p)) * 12px + var(--d) * 12px)) scale(calc(.94 + var(--p) * .06 - var(--d) * .06)); opacity: calc(1 - var(--d) * .45); }
.deck > .nowc.under2 { --p: 0; z-index: 1; transform: translateY(calc(24px - var(--p) * 12px)) scale(calc(.88 + var(--p) * .06)); opacity: calc(.5 + var(--p) * .5 - var(--d) * .5); }
.deck > .nowc.under2 > * { visibility: hidden; }
.deck > .nowc.prevc { --p: 0; position: absolute; top: 0; left: 0; right: 0; z-index: 4; visibility: hidden; pointer-events: none; }
/* la información entra en cascada: cada renglón aparece un poco después del anterior */
.deck > .nowc > * { --o: clamp(0, calc(var(--p) * 1.9 - var(--k, 0) * .11), 1); opacity: var(--o); transform: translateY(calc((1 - var(--o)) * 12px)); }
.nowc > :nth-child(2) { --k: 1; } .nowc > :nth-child(3) { --k: 2; } .nowc > :nth-child(4) { --k: 3; } .nowc > :nth-child(5) { --k: 4; }
.nowc > :nth-child(6) { --k: 5; } .nowc > :nth-child(7) { --k: 6; } .nowc > :nth-child(8) { --k: 7; } .nowc > :nth-child(9) { --k: 8; } .nowc > :nth-child(10) { --k: 9; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: -6px; }
.dots span { width: 7px; height: 7px; border-radius: 4px; background: var(--label3); transition: width .45s cubic-bezier(.22,1,.36,1), background-color .3s; }
.dots span.cur { background: color-mix(in srgb, var(--red) 55%, transparent); }
.dots span.on { width: 20px; background: var(--tint); }
@media (prefers-reduced-motion: no-preference) {
  /* saltos (volver a lo de ahora, abrir desde el plan): entra deslizando y revela su información */
  .deck > .nowc.in-next { animation: card-in-r .6s cubic-bezier(.22,1,.36,1) both, card-reveal .8s cubic-bezier(.22,1,.36,1) both; }
  .deck > .nowc.in-prev { animation: card-in-l .6s cubic-bezier(.22,1,.36,1) both, card-reveal .8s cubic-bezier(.22,1,.36,1) both; }
  @keyframes card-in-r { from { opacity: 0; transform: translateX(32px) scale(.97); } }
  @keyframes card-in-l { from { opacity: 0; transform: translateX(-32px) scale(.97); } }
  @keyframes card-reveal { from { --p: 0; } to { --p: 1; } }
  /* después de pasar de tarjeta, la nueva del fondo aparece suave */
  .deck.settle > .nowc.under2 { animation: deck-u2 .45s ease both; }
  @keyframes deck-u2 { from { opacity: 0; transform: translateY(30px) scale(.86); } }
}

/* hora de salir */
.leave { --lc: var(--tint); background: var(--card); border: .5px solid var(--hair); border-radius: 18px; padding: 14px 16px; display: grid; gap: 4px; box-shadow: inset 4px 0 0 var(--lc), var(--lift); }
.leave.soon { --lc: var(--orange); } .leave.now, .leave.late { --lc: var(--red); }
.lv-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--label2); }
.lv-k { flex: none; white-space: nowrap; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--lc); }
.lv-to { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-h { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.lv-s { font-size: 15px; color: var(--label2); }
.lv-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
@media (prefers-reduced-motion: no-preference) { .leave.now, .leave.late { animation: lvpulse 1.6s ease-in-out infinite; } @keyframes lvpulse { 50% { box-shadow: inset 4px 0 0 var(--lc), 0 0 0 6px color-mix(in srgb, var(--red) 18%, transparent); } } }

/* sellos */
.stamps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stamp { background: var(--card); border: .5px solid var(--hair); border-radius: 14px; padding: 12px 6px 10px; display: grid; justify-items: center; gap: 4px; text-align: center; cursor: pointer; color: var(--label); }
.stamp .ink { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed var(--label3); color: var(--label2); font-weight: 800; line-height: 1; margin-bottom: 4px; font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }
.stamp.on .ink { border: 4px double #D7332B; color: #D7332B; transform: rotate(-8deg); background: radial-gradient(circle, color-mix(in srgb, #D7332B 10%, transparent), transparent 70%); }
.stamp b { font-size: 13px; font-weight: 600; } .stamp small { font-size: 11px; color: var(--label2); line-height: 1.25; }
.stamp:not(.on) b { color: var(--label2); }
@media (prefers-reduced-motion: no-preference) { .stamp .ink.slam { animation: slam .5s cubic-bezier(.3,1.6,.5,1) both; } @keyframes slam { 0% { transform: scale(1.9) rotate(-28deg); opacity: 0; } 60% { transform: scale(.9) rotate(-6deg); opacity: 1; } 100% { transform: rotate(-8deg); } } .stamp { transition: transform .3s var(--spring); } .stamp:active { transform: scale(.95); } }

/* chat */
.chat { display: grid; gap: 10px; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 18px; font-size: 16px; line-height: 1.4; word-wrap: break-word; }
.msg.user { justify-self: end; background: var(--tint); color: var(--on); border-bottom-right-radius: 6px; }
.msg.assistant { justify-self: start; background: var(--card); border: .5px solid var(--hair); border-bottom-left-radius: 6px; }
.typing { display: inline-flex; gap: 4px; } .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--label3); animation: typing 1.2s infinite; } .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes typing { 30% { transform: translateY(-4px); background: var(--label2); } }
.qchips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; } .qchips::-webkit-scrollbar { display: none; }
.qchips .q { white-space: nowrap; border: 0; cursor: pointer; } .qchips .q::after { content: none; }
.composer { display: flex; gap: 8px; align-items: flex-end; background: var(--card); border: .5px solid var(--hair); border-radius: 22px; padding: 6px 6px 6px 14px; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 0; background: none; font: inherit; font-size: 16px; line-height: 1.35; padding: 7px 0; color: var(--label); max-height: 140px; outline: none; }
.send { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--tint); color: var(--on); font-size: 18px; font-weight: 700; cursor: pointer; }
.send.stop { background: var(--label2); font-size: 12px; }

/* barras más transparentes */
:root { --surf: rgba(255,255,255,.82); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surf: rgba(20,22,32,.80); } }
:root[data-theme="dark"] { --surf: rgba(20,22,32,.80); }
.tabs, .themeb, body.scrolled .nav, body.scrolled::before { -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%); }

/* documentos */
.r.subh { min-height: 0; padding: 10px 16px 4px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--label2); }
.r.subh + .r::before { display: none; }
.r.upl { cursor: pointer; }
.r.upl .t { color: var(--tint); }
.r.danger .t { color: var(--red); }
.docview { display: grid; gap: 10px; background: var(--card); border-radius: 14px; padding: 10px; min-height: 120px; }
.docview canvas, .docview img { width: 100%; height: auto; border-radius: 6px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15); }

.r.upl { position: relative; }
.filehit { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; font-size: 100px; }

.docbar { display: flex; flex-wrap: wrap; gap: 8px; }
.docbar .lnk { border: 0; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; }
.docbar .lnk::after { content: none; }
.docbar a.lnk::after { content: " ↗"; }
.docbar .pick { position: relative; overflow: hidden; }
.docbar .del { color: var(--red); background: color-mix(in srgb, var(--red) 13%, transparent); }
.docbar .del.armed { background: var(--red); color: var(--on); }

/* mascotas */
.petcard { --pc: var(--tint); display: flex; gap: 14px; align-items: center; background: var(--card); border: .5px solid var(--hair); border-radius: 22px; padding: 12px 16px; box-shadow: inset 0 -3px 0 color-mix(in srgb, var(--pc) 70%, transparent), var(--lift); }
.petcard .pn { font-size: 22px; font-weight: 700; } .petcard .pw { font-size: 14px; color: var(--label2); margin-bottom: 6px; }
.petcard .lnk { border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; } .petcard .lnk::after { content: none; }
.pet { flex: none; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--pc) 28%, transparent), transparent 70%); }
.petsvg { width: 100%; height: 100%; overflow: visible; }
.ava { --pc: var(--tint); flex: none; width: 34px; height: 34px; border-radius: 50%; background: color-mix(in srgb, var(--pc) 22%, var(--card)); display: grid; place-items: center; padding: 3px; }
.mrow { display: flex; gap: 8px; align-items: flex-end; justify-self: start; max-width: 92%; }
.mrow .msg { max-width: none; }
.petgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.petopt { --pc: var(--tint); background: var(--card); border: 1.5px solid var(--hair); border-radius: 18px; padding: 14px 10px; display: grid; justify-items: center; gap: 4px; cursor: pointer; color: var(--label); text-align: center; }
.petopt.on { border-color: var(--pc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 25%, transparent); }
.petopt b { font-size: 16px; } .petopt small { font-size: 12px; color: var(--label2); }
.gf .tbtn { font-size: 13px; padding: 0; }
@media (prefers-reduced-motion: no-preference) {
  .pet .petsvg { animation: petbob 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
  .pet.think .petsvg { animation: petthink .7s ease-in-out infinite; }
  .pet.hello .petsvg { animation: pethello .7s cubic-bezier(.34,1.6,.64,1); }
  .petsvg .eye { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
  .petsvg .glow { animation: glowp 1.6s ease-in-out infinite; }
  .petopt { transition: transform .3s var(--spring); } .petopt:active { transform: scale(.95); }
  .petopt:hover .petsvg { animation: petthink .7s ease-in-out infinite; }
  @keyframes petbob { 50% { transform: translateY(-4px) rotate(-2deg); } }
  @keyframes petthink { 25% { transform: rotate(-6deg) translateY(-2px); } 75% { transform: rotate(6deg) translateY(-2px); } }
  @keyframes pethello { 0% { transform: scale(.4) rotate(-20deg); } 100% { transform: none; } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes glowp { 50% { opacity: .4; } }
}

/* sellos en familia */
.stamp .ink { position: relative; }
.stamp.on .ink { border: 0; color: inherit; background: none; transform: rotate(-8deg); }
.stamp.on .ink::before { content: ""; position: absolute; inset: 0; border-radius: 50%; padding: 4px; background: var(--ring); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.stamp.on .ink::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .35; }
.stamp .kj { position: relative; z-index: 1; font-weight: 800; }
.stamp .who { display: flex; gap: 3px; min-height: 16px; margin-top: 2px; }
.stamp .who i { width: 16px; height: 16px; border-radius: 50%; color: #fff; font-style: normal; font-size: 9px; font-weight: 800; display: grid; place-items: center; }
.per { display: flex; flex-wrap: wrap; gap: 6px 12px; } .per span { display: inline-flex; align-items: center; gap: 5px; } .per i { width: 10px; height: 10px; border-radius: 50%; }
.mepick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mepick button { --fc: var(--tint); display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 6px; border-radius: 14px; border: 1.5px solid var(--hair); background: var(--card); font-size: 16px; font-weight: 600; cursor: pointer; color: var(--label); }
.mepick button span { width: 14px; height: 14px; border-radius: 50%; background: var(--fc); }
.mepick button[aria-pressed="true"] { border-color: var(--fc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fc) 25%, transparent); }
.danger-btn { background: var(--red); color: var(--on); }

/* mascota asistente: estados */
.pet { position: relative; }
.pet.sm { width: 48px; height: 48px; }
.pet .tb { position: absolute; top: -10px; right: -14px; display: none; gap: 3px; padding: 6px 8px; border-radius: 14px; background: var(--card); border: .5px solid var(--hair); box-shadow: var(--lift); z-index: 2; }
.pet.sm .tb { top: -16px; right: -18px; padding: 4px 6px; }
.pet .tb i { width: 6px; height: 6px; border-radius: 50%; background: var(--pc); }
.pet.think .tb { display: flex; }
.pet.talk::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--pc); pointer-events: none; }
.dock { position: sticky; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; gap: 8px; align-items: flex-end; }
.dock .composer { flex: 1; min-width: 0; box-shadow: var(--lift); }
@media (prefers-reduced-motion: no-preference) {
  .pet .tb i { animation: typing 1.1s infinite; } .pet .tb i:nth-child(2) { animation-delay: .15s; } .pet .tb i:nth-child(3) { animation-delay: .3s; }
  .pet.think .petsvg { animation: petthink 1.1s ease-in-out infinite; }
  .pet.talk .petsvg { animation: pettalk .26s ease-in-out infinite alternate; }
  .pet.talk::after { animation: petring 1s ease-out infinite; }
  .pet.happy .petsvg { animation: pethop .55s cubic-bezier(.34,1.6,.64,1) 2; }
  .live-ava .petsvg { animation: pettalk .26s ease-in-out infinite alternate; }
  @keyframes pettalk { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(-3px) scale(1.03, .95); } }
  @keyframes petring { from { transform: scale(.9); opacity: .8; } to { transform: scale(1.4); opacity: 0; } }
  @keyframes pethop { 0% { transform: translateY(0); } 40% { transform: translateY(-12px) rotate(-6deg); } 100% { transform: translateY(0); } }
}

/* animaciones propias de los Pokémon */
.petsvg .ear, .petsvg .flame, .petsvg .cheek, .petsvg .zz text { transform-box: fill-box; }
.petsvg .ear-l { transform-origin: 85% 100%; } .petsvg .ear-r { transform-origin: 15% 100%; }
.petsvg .flame { transform-origin: 50% 100%; }
.ava .zz { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .pet .petsvg .ear-l { animation: earl 5.5s ease-in-out infinite; }
  .pet .petsvg .ear-r { animation: earr 5.5s ease-in-out infinite .4s; }
  .pet.talk .petsvg .ear-l, .pet.talk .petsvg .ear-r { animation-duration: .9s; }
  .pet.talk .petsvg .cheek { animation: spark .22s ease-in-out infinite alternate; }
  .petsvg .flame { animation: flick .45s ease-in-out infinite alternate; }
  .pet .petsvg .zz text { animation: zzz 2.8s ease-in-out infinite; } .pet .petsvg .zz text + text { animation-delay: 1.4s; }
  @keyframes earl { 0%, 84%, 100% { transform: none; } 88% { transform: rotate(-10deg); } 93% { transform: rotate(5deg); } }
  @keyframes earr { 0%, 84%, 100% { transform: none; } 88% { transform: rotate(10deg); } 93% { transform: rotate(-5deg); } }
  @keyframes spark { from { filter: none; } to { filter: brightness(1.35) drop-shadow(0 0 2.5px #FFE14A); } }
  @keyframes flick { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(1.08, .9) rotate(4deg); } }
  @keyframes zzz { 0% { opacity: 0; transform: translate(0, 4px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(5px, -9px); } }
}

/* borde tipo sticker para que las siluetas oscuras no se pierdan en modo oscuro */
:root { --pet-edge: rgba(255,255,255,0); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pet-edge: rgba(255,255,255,.6); } }
:root[data-theme="dark"] { --pet-edge: rgba(255,255,255,.6); }
.petsvg { filter: drop-shadow(0 0 .7px var(--pet-edge)) drop-shadow(0 0 .7px var(--pet-edge)); }

/* apariencia y clima */
.apl { font-size: 13px; color: var(--label2); padding: 4px 16px 0; }
.gh span + span { text-transform: none; }
.wxrow { flex-wrap: wrap; }
.wxb { display: flex; gap: 6px; }
.wxb button { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--hair); background: var(--fill); color: var(--label2); display: grid; place-items: center; cursor: pointer; padding: 0; }
.wxb button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wxb button[aria-pressed="true"] { background: var(--tint); border-color: var(--tint); color: var(--on); }

.cchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 4px; }
.cchips button { flex: none; border: 1px solid var(--hair); background: var(--fill); color: var(--label); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 500; cursor: pointer; }
.cchips button[aria-pressed="true"] { background: var(--tint); border-color: var(--tint); color: var(--on); font-weight: 600; }

/* Washi & Sumi: legibilidad AAA sobre los fondos de acuarela */
.ico { --tint: #2F6FC4; --red: #D9452B; --orange: #B86A00; --green: #2E8A4E; --yellow: #B07A00; --indigo: #5458D0; --teal: #16858F; --purple: #8256C4; --pink: #D1356A; --gray: #7A7B84; }
.tabs, .widget, .nowc, .pend-hero, .themeb, .hud { -webkit-backdrop-filter: blur(24px) saturate(140%); backdrop-filter: blur(24px) saturate(140%); }
.tabs { border: .5px solid var(--hair); }
.tabs a { font-size: 11px; font-weight: 600; color: var(--gray); }
.tabs a[aria-current="page"] { color: var(--tint); }
.gh, .lt .cap { font-weight: 600; letter-spacing: .04em; color: var(--label-h); }
/* texto que va directo sobre el fondo: halo de papel (o de noche) que reserva su espacio, como en la acuarela */
.nav-r { color: var(--label-h); }
.lt, .nav-l a, .nav-r, .nav-t { text-shadow: 0 0 1px var(--halo), 0 0 3px var(--halo), 0 0 8px var(--halo), 0 0 16px var(--halo); }
/* encabezados, notas y etiquetas sobre el fondo: una etiqueta de papel esmerilado, así ningún monumento les quita contraste */
.gh { padding: 0 8px; }
.gh > span, .gf, .apl { background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(14px) saturate(120%); backdrop-filter: blur(14px) saturate(120%); border-radius: 8px; }
.gh > span { padding: 2px 8px; }
.gf { margin: 0 8px; padding: 6px 8px; }
.gf:empty { display: none; }
/* todo se acota al ancho de la pantalla: nada empuja el contenido hacia los lados */
body { overflow-x: clip; }
main, .grp { grid-template-columns: minmax(0, 1fr); }
.gh { flex-wrap: wrap; row-gap: 4px; }
.gh > span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.seg { grid-auto-columns: minmax(0, 1fr); }
.seg button { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 2px; padding-right: 2px; }
.tabs a { overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 400px) { .tabs a { font-size: 10px; letter-spacing: -.015em; } }
@media (max-width: 340px) { .tabs a { font-size: 9.5px; letter-spacing: -.03em; } .tabs a svg { width: 22px; height: 22px; } }
/* cristal esmerilado: tarjetas y barras translúcidas con desenfoque, borde de luz y brillo arriba */
/* el cristal va teñido: en claro aclara lo que tiene detrás y en oscuro lo oscurece, así el texto conserva su contraste */
:root { --card: rgba(255,255,255,.58); --glass: rgba(255,255,255,.7); --surf: rgba(255,255,255,.52); --glass-line: rgba(255,255,255,.6); --glass-hi: rgba(255,255,255,.85); --glass-fx: blur(24px) saturate(190%) brightness(1.45); }
:root[data-theme="dark"] { --card: rgba(24,26,36,.5); --glass: rgba(24,26,36,.6); --surf: rgba(18,20,30,.5); --glass-line: rgba(255,255,255,.1); --glass-hi: rgba(255,255,255,.08); --glass-fx: blur(26px) saturate(120%) brightness(.4); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --card: rgba(24,26,36,.5); --glass: rgba(24,26,36,.6); --surf: rgba(18,20,30,.5); --glass-line: rgba(255,255,255,.1); --glass-hi: rgba(255,255,255,.08); --glass-fx: blur(26px) saturate(120%) brightness(.4); } }
.list, .tile, .fchip, .widget, .nowc, .pend-hero, .leave, .stamp, .show, .petcard, .petopt, .composer, .msg.assistant, .docview, .ghost {
  -webkit-backdrop-filter: var(--glass-fx); backdrop-filter: var(--glass-fx);
  border: 1px solid var(--glass-line); box-shadow: inset 0 1px 0 var(--glass-hi), var(--lift); }
.nowc { box-shadow: inset 0 4px 0 var(--c), inset 0 1px 0 var(--glass-hi), var(--lift); }
.tabs, .themeb, .hud, body.scrolled::before, body.scrolled .nav { -webkit-backdrop-filter: var(--glass-fx); backdrop-filter: var(--glass-fx); }
.tabs { border: 1px solid var(--glass-line); box-shadow: inset 0 1px 0 var(--glass-hi), var(--lift); }
/* ---------- barras de cristal ----------
   Arriba: desenfoque progresivo (fuerte arriba, se desvanece hacia abajo, sin borde duro).
   Abajo: cápsula flotante de cristal transparente con reflejo, borde de luz y sombra suave;
   la pestaña activa es una píldora de cristal teñida. El contenido que pasa por debajo se
   desenfoca cerca del borde para que las etiquetas siempre se lean. */
:root { --bar-tint: rgba(250,249,246,.4); --bar-rim: rgba(255,255,255,.75); --bar-hi: rgba(255,255,255,.95); --bar-lo: rgba(22,23,28,.06); --bar-sheen: rgba(255,255,255,.4); --bar-pill: rgba(255,255,255,.78); --bar-halo: rgba(255,255,255,.75); --bar-br: 1.12; --edge-tint: rgba(247,245,240,.72); }
:root[data-theme="dark"] { --bar-tint: rgba(16,18,26,.46); --bar-rim: rgba(255,255,255,.16); --bar-hi: rgba(255,255,255,.16); --bar-lo: rgba(0,0,0,.3); --bar-sheen: rgba(255,255,255,.09); --bar-pill: rgba(6,8,14,.35); --bar-halo: rgba(0,0,0,.55); --bar-br: .6; --edge-tint: rgba(14,16,24,.72); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bar-tint: rgba(16,18,26,.46); --bar-rim: rgba(255,255,255,.16); --bar-hi: rgba(255,255,255,.16); --bar-lo: rgba(0,0,0,.3); --bar-sheen: rgba(255,255,255,.09); --bar-pill: rgba(6,8,14,.35); --bar-halo: rgba(0,0,0,.55); --bar-br: .6; --edge-tint: rgba(14,16,24,.72); } }
/* con sol bajo brillante detrás (amanecer y golden hour), el cristal oscuro se tiñe más para que el texto no pierda contraste */
:root[data-theme="dark"][data-phase="sunset"], :root[data-theme="dark"][data-phase="dawn"] { --card: rgba(24,26,36,.58); --glass: rgba(24,26,36,.7); --glass-fx: blur(26px) saturate(120%) brightness(.3); }
:root[data-theme="light"][data-phase="sunset"], :root[data-theme="light"][data-phase="dawn"] { --glass-fx: blur(24px) saturate(140%) brightness(1.55); --tint: #153E76; }
@media (prefers-color-scheme: light) { :root:not([data-theme])[data-phase="sunset"], :root:not([data-theme])[data-phase="dawn"] { --glass-fx: blur(24px) saturate(140%) brightness(1.55); --tint: #153E76; } }
@media (prefers-color-scheme: dark) { :root:not([data-theme])[data-phase="sunset"], :root:not([data-theme])[data-phase="dawn"] { --card: rgba(24,26,36,.58); --glass: rgba(24,26,36,.7); --glass-fx: blur(26px) saturate(120%) brightness(.3); } }
:root[data-sky="rain"] { --bar-tint: rgba(250,249,246,.55); }
:root[data-theme="dark"][data-sky="rain"] { --bar-tint: rgba(16,18,26,.55); }
body::before { left: 0; right: 0; top: 0; bottom: auto; height: calc(env(safe-area-inset-top, 0px) + 88px); z-index: 19; pointer-events: none; opacity: 0; transition: opacity .35s ease;
  background: linear-gradient(180deg, var(--edge-tint) 0%, color-mix(in srgb, var(--edge-tint) 70%, transparent) 55%, transparent 100%);
  -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 52%, transparent 100%); mask-image: linear-gradient(180deg, #000 0%, #000 52%, transparent 100%); }
body.scrolled::before { opacity: 1; background: linear-gradient(180deg, var(--edge-tint) 0%, color-mix(in srgb, var(--edge-tint) 70%, transparent) 55%, transparent 100%); -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%); }
.nav, body.scrolled .nav { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; border-bottom-color: transparent; }
.edge-b { position: fixed; left: 0; right: 0; bottom: 0; height: calc(env(safe-area-inset-bottom, 0px) + 74px); z-index: 19; pointer-events: none;
  background: linear-gradient(0deg, color-mix(in srgb, var(--edge-tint) 75%, transparent) 0%, transparent 100%);
  -webkit-backdrop-filter: blur(10px) saturate(160%); backdrop-filter: blur(10px) saturate(160%);
  -webkit-mask-image: linear-gradient(0deg, #000 0%, #000 40%, transparent 100%); mask-image: linear-gradient(0deg, #000 0%, #000 40%, transparent 100%); }
.tabs { background: var(--bar-tint); border: 0;
  -webkit-backdrop-filter: blur(18px) saturate(190%) brightness(var(--bar-br)); backdrop-filter: blur(18px) saturate(190%) brightness(var(--bar-br));
  box-shadow: inset 0 0 0 .5px var(--bar-rim), inset 0 1px 0 var(--bar-hi), inset 0 -1px 0 var(--bar-lo), 0 16px 36px -14px rgba(0,0,0,.42), 0 3px 10px -3px rgba(0,0,0,.12); }
.tabs::before { display: block; content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, var(--bar-sheen), transparent 52%), radial-gradient(90% 120% at 50% -30%, var(--bar-sheen), transparent 62%); }
.tab-ind { background: color-mix(in srgb, var(--tint) 11%, var(--bar-pill));
  box-shadow: inset 0 0 0 .5px color-mix(in srgb, var(--tint) 30%, transparent), inset 0 1px 0 var(--bar-hi), 0 2px 6px -2px rgba(0,0,0,.18); }
.tabs a { text-shadow: 0 0 2px var(--bar-halo), 0 0 8px var(--bar-halo); }
.tabs a svg { filter: drop-shadow(0 0 3px var(--bar-halo)); }
.themeb { background: var(--bar-tint); border: 0;
  -webkit-backdrop-filter: blur(14px) saturate(190%) brightness(var(--bar-br)); backdrop-filter: blur(14px) saturate(190%) brightness(var(--bar-br));
  box-shadow: inset 0 0 0 .5px var(--bar-rim), inset 0 1px 0 var(--bar-hi), 0 6px 16px -6px rgba(0,0,0,.3); }
/* capa de legibilidad dinámica sobre el fondo: protege la zona del título según el clima y la luz */
body::after { content: ""; position: fixed; left: 0; right: 0; top: 0; height: 32vh; z-index: -1; pointer-events: none; opacity: var(--scrim, 0); transition: opacity .8s ease;
  background: linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 55%, transparent) 50%, transparent 100%); }
:root[data-sky="rain"] { --glass: rgba(255,255,255,.78); --card: rgba(255,255,255,.64); --surf: rgba(255,255,255,.72); }
:root[data-theme="dark"][data-sky="rain"] { --glass: rgba(24,26,36,.76); --card: rgba(26,28,38,.62); --surf: rgba(20,22,32,.7); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"])[data-sky="rain"] { --glass: rgba(24,26,36,.76); --card: rgba(26,28,38,.62); --surf: rgba(20,22,32,.7); } }
.apl { width: fit-content; margin: 4px 8px 0; padding: 2px 8px; }
/* chips, botones y controles con fondo opaco: su contraste no depende de lo que pase detrás */
.pill:not(.now), .lnk, .play.alt, .stl.next, .chips a { background: color-mix(in srgb, currentColor 9%, var(--chip)); }
.cchips button:not([aria-pressed="true"]), .wxb button:not([aria-pressed="true"]), .stl:not(.now):not(.next) { background: color-mix(in srgb, var(--label) 7%, var(--chip)); }
.badge { color: var(--bt, var(--on)); } .badge svg { stroke: var(--bt, #fff); }
.seg { background: color-mix(in srgb, var(--label) 7%, var(--chip)); }
.stp button { background: color-mix(in srgb, var(--label) 6%, var(--chip)); }
/* sección de sellos por día y el gran sello */
.gh.sub { margin-top: 14px; }

function viewItin() {
  const today = jstNow().ymd;
  const total = DAYS.reduce((a, d) => a + d.items.length, 0);
  const done = DAYS.reduce((a, d) => a + dayProgress(d)[0], 0);
  const runs = [];
  DAYS.forEach(d => { const last = runs[runs.length - 1]; if (last && last.city === d.city) last.days.push(d); else runs.push({ city: d.city, days: [d] }); });
  const body = `<section class="grp"><h2 class="gh"><span>${done} de ${total} actividades</span><span>${Math.round(done / total * 100)}%</span></h2><div class="prog" style="margin:0 16px"><i style="width:${done / total * 100}%"></i></div></section>
  ${runs.map(r => grp(`${CITY[r.city].n} <span lang="ja">${CITY[r.city].jp}</span>`, r.days.map(d => {
      const [a, b] = dayProgress(d);
      const tr = d.date === today ? '<span class="pill now">Hoy</span>' : d.items.some(it => it.k === 'res') ? '<span class="pill tint">Reserva</span>' : '';
      return row({ href: '#dia' + d.n, cls: 'lr', lead: roundel(d, a === b ? 'done' : ''), t: esc(d.title), s: `${fdate(d.date, true)} · ${a} de ${b}`, tr, chev: 1 });
    }).join(''), null, `${fdate(r.days[0].date)}${r.days.length > 1 ? ' – ' + fdate(r.days[r.days.length - 1].date) : ''}`)).join('')}`;
  return { title: 'Itinerario', cap: '20 nov – 9 dic 2026', body };
}

function viewDay(n, opts = {}) {
  const day = DAYS[n - 1], base = BASES[day.base], c = checks(), p = ymdParts(day.date);
  const [done, tot] = dayProgress(day);
  const seg = mem.seg[n] || 'plan';
  let nowIdx = -1;
  if (opts.today) {
    day.items.forEach((it, i) => { if (it.t <= opts.hm && opts.hm < it.e) nowIdx = i; });
    if (nowIdx < 0) nowIdx = day.items.findIndex(it => it.t > opts.hm);
  }
  let content = '';
  if (seg === 'plan') {
    content = grp('Plan por hora', day.items.map((it, i) => {
      const id = 'd' + n + '-' + i, on = !!c[id];
      const tags = (i === nowIdx ? '<span class="pill now">Ahora</span>' : '') + (it.k === 'res' ? '<span class="pill ok">Reserva</span>' : '') + (it.x ? '<span class="pill tint">Opcional</span>' : '') + (it.s ? '<span class="pill">Sugerencia</span>' : '');
      return `<div class="r li it${on ? ' done' : ''}${i === nowIdx ? ' now' : ''}">${checkBtn(id, it.h)}<div class="m">
        <div class="when">${it.t} – ${it.e}${tags}</div><div class="t">${esc(it.h)}</div>
        ${it.d ? `<div class="d">${esc(it.d)}</div>` : ''}${it.f ? `<div class="food"><b>Comer:</b> ${esc(it.f)}</div>` : ''}${it.r ? `<div class="rec">${esc(it.r)}</div>` : ''}
        ${(it.p || []).length ? `<div class="chips">${it.p.map(k => `<a href="${gmSearch(k)}" target="_blank" rel="noopener">${esc(place(k).n)}</a>`).join('')}</div>` : ''}</div></div>`;
    }).join(''), null, `${done} de ${tot}`) +
    extrasHtml(day) +
    daySetHtml(day, 'Sellos e imanes del día') +
    grp('Alojamiento', row({ tag: 'button', cls: 'ld', lead: ico(I.bed, cityVar(day.city)), t: esc(base.n), s: esc(base.in + ' → ' + base.out), attrs: `data-base="${day.base}"`, chev: 1 }) +
      row({ tag: 'button', cls: 'ld', lead: ico(I.car, 'var(--orange)'), t: 'Mostrar dirección al taxista', attrs: `data-taxi="${day.base}"`, chev: 1 }));
  } else if (seg === 'rutas') {
    content = day.legs.map(legGroup).join('');
  } else if (seg === 'paradas') {
    const { pts } = dayMapData(day);
    content = grp('Paradas del día', pts.map(pt => row({ href: pt.href, ext: 1, cls: 'ld', lead: `<span class="dotn${pt.base ? ' base' : ''}" style="--c:${pt.color}">${pt.label}</span>`, t: esc(pt.n), s: pt.base ? esc(BASES[pt.base].addr) : '' })).join('') +
        dayRouteRow(day));
  } else {
    content = grp('Tips del día', tipRows((day.tips || []).map(esc)), null) +
      grp('Clima', row({ t: 'Máxima / mínima', tr: `${day.wx[0]}° / ${day.wx[1]}°` }) + row({ t: 'Atardecer', tr: '≈ ' + day.sun }), null, 'Promedio de temporada');
  }
  const nav = opts.today ? '' : grp(null,
    (n > 1 ? row({ href: '#dia' + (n - 1), t: `Día ${n - 1}`, s: esc(DAYS[n - 2].title), chev: 1, cls: 'link' }) : '') +
    (n < DAYS.length ? row({ href: '#dia' + (n + 1), t: `Día ${n + 1}`, s: esc(DAYS[n].title), chev: 1, cls: 'link' }) : ''));
  const body = `
  ${opts.preview ? grp(null, row({ t: `Vista previa del Día ${n} a las ${opts.hm}` }) + row({ tag: 'button', cls: 'center', t: 'Salir de la vista previa', attrs: 'data-preview-off' })) : ''}
  <div class="tiles">
    <div class="tile"><span>Duermen en</span><b>${esc(base.n)}</b></div>
    <div class="tile"><span>Clima</span><b>${day.wx[0]}° / ${day.wx[1]}°</b></div>
    <div class="tile"><span>Atardecer</span><b>≈ ${day.sun}</b></div>
    <div class="tile"><span>Avance · ${done} de ${tot}</span><div class="prog"><i style="width:${done / tot * 100}%"></i></div></div>
  </div>
  ${dayRouteRow(day) ? grp(null, dayRouteRow(day)) : ''}
  ${segHtml('day' + n, [['plan', 'Plan'], ['rutas', 'Rutas'], ['paradas', 'Paradas'], ['tips', 'Tips']].map(([k, l]) => [n + ':' + k, l]), n + ':' + seg, 'data-seg', 'Sección del día')}
  ${content}
  ${nav}`;
  const after = null;
  return { title: esc(day.title), cap: `${opts.today ? 'Hoy · ' : ''}Día ${n} · ${DOW[p.w]} ${p.d} ${MES[p.m - 1]} · ${CITY[day.city].n}`, lead: roundel(day, 'lg'), back: opts.today ? null : { href: '#itinerario', label: 'Itinerario' }, body, after };
}

function legGroup(l) {
  const a = place(l.o), b = place(l.d);
  const main = l.steps.filter(s => !s.alt);
  const total = main.reduce((x, s) => x + (s.min || 0), 0);
  const allWalk = main.every(s => s.m === 'walk');
  const rows = l.steps.map(s => {
    const ln = s.m === 'walk' ? null : LINES[s.line];
    let lead;
    if (!ln) lead = `<span class="badge walk">${I.walk}</span>`;
    else if (s.line === 'taxi') lead = `<span class="badge" style="${badgeStyle(ln[1])}">${I.car}</span>`;
    else if (s.line === 'bus') lead = `<span class="badge" style="${badgeStyle(ln[1])}">${I.bus}</span>`;
    else lead = `<span class="badge" style="${badgeStyle(ln[1])}">${esc(ln[0])}</span>`;
    return row({ cls: 'step' + (s.alt ? ' alt' : ''), lead, pre: s.alt ? '<span class="alt-lbl">o bien</span>' : '', t: (ln ? '' : 'A pie · ') + esc(s.t), x: s.n ? esc(s.n) : '', tr: s.min ? `<span class="min">${s.min} min</span>` : '' });
  }).join('') + row({ href: gmRoute(l.o, l.d, allWalk ? 'walking' : 'transit'), ext: 1, cls: 'link', t: 'Ruta en Google Maps' });
  return grp(`${esc(a.n)} → ${esc(b.n)}`, rows, l.n ? esc(l.n) : null, `≈ ${total} min`);
}

function segHtml(key, opts, cur, attr, label) {
  const idx = Math.max(0, opts.findIndex(o => o[0] === cur));
  const from = mem.segFrom && mem.segFrom.key === key ? mem.segFrom.i : idx;
  return `<div class="seg" role="group" aria-label="${label}" data-key="${key}" data-to="${idx}" style="--n:${opts.length};--i:${from}"><span class="thumb" aria-hidden="true"></span>${opts.map(([v, l]) => `<button type="button" ${attr}="${v}" aria-pressed="${v === cur}">${l}</button>`).join('')}</div>`;
}
function viewPend() {
  const today = jstNow().ymd, c = checks();
  const RANK = ['t-toshi', 't-bus1', 't-bus2', 't-fuji', 't-kyoto', 't-tour', 't-kanazawa', 't-hida', 't-sky', 't-vjw', 't-esim', 't-osakain', 't-shibuya', 't-steak'];
  const open = TODO.filter(t => !c[t.id]).sort((a, b) => RANK.indexOf(a.id) - RANK.indexOf(b.id));
  const done = TODO.filter(t => c[t.id]);
  const pct = done.length / TODO.length;
  const nextSale = TODO.filter(t => !c[t.id] && t.opens && t.opens >= today).sort((a, b) => a.opens.localeCompare(b.opens))[0];
  const pendRow = t => {
    const on = !!c[t.id];
    const chips = (t.date ? `<span class="pill">Viaje: ${fdate(t.date, true)}</span>` : '') + (t.when ? `<span class="pill">${esc(t.when)}</span>` : '') +
      (t.opens ? (t.opens > today ? `<span class="pill warn">Abre ${fdate(t.opens)} · ${inDays(daysBetween(today, t.opens))}</span>` : '<span class="pill ok">Ya a la venta</span>') : '');
    return `<div class="r li pend${on ? ' done' : ''}">${checkBtn(t.id, t.t)}<div class="m">${on ? '' : `<div class="why p${t.pr}">${esc(t.why)}</div>`}<div class="t">${esc(t.t)}</div><div class="s">${esc(t.s)}</div>
      <div class="chips2">${chips}</div>${t.note ? `<div class="x">ⓘ ${esc(t.note)}${t.on ? '' : ''}</div>` : ''}${t.on && t.opens > today ? `<div class="x">La venta abre ${esc(t.on)}.</div>` : ''}
      <div class="lnks">${t.links.map(([l, u]) => `<a class="lnk" href="${u}" target="_blank" rel="noopener">${esc(l)}</a>`).join('')}</div></div></div>`;
  };
  const body = `
  <section class="pend-hero"><div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="39"/><circle class="fg" cx="50" cy="50" r="39" style="stroke-dashoffset:${245 * (1 - pct)}"/></svg><b>${Math.round(pct * 100)}%</b></div>
    <div><h2>${done.length} de ${TODO.length} listos</h2>${open[0] ? `<p>Lo más urgente: <b>${esc(open[0].t)}</b>.</p>` : ''}<p>${nextSale ? `Próxima venta: <b>${esc(nextSale.t)}</b>, ${fdate(nextSale.opens, true)} (${inDays(daysBetween(today, nextSale.opens))}).` : open.length ? 'Todo lo pendiente ya está a la venta.' : '¡Todo reservado!'}</p></div></section>
  ${[[1, 'Prioridad alta · hacer ya'], [2, 'Prioridad media · este mes'], [3, 'Prioridad baja · opcional']].map(([pr, h]) => { const l = open.filter(t => t.pr === pr); return l.length ? grp(h, l.map(pendRow).join(''), null, `${l.length}`) : ''; }).join('')}
  ${done.length ? grp('Listo', done.map(pendRow).join(''), null, `${done.length}`) : ''}`;
  return { title: 'Pendientes', cap: 'Reservas y compras antes del viaje', body };
}

mem.stampsDb = null; mem.stampPop = new Set();
const stampData = id => (mem.stampsDb ? mem.stampsDb[id] : store.get('stampsLocal', {})[id]) || {};

const meKey = () => { const m = store.get('me', null); return FAMILY.some(f => f[0] === m) ? m : null; };
function startStamps(db) {

  db.collection('stamps').onSnapshot(snap => {
    const next = {};
    snap.docs.filter(d => d.exists).forEach(d => { next[d.id] = d.data() || {}; });
    if (mem.stampsDb) STAMPS.forEach(s => { const a = Object.keys(mem.stampsDb[s.id] || {}).length, b = Object.keys(next[s.id] || {}).length; if (b > a) mem.stampPop.add(s.id); });
    mem.stampsDb = next;
    const h = location.hash || '#hoy';
    if ((h === '#guia-sellos' || h === '#hoy' || h.startsWith('#dia')) && $('#sheet').hidden && !mem.stampFx) rerender();
  }, () => {});
}
async function writeStamp(id, data) {
  if (mem.db) {
    const ref = mem.db.doc('stamps/' + id);
    if (Object.keys(data).length) await ref.set(data); else await ref.delete();
  } else { const all = store.get('stampsLocal', {}); if (Object.keys(data).length) all[id] = data; else delete all[id]; store.set('stampsLocal', all); }
}
function stampHtml(s) {

  const ring = cols.length ? `conic-gradient(${cols.map((c, i) => `${c} ${i / cols.length * 100}% ${(i + 1) / cols.length * 100}%`).join(',')})` : '';

  return `<button class="stamp${marks.length ? ' on' : ''}" type="button" data-stamp="${s.id}" aria-label="${esc(s.t)}: ${esc(s.r)}${marks.length ? '. Marcado por ' + marks.map(famName).join(', ') : ''}">
    <span class="ink${mem.stampPop.has(s.id) ? ' slam' : ''}"${ring ? ` style="--ring:${ring}"` : ''}><span class="kj" lang="ja" style="font-size:${fs}px;${ink}">${esc(s.k)}</span></span>
    ${KIND[s.kind] ? `<em class="kd">${KIND[s.kind]}</em>` : ''}<b>${esc(s.t)}</b><small>${esc(s.r)}</small>
    <span class="who">${marks.map(k => `<i style="background:${famColor(k)}">${famName(k)[0]}</i>`).join('')}</span></button>`;

function daySetHtml(day, title) {

    ${todo.length ? `<div class="stamps">${todo.map(stampHtml).join('')}</div>` : '<p class="gf">¡Todo sellado! 🎉</p>'}

}
function viewSellos() {

  const out = `<section class="pend-hero"><div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="39"/><circle class="fg" cx="50" cy="50" r="39" style="stroke:var(--red);stroke-dashoffset:${245 * (1 - got / STAMPS.length)}"/></svg><b>${got}</b></div>
    <div><h2>${got} de ${STAMPS.length} sellos en familia</h2><p class="per">${per.map(([n, c, v]) => `<span><i style="background:${c}"></i>${n} ${v}</span>`).join('')}</p></div></section>
    <section class="grp"><h2 class="gh"><span>¿Quién está marcando en este teléfono?</span></h2>${meSeg()}${mem.db ? '' : '<p class="gf">Aquí los sellos no se comparten: ábranla desde claude.ai.</p>'}</section>
    ${grp('Premios en familia', PRIZES.map(([n, t]) => row({ cls: 'ld' + (got >= n ? '' : ' done'), lead: ico(I.ticket, got >= n ? 'var(--red)' : 'var(--gray)'), t: esc(t), s: got >= n ? '¡Desbloqueado!' : `Faltan ${n - got} sellos`, tr: got >= n ? '<span class="pill hot">Listo</span>' : `${got}/${n}` })).join(''))}
    ${groups.map(k => `<section class="grp"><h2 class="gh"><span>${k === 'JP' ? 'En todo Japón' : CITY[k].n + ' <span lang="ja">' + CITY[k].jp + '</span>'}</span><span>${STAMPS.filter(s => s.city === k && stampMarks(s.id).length).length}/${STAMPS.filter(s => s.city === k).length}</span></h2><div class="stamps">${STAMPS.filter(s => s.city === k).map(stampHtml).join('')}</div></section>`).join('')}`;

function mePickSheet(then) {

  openSheet('¿Quién marca?', meSeg());
}
function stampTap(id) {
  const me = meKey();
  if (!me) return mePickSheet(id);
  const s = STAMPS.find(x => x.id === id), data = { ...stampData(id) };
  if (!data[me]) {
    data[me] = new Date().toISOString();
    if (mem.stampsDb) mem.stampsDb[id] = data;
    writeStamp(id, data).catch(() => hud('No se pudo guardar el sello'));
    stampFx(s, me);
    return;
  }
  const others = stampMarks(id).filter(k => k !== me);
  openSheet('Quitar sello', `<div class="show"><div class="say">${esc(s.t)}</div><div class="huge" lang="ja" style="color:${famColor(me)}">${esc(s.k)}</div>
    <div class="sub2">¿Quitar el sello de <b>${famName(me)}</b> de este reto?${others.length ? `<br>Los de ${others.map(famName).join(' y ')} se quedan.` : ''}</div></div>
    <div class="playbar"><button type="button" class="play alt" data-sheet-close>Cancelar</button><button type="button" class="play danger-btn" data-unstamp="${id}">Quitar mi sello</button></div>`);

/* El gran sello: llega enorme cubriendo la pantalla, baja, se estampa con un golpe
   (temblor, salpicadura de tinta y vibración) y luego vuela a su lugar en la lista. */
function haptic(pattern) {
  try { if (navigator.vibrate) { navigator.vibrate(pattern); return; } } catch (e) {}
  // iPhone no tiene vibrate(): un interruptor nativo oculto da un toque háptico (Safari 18+)
  try { const l = document.createElement('label'), i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.style.display = 'none'; l.append(i); document.body.append(l); l.click(); l.remove(); } catch (e) {}
}
function stampFx(s, me) {
  const col = famColor(me), n = [...s.k].length;
  if (mem.stampFx) mem.stampFx.done();
  const fx = document.createElement('div');
  fx.className = 'stampfx'; fx.setAttribute('role', 'status');
  fx.innerHTML = `<svg width="0" height="0" aria-hidden="true"><filter id="inkf"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="${Math.floor(Math.random() * 99)}"/><feDisplacementMap in="SourceGraphic" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
    <div class="sfx-stage" style="--c:${col}"><div class="sfx-burst"></div>${Array.from({ length: 14 }, (_, i) => { const a = i / 14 * 6.283 + Math.random() * .4, d = 46 + Math.random() * 16, z = 4 + Math.random() * 12; return `<i class="sfx-dot" style="--x:${(Math.cos(a) * d).toFixed(1)}%;--y:${(Math.sin(a) * d).toFixed(1)}%;--z:${z.toFixed(0)}px"></i>`; }).join('')}
    <div class="sfx-big" style="--c:${col}"><div class="sfx-ink"><span lang="ja" style="--n:${n}">${esc(s.k)}</span></div></div></div>
    <div class="sfx-cap"><small>${KIND[s.kind] || 'Reto'}</small><b>${esc(s.t)}</b><span>¡Sellado por ${famName(me)}!</span></div>`;
  document.body.append(fx);
  const big = fx.querySelector('.sfx-big'), stage = fx.querySelector('.sfx-stage'), cap = fx.querySelector('.sfx-cap');
  let ended = false, timer = 0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finish = () => {
    if (ended) return; ended = true; clearTimeout(timer);
    mem.stampPop.add(s.id); rerender();
    const target = document.querySelector(`#view [data-stamp="${s.id}"] .ink`);
    const out = () => { fx.remove(); if (mem.stampFx === ctl) mem.stampFx = null; };
    fx.classList.add('out');
    if (reduce || !target || !big.animate) { setTimeout(out, 250); return; }
    const a = big.getBoundingClientRect(), b = target.getBoundingClientRect();
    const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2), k = b.width / a.width;
    cap.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' });
    big.animate([{ transform: 'rotate(-8deg)' }, { transform: `translate(${dx}px, ${dy}px) scale(${k}) rotate(-8deg)`, opacity: .9 }], { duration: 480, easing: 'cubic-bezier(.5,0,.2,1)', fill: 'forwards' }).onfinish = out;
  };
  const ctl = { done: finish };
  mem.stampFx = ctl;
  fx.addEventListener('click', finish);
  if (reduce || !big.animate) { haptic(30); timer = setTimeout(finish, 1100); return; }
  // 1) llega enorme, cubriendo la pantalla, y baja acelerando
  big.animate([
    { transform: 'scale(3.4) rotate(-26deg)', opacity: 0, filter: 'blur(10px)' },
    { transform: 'scale(2.6) rotate(-20deg)', opacity: .35, filter: 'blur(6px)', offset: .35 },
    { transform: 'scale(1) rotate(-8deg)', opacity: 1, filter: 'blur(0)' }
  ], { duration: 420, easing: 'cubic-bezier(.6,0,.9,.35)', fill: 'forwards' }).onfinish = () => {
    // 2) ¡golpe!: aplasta, salpica, tiembla y vibra
    haptic([25, 35, 60]);
    fx.classList.add('hit');
    big.animate([{ transform: 'scale(1) rotate(-8deg)' }, { transform: 'scale(1.06, .9) rotate(-8deg)', offset: .25 }, { transform: 'scale(.97, 1.03) rotate(-8deg)', offset: .6 }, { transform: 'scale(1) rotate(-8deg)' }], { duration: 300, easing: 'ease-out' });
    stage.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-9px,6px)' }, { transform: 'translate(8px,-7px)' }, { transform: 'translate(-6px,-4px)' }, { transform: 'translate(5px,5px)' }, { transform: 'translate(-2px,2px)' }, { transform: 'translate(0,0)' }], { duration: 420, easing: 'ease-out' });
    const v = document.querySelector('#view');
    if (v) v.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(7px)' }, { transform: 'translateY(-3px)' }, { transform: 'translateY(0)' }], { duration: 360, easing: 'ease-out' });
    timer = setTimeout(finish, 1250);
  };
}
async function unstamp(id) {

  closeSheet(true); rerender();

/* ---------- preparación de mañana ----------
   Desde las 18:00 (o cuando ya terminó el plan), Hoy muestra lo que conviene dejar listo
   para el día siguiente: despertador, maletas si cambian de hotel, boletos y QR, ropa y efectivo. */
const hmOf = s => (String(s).match(/(\d{1,2}:\d{2})/) || [])[1] || '';
const CASH_CITY = { FJ: 'En Kawaguchiko y los tours del Fuji muchos lugares solo aceptan efectivo.', HD: 'En Shirakawa-gō y Takayama casi todo es en efectivo.' };
function prepHtml(tom, nightBase) {
  if (!tom) return '';
  const first = tom.items[0], L = leaveInfo(tom, '00:00'), moving = !nightBase || nightBase !== tom.base;
  const start = Math.min(toMin(first.t), L ? L.leave : Infinity);
  const wake = start - 60 - (moving && nightBase ? 30 : 0);
  const pid = k => 'prep' + tom.n + '-' + k;
  const task = (k, t, s) => row({ cls: 'li' + (checks()[pid(k)] ? ' done' : ''), lead: checkBtn(pid(k), t), t: esc(t), s: esc(s) });
  const tks = TICKETS.map((t, i) => [t, i]).filter(([t]) => t.day === tom.n);
  const [rk] = RAIN[tom.city], [hi, lo] = tom.wx;
  const ropa = lo <= 1 ? 'abrigo grueso, gorro y guantes' : lo <= 5 ? 'chamarra abrigadora y capas' : 'chamarra ligera';
  const nb = BASES[tom.base], ob = nightBase && BASES[nightBase];
  return grp('Para mañana',
    task('wake', `Despertador ≈ ${fmtHM(wake)}`, `${first.t} · ${first.h}${L ? ` · salir a las ${fmtHM(L.leave)}` : ''}`) +
    (moving ? task('bags', ob ? 'Maletas listas esta noche' : 'Llegada al primer alojamiento', ob ? `Check-out de ${ob.n} a las ${hmOf(ob.out)} · check-in en ${nb.n} desde ${hmOf(nb.in)}` : `Check-in en ${nb.n} desde ${hmOf(nb.in)}`) : '') +
    tks.map(([t, i]) => task('tk' + i, `Tener a la mano: ${t.n}`, t.info)).join('') +
    docsFor([...tks.map(([, i]) => 'tk:' + i), ...(moving ? ['b:' + tom.base] : [])]).map(docRow).join('') +
    (tom.n === 1 ? mem.docs.filter(d => d.cat === 'vuelo').map(docRow).join('') : '') +
    task('ropa', `Ropa para ${hi}° / ${lo}°: ${ropa}`, rk === 'alta' ? 'Lleven paraguas.' : rk === 'nieve' ? 'Posible nieve: calzado antiderrapante.' : rk === 'moderada' ? 'Paraguas plegable por si acaso.' : CITY[tom.city].n + ' suele estar seco.') +
